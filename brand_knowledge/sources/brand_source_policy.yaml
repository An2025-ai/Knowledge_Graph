# Brand Atlas Knowledge Graph — L3 品牌来源策略
# 版本: 1.0.0
# 范围: L3 品牌认知层

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3

# ============================================================
# 来源类型（L3 专用）
# ============================================================

source_types:
  - source_type: enterprise_registry_record
    name: 企业登记或监管记录
    typical_content: 法律主体、登记状态
    default_authority: high
    default_info_class: fact_candidate
    public_output: true

  - source_type: official_website
    name: 官方官网
    typical_content: 品牌名、产品名、联系方式
    default_authority: high_but_biased
    default_info_class: verifiable_attr_fact / self_claim
    public_output: true_subject_to_claim_review

  - source_type: official_product_docs
    name: 官方产品文档
    typical_content: 功能、版本、接口、部署
    default_authority: high_but_biased
    default_info_class: product_spec / self_claim
    public_output: per_document_permission

  - source_type: official_certification_certificate
    name: 官方认证证书
    typical_content: 认证编号、范围、有效期
    default_authority: high
    default_info_class: fact_candidate
    public_output: true_after_cert_verification

  - source_type: internal_approved_material
    name: 企业内部已批准资料
    typical_content: 售前口径、实施规则
    default_authority: business_authority
    default_info_class: internal_fact / self_claim
    public_output: false_by_default

  - source_type: internal_draft
    name: 企业内部草稿
    typical_content: 路线图、未发布功能
    default_authority: low_to_medium
    default_info_class: draft_claim
    public_output: false

  - source_type: customer_case_testimonial
    name: 客户案例和证言
    typical_content: 使用结果、评价
    default_authority: medium
    default_info_class: attributed_claim
    public_output: upon_authorization

  - source_type: l2_authoritative_third_party
    name: L2 权威第三方来源
    typical_content: 行业标准、独立报告
    default_authority: high_or_medium
    default_info_class: fact / third_party_claim
    public_output: per_source_license

  - source_type: search_result
    name: 搜索结果
    typical_content: 页面发现、排名
    default_authority: low
    default_info_class: observation
    public_output: enters_L4

# ============================================================
# 排除项
# ============================================================

excluded_source_classes:
  list:
    - community
    - social_media
    - ugc_review
    - forum
    - creator_platform
  note: >
    社区网站和普通 UGC 当前不属于 L3 采集范围。
    若未来启用，必须作为低权威 observation/user_review 隔离，
    不能与官方资料混合晋升。

# ============================================================
# 来源优先级不是覆盖优先级
# ============================================================

priority_rules:
  description: >
    更新、更官方的资料可作为当前展示优先项，但不得覆盖历史记录。
  decision_flow:
    - step: 识别是否为同一主体、谓词、产品版本和适用条件
    - step: 能用版本或时间解释 → 建立 supersedes/validity，不视为错误
    - step: 能用客户层级或部署方案解释 → 保留两个条件化 Assertion
    - step: 仍无法解释 → 创建 Conflict，进入人工审核

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes: 初始版本，定义 9 种 L3 品牌来源类型和排除项
    author: Brand Atlas Team