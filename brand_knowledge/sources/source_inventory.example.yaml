# Brand Atlas Knowledge Graph — L3 来源清单模板
# 版本: 1.0.0
# 用途: 品牌接入时登记每一份资料来源实例

meta:
  version: 1.0.0
  created_at: 2026-08-11
  status: active
  scope: brand
  layer: L3

# 每份资料创建一条 source_instance + document
source_instances:
  - source_id: src_example_official_001
    tenant_id: tenant_example
    brand_id: brand_example
    source_type: official_website
    publisher: <品牌名>
    canonical_url: <官方URL>
    external_path: null
    retrieved_at: 2026-08-11
    published_at: null
    document_version: null
    language: zh-CN
    mime_type: text/html
    content_hash: null
    access_level: public
    allowed_task_types: [identity, product_portfolio, messaging]
    allowed_output_channels: [internal_analysis, public_content]
    license: null
    owner: <部门>
    status: registered

# 权限字段（每个 Document / Chunk / Evidence / Assertion 至少保存）
permission_fields:
  access_level: public | internal | confidential | restricted
  allowed_task_types: [...]
  allowed_output_channels: internal_analysis | customer_report | public_content
  contains_pii: boolean
  contains_trade_secret: boolean
  embargo_until: timestamp | null
  owner_department: string | null

# 权限传播规则
permission_propagation:
  description: 权限必须沿证据链向下游传播
  rule: 公开网页不能引用只由 confidential 证据支持的结论

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes: 初始版本，来源实例登记模板和权限字段定义
    author: Brand Atlas Team