# Brand Atlas Knowledge Graph — L3 DeepCleer 试点：缺失信息
# 版本: 1.0.0
# 用途: DeepCleer 试点当前缺失的信息，不得由模型补齐（Section 14.6）

meta:
  version: 1.0.0
  created_at: 2026-08-11
  status: example
  scope: brand
  layer: L3

missing_information:
  - item: 品牌与公司法律关系的正式登记或商标依据
    category: identity

  - item: 各产品的正式产品边界、当前版本和命名策略
    category: product_portfolio

  - item: 能力上线状态、套餐差异和部署条件
    category: capability

  - item: 认证证书编号、认证主体、认证范围和有效期
    category: security_compliance

  - item: 性能测试环境、数据规模定义、并发和响应时间统计方法
    category: proof_and_case

  - item: ROI 案例的客户样本、时间窗口和计算方法
    category: proof_and_case

  - item: 公开可引用客户案例及授权范围
    category: proof_and_case

  - item: 当前 SLA、套餐和客户等级的对应关系
    category: service_and_poc

  - item: 产品路线图中"即将上线"能力的当前状态
    category: product_portfolio

  - item: 对竞品名称和比较材料的法务批准口径
    category: competition_mapping

note: 这些缺失项应输出为 missing_information，不能由模型补齐。

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes: 初始版本，DeepCleer 试点缺失信息
