# Brand Atlas Knowledge Graph — L3 DeepCleer 试点：冲突清单
# 版本: 1.0.0
# 用途: DeepCleer 试点发现的冲突和限定项（Section 14.4）

meta:
  version: 1.0.0
  created_at: 2026-08-11
  status: example
  scope: brand
  layer: L3

conflicts:
  - issue: 目标规模出现月 GMV 1000 万以上、5000 万+已验证、年 GMV 1 亿以上
    conflict_type: scope_conflict
    handling: 分成适用阈值、验证案例和目标画像三个谓词；不做数值覆盖

  - issue: 店铺建议出现 50 家以上和 100 家以上
    conflict_type: scope_conflict
    handling: 建立条件化 Assertion 和冲突记录，待产品负责人确认当前口径

  - issue: QA 文件名 V2.1，封面写 V2.0
    conflict_type: document_version_conflict
    handling: 保留两种版本信号并人工确认

  - issue: DCCLaw 与 AI 智能体构建工厂的定位不同
    conflict_type: naming_conflict
    handling: 不自动合并产品实体，建立 possible_same_product 候选

  - issue: P0 15 分钟电话响应与 30 分钟故障响应
    conflict_type: sla_conflict
    handling: 按 SLA 类型、客户等级和材料版本拆分，待确认公开口径

  - issue: "全行业首个、最全最准、唯一"
    conflict_type: absolute_claim
    handling: 绝对化 self_claim，默认禁止公开复用，除非有独立证据和法务批准

  - issue: 等保三级、ISO 27001、ISO 27701
    conflict_type: certification_claim
    handling: 官方认证主张；需证书编号、范围和有效期核验后晋升 fact

  - issue: 释放 5 至 8 个 HC、节省 100 万+/年
    conflict_type: quantified_claim
    handling: 量化 self_claim；仅适用于材料中的参考客户假设

  - issue: 客户评价为匿名展示
    conflict_type: attribution
    handling: attributed_claim；不得推断客户身份或普遍效果

changelog:
