# Brand Atlas — 词典：产品/服务术语（candidate_pre_extraction 使用）
# 版本: 1.0.0
# 用途: 识别产品/平台/系统名候选（用于页面标题/简介匹配）

meta:
  version: 1.0.0
  created_at: 2026-08-12
  status: active
  scope: brand
  layer: L3

# 产品名词后缀（用于识别"XX平台/系统/产品"）
product_suffixes:
  - 平台
  - 系统
  - 产品
  - 方案
  - 软件
  - 应用
  - 工具
  - 服务
  - 引擎
  - 智能体
  - 机器人
  - 助手

# 产品名模式
product_pattern: '[一-龥A-Za-z0-9]{2,30}(?:平台|系统|产品|方案|软件|应用|工具|服务|引擎|智能体|机器人|助手)'