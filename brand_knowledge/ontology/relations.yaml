# Brand Atlas Knowledge Graph — L3 图谱关系定义
# 版本: 1.0.0
# 范围: L3 品牌认知层

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3

# ============================================================
# 核心关系
# ============================================================

relations:
  - relation: owns_brand
    description: 组织拥有品牌
    description_en: Organization owns brand
    subject_types: [organization]
    object_types: [brand]
    l1_status: new_v122  # pending L1 v1.2.0
    cardinality: many-to-many

  - relation: offers
    description: 品牌提供产品
    description_en: Brand offers product
    subject_types: [brand]
    object_types: [product]
    l1_status: new_v122  # pending L1 v1.2.0
    cardinality: many-to-many

  - relation: version_of
    description: 产品版本属于产品
    description_en: Product version is a version of product
    subject_types: [product_version]
    object_types: [product]
    l1_status: new_v122  # pending L1 v1.2.0
    cardinality: many-to-one

  - relation: supersedes
    description: 版本或口径替代链
    description_en: Version or channel replaces another
    subject_types: [product_version, assertion]
    object_types: [product_version, assertion]
    l1_status: new_v122  # pending L1 v1.2.0
    cardinality: many-to-many

  - relation: operates_in
    description: 品牌在某个行业运营
    subject_types: [brand]
    object_types: [industry]
    l1_status: shared

  - relation: belongs_to
    description: 产品属于某品类
    subject_types: [product]
    object_types: [category]
    l1_status: shared

  - relation: has_capability
    description: 产品具备能力
    subject_types: [product]
    object_types: [capability]
    l1_status: shared

  - relation: supports_use_case
    description: 产品支持使用场景
    subject_types: [product]
    object_types: [use_case]
    l1_status: shared

  - relation: solves
    description: 产品解决问题
    subject_types: [product]
    object_types: [problem]
    l1_status: shared

  - relation: serves
    description: 产品服务用户角色
    subject_types: [product]
    object_types: [audience]
    l1_status: shared

  - relation: capability_supports_use_case
    description: 能力支撑使用场景
    subject_types: [capability]
    object_types: [use_case]
    l1_status: shared

  - relation: covers
    description: 内容覆盖主题
    subject_types: [content]
    object_types: [topic]
    l1_status: shared

  - relation: competes_with
    description: 品牌或产品竞争关系
    subject_types: [brand, product]
    object_types: [brand, product]
    l1_status: shared

  - relation: supported_by
    description: 断言被证据支持
    description_en: Assertion supported by evidence
    subject_types: [assertion]
    object_types: [evidence]
    l1_status: storage_level
    cardinality: many-to-many

  - relation: contradicts
    description: 断言之间存在冲突
    subject_types: [assertion]
    object_types: [assertion]
    l1_status: shared

# ============================================================
# 约束
# ============================================================

constraints:
  no_product_has_decision_factor:
    rule: 不创建 Product → HAS_DECISION_FACTOR 关系
    note: 产品的决策因素通过 Product → Category/Audience → DecisionFactor 路径获得，不直接创建违反 L1 类型约束的关系。
  product_version_scope:
    rule: 能力、定价、命名和限制随版本变化，断言必须限定 product_version
  evidence_required_for_capability:
    rule: 不允许仅因文档出现相似关键词就建立 HAS_CAPABILITY，需至少一句直接支持的 Evidence Span

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes: 初始版本，定义 L3 核心关系
    author: Brand Atlas Team