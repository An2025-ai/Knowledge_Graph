# Brand Atlas Knowledge Graph — L3 assertion_kind 枚举
# 版本: 1.0.0
# 范围: L3 品牌认知层

meta:
  version: 1.0.0
  created_at: 2026-08-11
  status: active
  scope: brand
  layer: L3
  note: >
    纯粹的业务语义，补充 L1 statement_class
    （fact/claim/observation/inference 保持不变）。

assertion_kinds:
  - kind: identity_fact
    description: 身份事实（品牌名、域名、法律主体）
    info_class: fact
    public_output: true

  - kind: product_spec
    description: 产品规格（功能、接口、部署方式）
    info_class: fact / self_claim
    public_output: per_document_permission

  - kind: self_claim
    description: 品牌自述（能力、价值主张）
    info_class: claim
    public_output: subject_to_claim_review

  - kind: attributed_claim
    description: 归因主张（客户证言、案例结果）
    info_class: claim
    public_output: upon_authorization

  - kind: third_party_fact
    description: 第三方事实（行业标准、独立数据）
    info_class: fact
    public_output: per_source_license

  - kind: internal_fact
    description: 内部事实（已批准的内部口径）
    info_class: fact
    public_output: false_by_default

  - kind: draft_claim
    description: 草稿主张（路线图、未发布功能）
    info_class: claim
    public_output: false

  - kind: inference
    description: 推断（基于多条前提推导）
    info_class: inference
    public_output: not_as_stable_fact

# L1 statement_class ↔ L3 assertion_kind 映射
mapping:
  fact: [identity_fact, third_party_fact]
  claim: [self_claim, attributed_claim, draft_claim]
  fact_conditional: [product_spec, internal_fact]
  inference: [inference]

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes: 初始版本，定义 8 种 assertion_kind
    author: Brand Atlas Team