# Brand Atlas — 规则：关系模式（candidate_pre_extraction 使用）
# 版本: 1.0.0
# 用途: 从文档结构/文本模式抽取关系候选

meta:
  version: 1.0.0
  created_at: 2026-08-12
  status: active
  scope: brand
  layer: L3

# 每种模式：relation=关系类型, pattern=正则/文本模式, note=说明
relation_patterns:
  - relation: offers
    pattern: '(?:品牌|公司|集团)\s*[：:]\s*(.*?)[、，,]?\s*(?:旗下|提供|推出|主打)+'
    note: 品牌推出产品（页面标题/简介）
  - relation: has_capability
    pattern: '(?:支持|具备|提供|实现)\s*(?:[^，。；]{2,20}?)?(?:能力|功能|特性)'
    note: 产品能力（功能段落）
  - relation: solves
    pattern: '(?:解决|攻克|应对|缓解)\s*(?:[^，。；]{2,30}?)?(?:问题|痛点|挑战)'
    note: 产品解决问题
  - relation: serves
    pattern: '(?:面向|服务|针对|适合)\s*(?:[^，。；]{2,20}?)?(?:客户|用户|企业|团队|人群)'
    note: 产品服务用户
  - relation: belongs_to
    pattern: '(?:属于|归类|属于)\s*(?:[^，。；]{2,20}?)?(?:品类|类别|领域)'
    note: 产品归属品类