# Brand Atlas — 规则：认证模式（candidate_pre_extraction 使用）
# 版本: 1.0.0
# 用途: 抽取认证/合规候选

meta:
  version: 1.0.0
  created_at: 2026-08-12
  status: active
  scope: brand
  layer: L3

certification_patterns:
  - type: iso
    regex: 'ISO\s*\d+(?:[-/]\d+)?(?:[-:]\d+)?'
    note: ISO 认证（如 ISO 27001）
  - type: etc_grading
    regex: '等保\s*(?:三级|二级|四级)'
    note: 等保等级（如等保三级）
  - type: security
    regex: '(?:SOC|CMMI|GDPR|CCPA|等保|等保测评|商用密码)'
    note: 安全/合规认证名称
  - type: cert_number
    regex: '(?:证书编号|认证编号)\s*[：:]?\s*[A-Za-z0-9-]+'
    note: 证书编号