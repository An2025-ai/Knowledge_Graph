# Brand Atlas — 规则：实体模式（candidate_pre_extraction 使用）
# 版本: 1.0.0
# 用途: 用正则从文本中确定性抽取实体候选，避免 LLM 处理简单事实

meta:
  version: 1.0.0
  created_at: 2026-08-12
  status: active
  scope: brand
  layer: L3

# 每种模式：type=candidate_type, regex=正则, note=说明
entity_patterns:
  - type: url
    regex: "https?://[^\\s<>\"'）)]+"
    note: 官网/域名候选
  - type: email
    regex: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
    note: 联系邮箱
  - type: phone
    regex: '(?:\+?86[- ]?)?1[3-9]\d{9}'
    note: 中国大陆手机号
  - type: version
    regex: 'V\d+(?:\.\d+){0,3}|v\d+(?:\.\d+){0,3}|版本\s*\d+(?:\.\d+){0,3}'
    note: 版本号（如 V2.1）
  - type: percentage
    regex: '\d+(?:\.\d+)?%'
    note: 百分比（如 99.9%）
  - type: price
    regex: '(?:¥|￥|RMB|CNY)?\s*\d+(?:,\d{3})*(?:\.\d+)?\s*(?:万|亿|元|美元|USD)?'
    note: 金额（含单位）
  - type: date
    regex: '\d{4}[-/年]\d{1,2}[-/月]\d{1,2}日?|\d{4}[-/年]\d{1,2}月?'
    note: 日期
  - type: sla
    regex: 'P0?[0-9]?\s*(?:分钟|小时|工作日|天)|(?:响应|故障|到场)\s*(?:时间|标准)\s*[：:]\s*\d+\s*(?:分钟|小时|工作日|天)'
    note: SLA 响应时间（如 P0 15分钟）