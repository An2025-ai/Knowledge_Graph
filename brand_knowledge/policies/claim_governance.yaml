# Brand Atlas Knowledge Graph — L3 品牌口径治理策略
# 版本: 1.0.0
# 范围: L3 品牌认知层
# 参考: brand_knowledge/README.md §7.10 品牌信息与内容资产域, §8.10 审核与晋升, §5 品牌接入需求

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3
  description: >
    定义 L3 品牌认知层的 Approved / Restricted / Prohibited 三类口径治理规则。
    Approved Claim 是允许公开使用的口径；Restricted Claim 只能内部分析；
    Prohibited Claim 禁止使用或需法务确认。治理对象包括语气、术语、产品标准名、
    旧名称和禁用名称。public_content_requires_approved_claims 为接入级策略，
    绝对化主张（唯一/首个/领先/最全/最准）默认禁止公开复用，除非有独立证据
    和法务批准。

# ============================================================
# 口径分类
# ============================================================

claim_classification:
  - type: approved_claim
    alias: Approved Claim
    description: 允许公开使用的品牌口径
    usable_channels: [public_content, customer_report, internal_analysis]
    required_evidence:
      - 直接支持该口径的 Evidence Span
      - 品牌口径已获批准
    example: 官方资料明确支持且已批准的多法人合并能力表述

  - type: restricted_claim
    alias: Restricted Claim
    description: 只能内部分析使用的口径
    usable_channels: [internal_analysis]
    note: 可进入 customer_report 需单独授权
    example: 未经最终确认的定价、SLA 或客户等级口径

  - type: prohibited_claim
    alias: Prohibited Claim
    description: 禁止使用或需法务确认的口径
    usable_channels: []
    default_actions:
      - 禁止公开复用
      - 需法务确认后方可评估
    example: 绝对化主张、未经授权的竞品比较、未证实的市场第一

# ============================================================
# 口径管理项
# ============================================================

claim_management:
  description: 管理语气、术语、产品标准名、旧名称和禁用名称
  dimensions:
    - dimension: tone
      description: 语气规范
      rules:
        - 保持客观可核验，不放大绝对化承诺
        - 品牌原话作为 self_claim 保存，不改写为客观事实

    - dimension: terminology
      description: 术语口径
      rules:
        - 使用 Approved 术语字典，避免同义混用
        - 行业术语优先引用 L2 规范能力 ID

    - dimension: product_standard_name
      description: 产品标准名
      rules:
        - 每个产品/版本的公开名称必须来自 Approved 标准名
        - 标准名变更走审批流，不直接改公开口径

    - dimension: old_name
      description: 旧名称
      rules:
        - 旧名称作为别名保留，标注历史，不覆盖标准名
        - 涉及旧名称的对外表述需确认是否允许

    - dimension: banned_name
      description: 禁用名称
      rules:
        - 法律或品牌指定的禁用名称禁止出现在任何对外内容
        - 命中禁用名称时阻断发布并告警

# ============================================================
# 对外开放门槛
# ============================================================

public_content_gate:
  description: 对外内容采用 approved claims 的硬门槛

  requirement: public_content_requires_approved_claims
  default: true
  config_source: 品牌接入需求 output_policies.public_content_requires_approved_claims

  rules:
    - rule: approved_only_public
      description: 进入 public_content 的表述必须为 approved_claim
      forbidden: 将 restricted / prohibited 口径直接公开

    - rule: approved_with_attribution
      description: 引用属名或客户案例时需授权并标注 attribution
    - rule: unchanged_by_version
      description: 口径随产品版本限定，旧版本口径不冒用为新版本

# ============================================================
# 绝对化主张治理
# ============================================================

absolute_claims:
  description: 绝对化主张（唯一/首个/领先/最全/最准）默认禁止公开复用

  detection_terms:
    - 唯一
    - 首个
    - 领先
    - 最全
    - 最准
    - 第一
    - 最强

  default_status: prohibited
  promotion_conditions:
    - 存在独立于品牌的第三方证据或可核验数据
    - 已获法务批准
    - 审查通过并转为 approved_claim
  actions_if_absent:
    - 保持 prohibited / restricted，禁止公开
    - 创建审核任务，由法务或品牌管理员决策

  notes:
    - 绝对化 self_claim 默认禁止公开复用（README §14.4）
    - 除非有独立证据和法务批准，不升为 approved_claim

# ============================================================
# 治理流程
# ============================================================

governance_flow:
  steps:
    - step: extract
      description: 从资料抽取候选口径
    - step: classify
      description: 按 approved / restricted / prohibited 初判
    - step: verify
      description: 校验证据链与权限传播是否满足分类要求
    - step: approve
      description: 品牌管理员 / 法务批准 approved_claim
    - step: publish
      description: 仅 approved_claim 可进入 public_content

  forbidden:
    - 把品牌宣传语自动升级为客观事实
    - 在法务批准前公开 prohibited 口径
    - 用 approved_claim 名称掩盖未验证内容

# ============================================================
# 变更记录
# ============================================================

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义 approved / restricted / prohibited 三类口径
      - 建立语气、术语、产品标准名、旧名和禁用名治理
      - 定义 public_content_requires_approved_claims 门槛
      - 建立绝对化主张默认禁止公开的治理规则
    author: Brand Atlas Team