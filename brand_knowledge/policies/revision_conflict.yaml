# Brand Atlas Knowledge Graph — L3 修订与冲突处理策略
# 版本: 1.0.0
# 范围: L3 品牌认知层
# 参考: brand_knowledge/README.md §6.2 来源优先级不是覆盖优先级, §10.3 约束和索引

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3
  description: >
    定义 L3 品牌认知层的修订与冲突处理规则。核心原则：来源优先级不是覆盖
    优先级。更新、更官方的资料可作为当前展示优先项，但不得覆盖历史记录。
    冲突处理遵循识别同一主体/谓词/产品版本/适用条件 → 版本或时间解释 →
    customer-tier / 部署方案解释 → 仍无法解释则创建 Conflict 进入人工审核的
    决策流。系统永不自动合并或覆盖冲突记录。覆盖命名冲突、文档版本冲突、
    SLA 冲突和范围冲突四类冲突。

# ============================================================
# 核心原则
# ============================================================

core_principles:
  - principle: source_priority_is_not_overwrite_priority
    description: 来源优先级决定展示优先级，不代表可覆盖历史记录
    example: 更新或更官方的资料可作为当前展示优先项，但历史记录必须保留

  - principle: never_auto_merge
    description: 系统永不自动合并冲突记录
  - principle: never_overwrite
    description: 系统永不原地覆盖冲突记录
  - principle: retain_history
    description: 冲突双方的证据与版本都保留

# ============================================================
# 冲突决策流
# ============================================================

conflict_decision_flow:
  description: 差异数据处理的标准决策流

  flow:
    - step: 1
      name: identify_same
      action: 识别是否为同一主体(subject)、谓词(predicate)、产品版本(product_version)和适用条件(condition)

    - step: 2
      name: version_or_time
      condition: 能用版本或时间解释
      action: 建立 supersedes / validity 关系，不视为错误
      note: 保留新旧版本的有效期与证据

    - step: 3
      name: customer_tier_or_deployment
      condition: 能用客户层级(customer-tier)或部署方案(deployment)解释
      action: 保留两个条件化 Assertion
      note: 分别限定 scope.customer_tier / scope.deployment_type，不覆盖

    - step: 4
      name: create_conflict
      condition: 仍无法解释
      action: 创建 Conflict，进入人工审核

  never:
    - auto_merge_conflicts
    - overwrite_on_priority
    - silent_resolution
    - pick_newer_without_record

# ============================================================
# 冲突类型
# ============================================================

conflict_types:
  - type: naming_conflict
    description: 命名与实体识别冲突
    applies_to: 产品、品牌、模块、版本命名不一致或疑似为同一对象的不同写法
    handling:
      - 不自动按名称相似合并实体
      - 建立 possible_same / possible_distinct 候选
      - 交产品负责人确认是同一产品的命名演进、不同版本还是两条产品线
    example: DCCLaw 桌面智能体 与 AI 智能体构建工厂 定位不同，不自动合并

  - type: document_version_conflict
    description: 文档版本信号相互冲突
    applies_to: 文件名、封面、页眉、元数据和正文版本号不一致
    handling:
      - 保留全部版本信号
      - 不默认选择新版或旧版
      - 创建 conflict 记录并人工确认
    example: QA 文件名 V2.1、封面写 V2.0，保留两种版本信号并人工确认

  - type: sla_conflict
    description: 服务等级承诺冲突
    applies_to: 响应时间、到场时间、服务时段和 SLA 数值不一致
    handling:
      - 按 SLA 类型、客户等级和材料版本拆分
      - 保留条件化 Assertion（如 P0 电话响应 vs 故障响应）
      - 待确认公开口径再进行统一
    example: P0 15 分钟电话响应 与 30 分钟故障响应，按类型和客户等级拆分

  - type: scope_conflict
    description: 适用范围或数值阈值冲突
    applies_to: 目标规模、适用条件、样本和统计口径不一致
    handling:
      - 拆分为不同适用阈值、验证案例或目标画像的谓词
      - 不做数值覆盖
      - 建立条件化 Assertion 和冲突记录，待产品/业务负责人确认当前口径
    example: 月 GMV 1000 万以上 与 5000 万+ 已验证，拆为适用阈值、验证案例与目标画像

# ============================================================
# 冲突记录
# ============================================================

conflict_record:
  description: 无法解释的差异写入 knowledge_conflict 表进入人工审核

  reference_section: README §10.1 knowledge_conflict

  required_fields:
    - conflict_type
    - tenant_id
    - brand_id
    - assert_id_a
    - assert_id_b
    - conflict_reason
    - conflict_status
    - created_at

  statuses:
    - open
    - under_review
    - resolved
    - superseded

  resolution:
    - action: keep_both_conditional
      condition: 能通过客户层级或部署方案拆分
    - action: supersede
      condition: 经人工确认为版本演进
    - action: mark_error
      condition: 确认单一来源为错误或过期
    - action: add_qualifier
      condition: 需要补充限定条件（如测量方法、样本）

# ============================================================
# 变更记录
# ============================================================

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，确立来源优先级不是覆盖优先级
      - 建立 4 步冲突决策流（识别/版本解释/条件解释/人工审核）
      - 添加 naming、document_version、sla、scope 四类冲突处理
      - 定义 Conflict 记录表和状态流转
    author: Brand Atlas Team