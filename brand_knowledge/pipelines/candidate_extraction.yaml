# Brand Atlas 第三层品牌认知层 — 管道定义：候选抽取
# 版本: 1.0.0
# 范围: 三路并行抽取实体、关系和命题候选，由 Extraction Profile 约束维度

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3

pipeline:
  id: pipeline_l3_candidate_extraction
  name: 候选抽取
  name_en: Candidate Extraction
  version: 1.0.0
  purpose: >
    采用三路并行方式从分块后的文档中抽取候选：字典和规则路径
    抽取品牌名、产品名、URL、版本号、日期、金额、单位、认证
    编号、联系方式、表格字段；LLM Schema 路径抽取用户、问题、
    JTBD、能力、场景、关系、主张、限制和隐含条件；版式和结构
    路径抽取标题归属、FAQ 问答、能力矩阵、对比表、流程图、产品
    架构图。LLM 抽取维度必须由 Extraction Profile 预先固定，模型
    可提出 unknown_candidate 但不能创建新的实体或关系类型。
  description: >
    候选抽取管道是品牌知识构建的核心工序之一。它采用三路并行
    候选策略，从分块后的文档中抽取结构化的实体、关系和命题候选。
    字典和规则路径通过预定义的模式精确抽取品牌名、产品名、URL、
    版本号等结构化信息；LLM Schema 路径在 Extraction Profile 约束
    下抽取用户、问题、JTBD、能力、场景等语义信息；版式和结构路径
    利用文档版式抽取标题归属、FAQ 问答、能力矩阵和架构图信息。
    管道强调 LLM 抽取维度必须由 Extraction Profile 预先固定，允许
    模型提出 unknown_candidate，但严格禁止模型自行创建新的实体
    类型或关系类型。

  steps:
    - step: 1
      name: 加载抽取配置文件
      name_en: Load Extraction Profile
      description: 加载每个章节的 Extraction Profile，固定允许的实体类型和关系类型
      inputs:
        - chunked_document
        - extraction_profile_registry
      outputs:
        - per_section_profiles: 每个章节的抽取配置（allowed_entity_types、allowed_relation_types、required_assertion_fields、reject_if）
      rules:
        - profile_must_match_section
        - llm_dimensions_must_be_pre_fixed

    - step: 2
      name: 字典和规则抽取
      name_en: Dictionary and Rule Extraction
      description: 通过字典和规则抽取品牌名、产品名、URL、版本号、日期、金额、单位、认证编号、联系方式、表格字段
      inputs:
        - section_chunks
        - extraction_dictionary
        - extraction_rules
      outputs:
        - rule_candidates: 规则路径抽取的候选（结构化的确定性信息）
      rules:
        - rule_matches_must_be_exact
        - table_fields_must_be_recorded

    - step: 3
      name: LLM Schema 抽取
      name_en: LLM Schema Extraction
      description: 在 Extraction Profile 约束下用 LLM 抽取用户、问题、JTBD、能力、场景、关系、主张、限制和隐含条件
      inputs:
        - evidence_spans
        - per_section_profiles
        - llm_extraction_model
      outputs:
        - llm_candidates: LLM 路径抽取的候选（含维度、内容和置信度）
      rules:
        - llm_must_follow_profile_dimensions
        - unknown_candidate_allowed_with_marker
        - model_must_not_create_new_types

    - step: 4
      name: 版式和结构抽取
      name_en: Layout and Structure Extraction
      description: 通过版式和结构抽取标题归属、FAQ 问答、能力矩阵、对比表、流程图、产品架构图
      inputs:
        - structured_content
        - boundary_hierarchy
      outputs:
        - structural_candidates: 版式路径抽取的候选（标题归属、FAQ、矩阵、对比表、流程图、架构图）
      rules:
        - title_attribution_must_be_preserved
        - faq_qa_pairs_must_be_linked
        - diagrams_must_map_to_figures

    - step: 5
      name: 合并候选
      name_en: Merge Candidates from Three Paths
      description: 合并三路候选，按来源和维度去重并关联证据跨度
      inputs:
        - rule_candidates
        - llm_candidates
        - structural_candidates
      outputs:
        - merged_candidates: 合并后的候选列表（含抽取路径、事件跨度、去重标记）
      rules:
        - candidates_must_attach_evidence_spans
        - cross_path_duplicates_must_be_marked

    - step: 6
      name: 输出候选批次
      name_en: Output Candidate Batch
      description: 输出候选批次和抽取清单
      inputs:
        - merged_candidates
        - per_section_profiles
      outputs:
        - candidate_batch: 候选批次（实体候选、关系候选、命题候选）
        - extraction_manifest: 抽取清单（各路径候选数量、维度覆盖、unknown_candidate 统计）
      rules:
        - batch_must_include_manifest
        - batch_must_track_unknown_candidates

  inputs:
    - chunked_document:
        description: 分块后的文档（Section Chunk、Evidence Span、Context Window）
        source: 语义分块管道输出
        fields: [chunking_id, section_chunks, evidence_spans, context_windows, source_id]
    - extraction_profile_registry:
        description: Extraction Profile 注册表（按章节定义抽取维度、允许类型、必填字段、拒绝条件）
        source: 抽取配置管理
        fields: [profile_id, applies_to_sections, allowed_entity_types, allowed_relation_types, required_assertion_fields, reject_if]
    - extraction_dictionary:
        description: 抽取字典（品牌名、产品名、认证编号等受控词条）
        source: 品牌词典管理
        fields: [entry_id, entry_text, entry_type, aliases, canonical_form]
    - extraction_rules:
        description: 抽取规则（URL、版本号、日期、金额、单位等的模式）
        source: 规则管理
        fields: [rule_id, target_type, pattern, field_extractors, priority]
    - llm_extraction_model:
        description: LLM 抽取模型（在 Profile 约束下执行 Schema 抽取）
        source: 模型注册表
        fields: [model_id, model_version, extraction_capabilities, temperature, max_tokens]
    - structured_content:
        description: 结构化内容树（用于版式和结构抽取）
        source: 版式感知解析管道输出
        fields: [structure, node_type, content, bounding_box, image_ref]

  outputs:
    output_schema: candidate_batch
    output_fields:
      - batch_id: 候选批次唯一标识
      - chunking_id: 关联的分块批次 ID
      - entity_candidates:
          type: array
          description: 实体候选列表
          item_fields:
            - candidate_id: 候选 ID
            - entity_text: 实体文本
            - entity_type: 实体类型（来自 Profile）
            - extraction_path: 抽取路径（rule / llm / structural）
            - evidence_span_ids: 证据跨度 ID 列表
            - confidence: 置信度
            - is_unknown: 是否为 unknown_candidate
      - relation_candidates:
          type: array
          description: 关系候选列表
          item_fields:
            - candidate_id: 候选 ID
            - relation_type: 关系类型（来自 Profile）
            - subject_ref: 主体引用
            - object_ref: 客体引用
            - extraction_path: 抽取路径
            - evidence_span_ids: 证据跨度 ID 列表
            - confidence: 置信度
      - statement_candidates:
          type: array
          description: 命题候选列表（assertion_fields）
          item_fields:
            - candidate_id: 候选 ID
            - subject_ref: 主体引用
            - predicate: 谓词
            - object_ref_or_value: 客体引用或值
            - statement_class: 陈述类别
            - evidence_span: 证据跨度
            - product_version_scope: 产品版本范围
            - limitations: 限制条件
      - extraction_manifest: 抽取清单（各路径候选数量、维度覆盖、unknown_candidate 统计）

  rules:
    - rule: profile_must_match_section
      description: 加载的抽取配置必须与目标章节匹配
      severity: critical

    - rule: llm_dimensions_must_be_pre_fixed
      description: LLM 抽取维度必须由 Extraction Profile 预先固定，不可临时新增
      severity: critical

    - rule: rule_matches_must_be_exact
      description: 字典和规则匹配必须精确，不使用模糊匹配
      severity: high

    - rule: table_fields_must_be_recorded
      description: 表格字段抽取必须保留字段名和值
      severity: high

    - rule: llm_must_follow_profile_dimensions
      description: LLM 必须严格遵循 Profile 中的维度进行抽取
      severity: critical

    - rule: unknown_candidate_allowed_with_marker
      description: 模型可以提出 unknown_candidate，但必须标记且不能直接晋升
      severity: high

    - rule: model_must_not_create_new_types
      description: 模型严禁自行创建新的实体类型或关系类型
      severity: critical

    - rule: title_attribution_must_be_preserved
      description: 标题归属关系必须被保留（内容归属于哪个标题）
      severity: high

    - rule: faq_qa_pairs_must_be_linked
      description: FAQ 的问和答必须作为配对保留
      severity: high

    - rule: diagrams_must_map_to_figures
      description: 流程图和架构图必须映射到对应的 figure 节点
      severity: high

    - rule: candidates_must_attach_evidence_spans
      description: 每个候选必须关联至少一个证据跨度
      severity: critical

    - rule: cross_path_duplicates_must_be_marked
      description: 跨路径重复的候选必须标记，不可静默删除
      severity: high

    - rule: batch_must_include_manifest
      description: 候选批次输出必须包含抽取清单
      severity: high

    - rule: batch_must_track_unknown_candidates
      description: 候选批次必须跟踪 unknown_candidate 的数量和类型
      severity: high

  failure_mode: extraction_quality_insufficient
  failure_handling:
    condition: 抽取覆盖率过低、LLM 违反 Profile 约束创建新类型或大量候选缺少证据跨度
    action: 生成抽取质量报告，标记低质量路径，拒绝输出候选批次，调整 Profile 或模型后重新抽取
    recovery: 优化 Extraction Profile、更新抽取模型或补充字典规则后重新抽取

  quality_checks:
    - check: extraction_path_coverage
      description: 确认三路抽取均有产出
      method: 检查 rule_candidates、llm_candidates、structural_candidates 均非空（或记录为空原因）

    - check: profile_adherence
      description: 确认抽取的实体和关系类型都在 Profile 允许范围内
      method: 比对 entity_type 和 relation_type 与 per_section_profiles 的定义

    - check: evidence_span_attachment
      description: 确认所有候选都附带了证据跨度
      method: 检查每个候选的 evidence_span_ids 非空

    - check: unknown_candidate_rate
      description: 确认 unknown_candidate 占比合理
      method: 计算 unknown_candidate 在总候选中的占比，超过阈值触发告警

    - check: type_creation_violation
      description: 确认没有模型创建的非法类型
      method: 检查所有候选的 entity_type 和 relation_type 是否在允许列表中

    - check: cross_path_dedup_coverage
      description: 确认跨路径重复被正确标记
      method: 检查重复候选的 cross_path_duplicates 标记的一致性

    - check: faq_qa_preservation
      description: 确认 FAQ 问答对未丢失
      method: 检查 FAQ 相关候选的 question 和 answer 是否成对

  metric_refs: []
  # 预留：candidates_per_document, extraction_path_distribution, unknown_candidate_rate, evidence_span_coverage

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义 L3 候选抽取管道
      - 实现字典规则、LLM Schema 和版式结构三路并行抽取
      - 遵循 L3 规范 §8.5，LLM 维度由 Extraction Profile 固定
      - 包含 6 个管道步骤、14 条规则和 7 项质量检查
    author: Brand Atlas Team