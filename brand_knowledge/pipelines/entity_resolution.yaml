# Brand Atlas 第三层品牌认知层 — 管道定义：实体归一和消歧
# 版本: 1.0.0
# 范围: 通过 7 步级联将候选实体归一到规范实体并消歧

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3

pipeline:
  id: pipeline_l3_entity_resolution
  name: 实体归一和消歧
  name_en: Entity Normalization and Disambiguation
  version: 1.0.0
  purpose: >
    通过 7 步级联将候选实体归一到租户内的规范实体并完成消歧：
    精确 ID 或官网 canonical URL 匹配、租户内规范名和受控别名匹配、
    产品所属品牌/品类/域名/版本/上下文约束匹配、L2 词典与 SKOS
    标签匹配、向量或编辑距离仅用于生成候选、LLM 解释匹配理由、
    高风险实体人工确认。采用加权特征判定合并，品牌和产品不得仅凭
    向量相似度自动合并。
  description: >
    实体归一和消歧管道将候选抽取得到的实体候选归一到租户内的
    规范实体。管道执行 7 步级联：第一步精确 ID 或官网 canonical
    URL 匹配；第二步租户内规范名和受控别名匹配；第三步产品所属
    品牌、品类、域名、版本和上下文约束匹配；第四步 L2 词典、
    SKOS prefLabel/altLabel 和同义词匹配；第五步向量或编辑距离
    仅用于生成匹配候选，不建设面向下游内容任务的向量召回；第六步
    LLM 对候选解释匹配理由和差异；第七步品牌、组织、产品和认证等
    高风险实体由人工确认。实体合并不采用单一相似度阈值，而是采用
    加权特征（规范名 0.25 + 别名 0.15 + 官方域名 0.20 + 所属主体
    0.15 + 品类 0.10 + 版本兼容 0.10 + 上下文 0.05）判定。品牌和
    产品不得仅凭向量相似度自动合并。

  steps:
    - step: 1
      name: 精确 ID 和 canonical URL 匹配
      name_en: Exact ID and Canonical URL Match
      description: 精确匹配实体 ID 或官网 canonical URL
      inputs:
        - entity_candidates
        - entity_registry
      outputs:
        - exact_matches: 精确匹配结果（matched_entity_id / 未匹配）
      rules:
        - exact_match_takes_priority

    - step: 2
      name: 规范名和受控别名匹配
      name_en: Canonical Name and Controlled Alias Match
      description: 在租户范围内按规范名和受控别名匹配
      inputs:
        - unmatched_candidates
        - canonical_name_registry
        - controlled_alias_registry
      outputs:
        - name_matches: 规范名和别名匹配结果
      rules:
        - tenant_local_canonical_name_matched

    - step: 3
      name: 品牌品类上下文约束匹配
      name_en: Brand Category and Context Constraint Match
      description: 按产品所属品牌、品类、域名、版本和上下文约束匹配
      inputs:
        - unmatched_candidates
        - brand_context_registry
      outputs:
        - context_matches: 上下文约束匹配结果
      rules:
        - context_constraints_must_be_verified

    - step: 4
      name: L2 词典和 SKOS 标签匹配
      name_en: L2 Dictionary and SKOS Label Match
      description: 通过 L2 词典、SKOS prefLabel/altLabel 和同义词匹配
      inputs:
        - unmatched_candidates
        - l2_dictionary
        - skos_label_store
      outputs:
        - skos_matches: L2 词典和 SKOS 匹配结果
      rules:
        - skos_labels_must_be_used

    - step: 5
      name: 向量编辑距离生成候选
      name_en: Vector and Edit Distance Candidate Generation
      description: 用向量或编辑距离生成匹配候选，仅用于候选生成而非最终召回
      inputs:
        - unmatched_candidates
        - vector_index
        - edit_distance_index
      outputs:
        - fuzzy_candidates: 模糊匹配候选（供 LLM 解释）
      rules:
        - vector_only_for_candidate_generation

    - step: 6
      name: LLM 解释匹配理由
      name_en: LLM Explain Match Reasons
      description: 用 LLM 对候选解释匹配理由和差异
      inputs:
        - fuzzy_candidates
        - llm_resolution_model
      outputs:
        - llm_explanations: LLM 对每个候选的解释（匹配理由、差异）
      rules:
        - llm_explanation_must_be_recorded

    - step: 7
      name: 高风险实体人工确认
      name_en: Human Confirmation for High-Risk Entities
      description: 品牌、组织、产品、认证等高风险实体由人工确认
      inputs:
        - resolved_candidates
        - high_risk_routing_rules
      outputs:
        - confirmed_entities: 人工确认后的规范实体
        - review_queue_items: 进入人工审核队列的实体
      rules:
        - high_risk_entities_must_be_human_confirmed
        - brand_product_must_not_auto_merge_on_vector

  inputs:
    - entity_candidates:
        description: 候选抽取得到的实体候选
        source: 候选抽取管道输出
        fields: [candidate_id, entity_text, entity_type, extraction_path, evidence_span_ids, confidence]
    - entity_registry:
        description: 已注册的规范实体注册表
        source: 品牌实体管理
        fields: [entity_id, canonical_name, entity_type, canonical_url, aliases, version, context]
    - canonical_name_registry:
        description: 租户内规范名注册表
        source: 品牌实体管理
        fields: [name_id, canonical_name, entity_ref, tenant_id]
    - controlled_alias_registry:
        description: 受控别名注册表（规范名到别名的受控映射）
        source: 实体消歧系统
        fields: [alias_id, canonical_name, alias_text, alias_type, confidence]
    - brand_context_registry:
        description: 品牌上下文注册表（品牌、品类、域名、版本、上下文约束）
        source: 品牌上下文管理
        fields: [context_id, brand, category, domain, version, context_tags]
    - l2_dictionary:
        description: L2 行业知识词典（用于实体类型和同义词匹配）
        source: L2 行业知识层
        fields: [entry_id, term, term_type, synonyms]
    - skos_label_store:
        description: SKOS 标签存储（prefLabel、altLabel）
        source: L1 通用知识层
        fields: [concept_id, prefLabel, altLabel, definition]
    - vector_index:
        description: 向量索引（仅用于生成匹配候选）
        source: 向量检索系统
        fields: [index_id, embedding_model, vector, source_entity_ref]
    - edit_distance_index:
        description: 编辑距离索引（用于字符串相似度候选生成）
        source: 相似度系统
        fields: [index_id, string, normalized, entity_ref]
    - llm_resolution_model:
        description: LLM 消歧模型（解释匹配理由和差异）
        source: 模型注册表
        fields: [model_id, model_version, explanation_capabilities, temperature]
    - high_risk_routing_rules:
        description: 高风险实体路由规则（品牌、组织、产品、认证）
        source: 审核管理
        fields: [rule_id, entity_type, risk_level, review_required, default_assignee]

  outputs:
    output_schema: resolved_entities
    output_fields:
      - resolution_id: 消歧批次唯一标识
      - resolved_entities:
          type: array
          description: 消歧后的规范实体列表
          item_fields:
            - entity_id: 规范实体 ID
            - canonical_name: 规范实体名称
            - entity_type: 实体类型
            - resolution_status: 消歧状态（new / merged / matched / needs_review）
            - matched_entity_id: 匹配到的已有实体 ID
            - merge_evidence: 合并证据（匹配特征、权重）
            - confidence: 置信度
            - human_confirmed: 是否人工确认
      - match_explanations:
          type: array
          description: LLM 与候选的匹配理由和差异
          item_fields:
            - candidate_id: 候选 ID
            - matched_entity_id: 匹配实体 ID
            - explanation: LLM 解释
            - differences: 差异说明
      - review_queue_items:
          type: array
          description: 进入人工审核队列的高风险实体
          item_fields:
            - review_id: 审核 ID
            - entity_candidate_id: 候选 ID
            - entity_type: 实体类型
            - reason: 需要审核原因
            - priority: 优先级

  rules:
    - rule: exact_match_takes_priority
      description: 精确 ID 或 canonical URL 匹配结果优先于其他匹配方式
      severity: critical

    - rule: tenant_local_canonical_name_matched
      description: 第二步必须在租户范围内按规范名和受控别名匹配
      severity: critical

    - rule: context_constraints_must_be_verified
      description: 产品所属品牌、品类、域名、版本和上下文约束必须被核验
      severity: high

    - rule: skos_labels_must_be_used
      description: 第四步必须使用 L2 词典和 SKOS prefLabel/altLabel 进行匹配
      severity: high

    - rule: vector_only_for_candidate_generation
      description: 向量或编辑距离只用于生成匹配候选，不建设面向下游内容任务的向量召回
      severity: critical

    - rule: llm_explanation_must_be_recorded
      description: LLM 对每个候选的解释（匹配理由和差异）必须被记录
      severity: high

    - rule: high_risk_entities_must_be_human_confirmed
      description: 品牌、组织、产品和认证等高风险实体必须经过人工确认
      severity: critical

    - rule: brand_product_must_not_auto_merge_on_vector
      description: 品牌和产品不得仅凭向量相似度自动合并
      severity: critical

    - rule: weighted_features_used_for_merge
      description: 实体合并采用加权特征（规范名 0.25 + 别名 0.15 + 官方域名 0.20 + 所属主体 0.15 + 品类 0.10 + 版本兼容 0.10 + 上下文 0.05），不采用单一相似度阈值
      severity: critical

    - rule: merge_evidence_must_be_recorded
      description: 每次合并必须记录匹配特征和权重证据
      severity: high

  failure_mode: resolution_ambiguity_high
  failure_handling:
    condition: 大量候选无法消歧、高风险实体未确认或品牌产品被错误自动合并
    action: 生成消歧报告，标记歧义候选和待确认实体，暂停自动合并，将高风险实体路由到人工审核
    recovery: 人工处理歧义实体、补充规范名注册表或调整权重后重新消歧

  quality_checks:
    - check: candidate_resolution_coverage
      description: 确认所有候选实体都经过 7 步消歧
      method: 检查每个 entity_candidate 都有 resolution_status

    - check: exact_match_priority
      description: 确认精确匹配结果优先
      method: 检查存在精确 ID 或 canonical URL 匹配的候选采用精确匹配结果

    - check: vector_recall_restriction
      description: 确认向量仅用于候选生成
      method: 检查下游内容任务未使用向量召回结果作为最终匹配

    - check: high_risk_review_coverage
      description: 确认所有高风险实体进入人工审核
      method: 检查品牌、组织、产品、认证类型的候选均有 review_queue_items 记录

    - check: merge_feature_traceability
      description: 确认合并实体的特征权重可追溯
      method: 检查每个 merged 实体的 merge_evidence 包含完整特征权重

    - check: brand_product_merge_guard
      description: 确认品牌和产品未因向量相似度自动合并
      method: 检查所有 brand 和 product 类型的合并是否经过人工确认

    - check: llm_explanation_completeness
      description: 确认所有候选有 LLM 解释
      method: 检查 match_explanations 覆盖所有待解释候选

  metric_refs: []
  # 预留：resolution_success_rate, merge_rate, human_review_rate, ambiguity_rate, brand_product_merge_count

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义 L3 实体归一和消歧管道
      - 实现 7 步级联消歧和加权特征合并判定
      - 遵循 L3 规范 §8.6，向量仅用于候选生成，品牌产品不自动合并
      - 包含 7 个管道步骤、10 条规则和 7 项质量检查
    author: Brand Atlas Team