# Brand Atlas 第三层品牌认知层 — 管道定义：版式感知解析
# 版本: 1.0.0
# 范围: 按文档类型使用对应解析器，保留版式信息和证据回溯结构

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3

pipeline:
  id: pipeline_l3_layout_aware_parsing
  name: 版式感知解析
  name_en: Layout-Aware Parsing
  version: 1.0.0
  purpose: >
    按文档类型使用对应的版式感知解析器，将原始文档转换为保留
    层级、几何和引用信息的结构化内容树。针对 HTML、PDF、Word/
    Markdown、PPT 和 Excel 采用不同的解析方法，并在解析结果中
    保留页码、边界框、表格行列和图片引用，为证据回溯提供
    结构化的位置定位。
  description: >
    版式感知解析管道负责将通过的原始文档解析为结构化内容树。
    管道根据文档的 MIME 类型选择对应的解析器：HTML 使用 DOM
    主体提取并解析标题层级、表格和链接；PDF 提取文本层并渲染
    页面，对扫描件补充 OCR；Word/Markdown 解析标题、段落、列表、
    表格和批注；PPT 提取页标题、文本框、表格、图注和讲者备注；
    Excel 解析 Sheet、表头、单元格类型、公式和数据区域。特别强调
    PDF 和 PPT 中的架构图不能只依赖文本层。解析结果保留页码、
    边界框、表格行列和图片引用，以便证据回溯。

  steps:
    - step: 1
      name: 选择解析器
      name_en: Select Parser by Document Type
      description: 根据文档 MIME 类型选择对应的版式感知解析器
      inputs:
        - gated_source
        - parser_registry
      outputs:
        - selected_parser: 选中的解析器（方法、输出结构、能力）
      rules:
        - parser_must_match_document_type
        - parser_must_be_registered

    - step: 2
      name: 解析 HTML 文档
      name_en: Parse HTML Documents
      description: DOM 主体提取、标题层级、表格和链接解析，输出 page/section/block/link
      inputs:
        - html_content
        - selected_parser
      outputs:
        - html_structure: HTML 结构化内容树（页面、章节、块、链接）
      rules:
        - dom_main_content_must_be_extracted
        - heading_hierarchy_must_be_preserved
        - tables_and_links_must_be_parsed

    - step: 3
      name: 解析 PDF 文档
      name_en: Parse PDF Documents
      description: 文本层提取 + 页面渲染，扫描件补 OCR，输出 page/heading/paragraph/table/figure
      inputs:
        - pdf_file
        - selected_parser
        - ocr_engine
      outputs:
        - pdf_structure: PDF 结构化内容树（页面、标题、段落、表格、图形）
      rules:
        - text_layer_and_render_reused
        - scans_must_use_ocr
        - architecture_diagrams_must_not_rely_on_text_layer_only

    - step: 4
      name: 解析 Office 与 Markdown 文档
      name_en: Parse Word, Markdown, PPT and Excel
      description: 按类型解析标题、段落、列表、表格、批注、幻灯片、图注、讲者备注、Sheet 和单元格
      inputs:
        - office_file
        - selected_parser
        - ocr_engine
      outputs:
        - office_structure: Office 结构化内容树（section/block/table、slide/block/figure、sheet/table/row/cell）
      rules:
        - word_md_must_parse_annotations
        - ppt_must_parse_slides_figures_notes
        - excel_must_parse_cells_and_formulas
        - diagrams_must_not_rely_on_text_layer_only

    - step: 5
      name: 保留版式与位置信息
      name_en: Preserve Layout and Position Info
      description: 保留页码、边界框、表格行列和图片引用等证据回溯结构
      inputs:
        - html_structure
        - pdf_structure
        - office_structure
      outputs:
        - parsed_document: 完整解析文档（含页码、边界框、表格行列、图片引用）
      rules:
        - page_numbers_must_be_preserved
        - bounding_boxes_must_be_preserved
        - table_rows_cols_must_be_preserved
        - image_refs_must_be_preserved

    - step: 6
      name: 输出结构化解析结果
      name_en: Output Structured Parsing Result
      description: 输出保留版式信息的内容树和解析清单
      inputs:
        - parsed_document
        - parse_manifest
      outputs:
        - structured_content: 结构化解析内容树
        - parsing_manifest: 解析清单（解析器、产出结构、覆盖率）
      rules:
        - output_must_include_position_meta
        - output_must_include_parse_manifest

  inputs:
    - gated_source:
        description: 通过门禁的来源记录（含 MIME 类型和原始文件）
        source: 原件保存和门禁管道输出
        fields: [source_id, mime_type, original_file, content_hash, access_level]
    - parser_registry:
        description: 解析器注册表（文档类型到解析方法的映射）
        source: 解析器管理系统
        fields: [parser_id, document_type, method, output_structure, capabilities]
    - html_content:
        description: HTML 文档内容
        source: 门禁来源中提取
        fields: [html_dom, main_content_selector, title, headings]
    - pdf_file:
        description: PDF 文件（文本层 + 渲染页面）
        source: 门禁来源中提取
        fields: [text_layer, page_count, rendered_pages, scan_flags]
    - ocr_engine:
        description: OCR 引擎（用于扫描件识别）
        source: 模型注册表
        fields: [engine_id, ocr_method, language, confidence_threshold]
    - office_file:
        description: Word、Markdown、PPT 或 Excel 文件
        source: 门禁来源中提取
        fields: [file_type, content_blocks, slides, sheets, formulas]

  outputs:
    output_schema: parsed_document
    output_fields:
      - parse_id: 解析批次唯一标识
      - source_id: 关联的来源 ID
      - document_type: 文档类型（html / pdf / word / markdown / ppt / excel）
      - parser_id: 使用的解析器 ID
      - structure:
          type: array
          description: 结构化内容树节点列表
          item_fields:
            - node_id: 节点 ID
            - node_type: 节点类型（page / section / block / heading / paragraph / table / row / cell / figure / slide / link / sheet）
            - parent_id: 父节点 ID
            - content: 节点内容
            - page_number: 页码
            - bounding_box: 边界框
            - table_rows: 表格行数
            - table_cols: 表格列数
            - image_ref: 图片引用
            - heading_level: 标题层级
      - parsing_manifest: 解析清单（解析器、覆盖率、警告）
      - parse_warnings: 解析警告（如无法识别的内容块）

  rules:
    - rule: parser_must_match_document_type
      description: 选中的解析器必须与文档 MIME 类型匹配
      severity: critical

    - rule: parser_must_be_registered
      description: 使用的解析器必须在解析器注册表中登记
      severity: critical

    - rule: dom_main_content_must_be_extracted
      description: HTML 解析必须提取 DOM 主体内容，排除导航和广告等噪声
      severity: high

    - rule: heading_hierarchy_must_be_preserved
      description: HTML 解析必须保留标题层级结构
      severity: high

    - rule: tables_and_links_must_be_parsed
      description: HTML 中的表格和链接必须被解析并保留
      severity: high

    - rule: text_layer_and_render_reused
      description: PDF 解析必须同时使用文本层提取和页面渲染
      severity: critical

    - rule: scans_must_use_ocr
      description: 扫描件 PDF 必须使用 OCR 补齐识别
      severity: critical

    - rule: architecture_diagrams_must_not_rely_on_text_layer_only
      description: PDF 和 PPT 中的架构图不能只依赖文本层，必须结合版式和渲染
      severity: critical

    - rule: word_md_must_parse_annotations
      description: Word/Markdown 解析必须包含标题、段落、列表、表格和批注
      severity: high

    - rule: ppt_must_parse_slides_figures_notes
      description: PPT 解析必须包含页标题、文本框、表格、图注和讲者备注
      severity: high

    - rule: excel_must_parse_cells_and_formulas
      description: Excel 解析必须包含 Sheet、表头、单元格类型、公式和数据区域
      severity: high

    - rule: diagrams_must_not_rely_on_text_layer_only
      description: PPT 中的架构图和流程图不能只依赖文本层
      severity: critical

    - rule: page_numbers_must_be_preserved
      description: 解析结果必须保留页码用于证据回溯
      severity: high

    - rule: bounding_boxes_must_be_preserved
      description: 解析结果必须保留边界框用于定位
      severity: high

    - rule: table_rows_cols_must_be_preserved
      description: 解析结果必须保留表格行列数和单元格位置
      severity: high

    - rule: image_refs_must_be_preserved
      description: 解析结果必须保留图片引用用于证据回溯
      severity: high

    - rule: output_must_include_position_meta
      description: 输出内容树必须包含页码、边界框等位置元数据
      severity: high

    - rule: output_must_include_parse_manifest
      description: 输出必须包含解析清单记录解析器、覆盖率和警告
      severity: high

  failure_mode: parsing_quality_insufficient
  failure_handling:
    condition: 解析覆盖率过低、大量内容无法识别或架构图仅依赖文本层导致结构丢失
    action: 生成解析质量报告，标记未解析的文档和块，暂停该文档的下游解析，更换解析器或补 OCR
    recovery: 更换解析器、补充 OCR 结果或由人工介入修复后重新解析

  quality_checks:
    - check: parser_type_alignment
      description: 确认解析器与文档类型一致
      method: 比对 selected_parser 的 document_type 与 gated_source 的 mime_type

    - check: structure_coverage
      description: 确认解析结果覆盖了原始文档的主要内容
      method: 比较高解析出的节点数与文档实际内容块数量

    - check: position_meta_completeness
      description: 确认所有节点保留了页码和边界框
      method: 遍历 structure 检查每个节点的 page_number 和 bounding_box 非空

    - check: table_integrity
      description: 确认表格行列信息完整
      method: 检查所有 table 节点的 table_rows 和 table_cols 与原始内容一致

    - check: scan_ocr_application
      description: 确认扫描件使用了 OCR
      method: 检查所有标记为 scan 的 PDF 是否关联了 OCR 引擎输出

    - check: diagram_structure_preservation
      description: 确认架构图未被简化为纯文本
      method: 检查 figure 节点的 image_ref 和 bounding_box 是否存在

    - check: parse_warning_traceability
      description: 确认所有解析警告可追溯
      method: 检查 parse_warnings 中每条记录包含节点和原因

  metric_refs: []
  # 预留：parse_success_rate, ocr_usage_rate, structure_coverage, avg_parse_latency

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义 L3 版式感知解析管道
      - 实现按文档类型的解析器选择、版式保留和证据回溯结构
      - 遵循 L3 规范 §8.3，架构图不依赖纯文本层
      - 包含 6 个管道步骤、18 条规则和 7 项质量检查
    author: Brand Atlas Team