# Brand Atlas 第三层品牌认知层 — 管道定义：L2 映射
# 版本: 1.0.0
# 范围: 将 L3 品牌实体与命题映射到 L2 通用行业知识层

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3

pipeline:
  id: pipeline_l3_l2_mapping
  name: L2 映射
  name_en: L2 Mapping
  version: 1.0.0
  purpose: >
    将 L3 品牌实体与命题精确映射到 L2 通用行业知识层：品牌
    产品名映射到 L3 Product，品牌原始能力名映射到 L3 Capability
    Mention，L3 Capability Mention 通过 exactMatch/closeMatch/
    broaderMatch 映射到 L2 Capability，品牌目标客户描述映射到
    L2 Audience，品牌痛点描述映射到 L2 Problem/JTBD，产品定位
    映射到 L2 Category。映射保存 mapping_type、confidence、
    mapper_version、review_status 和 mapping_note，closeMatch
    不能被下游当作完全等价。
  description: >
    L2 映射管道负责建立 L3 品牌认知层与 L2 通用行业知识层之间的
    语义映射。管道先精确映射，再生成候选。品牌产品名映射为 L3
    Product，品牌原始能力名映射为 L3 Capability Mention，再由
    L3 Capability Mention 通过 exactMatch、closeMatch、broaderMatch
    三种映射类型关联到 L2 Capability。品牌目标客户描述映射到
    L2 Audience，品牌痛点描述映射到 L2 Problem/JTBD，产品定位映射
    到 L2 Category。每条映射保存 mapping_type、confidence、
    mapper_version、review_status 和 mapping_note。特别强调
    closeMatch 不能被下游当作完全等价处理。

  steps:
    - step: 1
      name: 加载映射配置
      name_en: Load Mapping Configuration
      description: 加载 L2 映射配置（映射路径、映射类型、mapper 版本）
      inputs:
        - mapping_config
      outputs:
        - parsed_config: 解析后的映射配置（映射路径、允许的映射类型）
      rules:
        - mapping_config_must_be_active

    - step: 2
      name: 映射品牌产品到 L3 Product
      name_en: Map Brand Product Names to L3 Product
      description: 将品牌产品名映射到 L3 Product
      inputs:
        - resolved_entities
        - l3_product_registry
      outputs:
        - product_mappings: 产品映射（品牌产品名到 L3 Product）
      rules:
        - product_name_must_resolve_to_l3_product

    - step: 3
      name: 映射品牌能力到 L3 Capability Mention
      name_en: Map Brand Capabilities to L3 Capability Mention
      description: 将品牌原始能力名映射到 L3 Capability Mention
      inputs:
        - resolved_entities
        - l3_capability_registry
      outputs:
        - capability_mappings: 能力映射（品牌原始能力名到 L3 Capability Mention）
      rules:
        - capability_name_must_resolve_to_mention

    - step: 4
      name: 映射 L3 能力到 L2 Capability
      name_en: Map L3 Capability Mention to L2 Capability
      description: 通过 exactMatch/closeMatch/broaderMatch 将 L3 Capability Mention 映射到 L2 Capability
      inputs:
        - capability_mappings
        - l2_capability_registry
      outputs:
        - l2_capability_mappings: L2 能力映射（含映射类型、置信度）
      rules:
        - mapping_type_must_be_valid
        - close_match_must_not_be_equivalent

    - step: 5
      name: 映射客户、痛点和定位
      name_en: Map Audience, Problem and Positioning
      description: 将品牌目标客户映射到 L2 Audience，痛点映射到 L2 Problem/JTBD，定位映射到 L2 Category
      inputs:
        - resolved_entities
        - l2_audience_registry
        - l2_problem_registry
        - l2_category_registry
      outputs:
        - audience_mappings: 客户映射
        - problem_mappings: 痛点映射
        - category_mappings: 定位映射
      rules:
        - audience_mapping_must_resolve
        - problem_mapping_must_resolve
        - category_mapping_must_resolve

    - step: 6
      name: 输出映射批次
      name_en: Output Mapping Batch
      description: 输出映射批次和映射清单
      inputs:
        - product_mappings
        - capability_mappings
        - l2_capability_mappings
        - audience_mappings
        - problem_mappings
        - category_mappings
      outputs:
        - mapping_batch: 映射批次（含 mapping_type、confidence、mapper_version、review_status、mapping_note）
        - mapping_manifest: 映射清单（映射数量、类型分布、review 状态）
      rules:
        - mappings_must_include_required_fields
        - batch_must_include_manifest

  inputs:
    - mapping_config:
        description: L2 映射配置（映射路径、允许的映射类型、mapper 版本）
        source: 品牌知识配置
        fields: [config_id, mapping_paths, allowed_mapping_types, mapper_version]
    - resolved_entities:
        description: 消歧后的规范实体
        source: 实体归一和消歧管道输出
        fields: [entity_id, canonical_name, entity_type, aliases, context]
    - l3_product_registry:
        description: L3 产品注册表
        source: 品牌实体管理
        fields: [product_id, product_name, brand_id, version, category]
    - l3_capability_registry:
        description: L3 能力注册表（Capability Mention）
        source: 品牌实体管理
        fields: [mention_id, capability_name, brand_id, source_doc]
    - l2_capability_registry:
        description: L2 通用能力注册表
        source: L2 行业知识层
        fields: [capability_id, canonical_name, skos_labels, definition]
    - l2_audience_registry:
        description: L2 目标客户注册表
        source: L2 行业知识层
        fields: [audience_id, canonical_name, definition, aliases]
    - l2_problem_registry:
        description: L2 问题和 JTBD 注册表
        source: L2 行业知识层
        fields: [problem_id, jtbd_id, canonical_name, definition]
    - l2_category_registry:
        description: L2 品类注册表
        source: L2 行业知识层
        fields: [category_id, canonical_name, taxonomy_path, definition]

  outputs:
    output_schema: mapping_batch
    output_fields:
      - mapping_batch_id: 映射批次唯一标识
      - mappings:
          type: array
          description: 映射列表
          item_fields:
            - mapping_id: 映射 ID
            - source_ref: 源实体引用（L3 实体或命题）
            - target_ref: 目标实体引用（L2 实体）
            - mapping_type: 映射类型（exact / close / broader / narrow）
            - confidence: 置信度
            - mapper_version: 映射器版本
            - review_status: 审核状态（pending / approved / rejected / needs_review）
            - mapping_note: 映射备注
      - mapping_manifest: 映射清单（映射数量、类型分布、review 状态）

  rules:
    - rule: mapping_config_must_be_active
      description: 使用的映射配置必须处于 active 状态
      severity: critical

    - rule: product_name_must_resolve_to_l3_product
      description: 品牌产品名必须映射到有效的 L3 Product
      severity: critical

    - rule: capability_name_must_resolve_to_mention
      description: 品牌原始能力名必须映射到 L3 Capability Mention
      severity: critical

    - rule: mapping_type_must_be_valid
      description: 映射类型必须是 exactMatch、closeMatch 或 broaderMatch 之一
      severity: critical

    - rule: close_match_must_not_be_equivalent
      description: closeMatch 不能被下游当作完全等价处理
      severity: critical

    - rule: audience_mapping_must_resolve
      description: 品牌目标客户描述必须映射到有效的 L2 Audience
      severity: high

    - rule: problem_mapping_must_resolve
      description: 品牌痛点描述必须映射到有效的 L2 Problem 或 JTBD
      severity: high

    - rule: category_mapping_must_resolve
      description: 产品定位必须映射到有效的 L2 Category
      severity: high

    - rule: mappings_must_include_required_fields
      description: 每条映射必须包含 mapping_type、confidence、mapper_version、review_status 和 mapping_note
      severity: critical

    - rule: batch_must_include_manifest
      description: 映射批次输出必须包含映射清单
      severity: high

  failure_mode: mapping_quality_insufficient
  failure_handling:
    condition: 大量映射无法建立、映射类型错误或 closeMatch 被误当作等价
    action: 生成映射报告，标记未映射和低置信度映射，暂停该批次的自动映射，将问题反馈给实体消歧和 L2 层
    recovery: 补充 L2 词典、修正映射配置或人工确认 closeMatch 后重新映射

  quality_checks:
    - check: mapping_coverage
      description: 确认映射覆盖率达标
      method: 计算成功映射的实体/命题数量与总候选的比率

    - check: mapping_type_validity
      description: 确认所有映射类型有效
      method: 检查 mapping_type 均为 exact / close / broader 之一

    - check: exact_match_priority
      description: 确认先精确映射再生成候选
      method: 检查 exactMatch 候选优先于 closeMatch 和 broaderMatch

    - check: close_match_equivalence_guard
      description: 确认 closeMatch 未被下游当作完全等价
      method: 检查 closeMatch 映射的 review_status 需要人工确认

    - check: required_field_completeness
      description: 确认每条映射包含全部必填字段
      method: 检查每条 mapping 的 mapping_type、confidence、mapper_version、review_status、mapping_note 非空

    - check: target_resolution
      description: 确认映射目标在 L2 注册表中可解析
      method: 反向解析所有 target_ref 在对应 L2 注册表中存在

    - check: review_status_consistency
      description: 确认高影响映射的审核状态正确
      method: 检查 closeMatch 和低置信度映射的 review_status 为 needs_review 或 pending

  metric_refs: []
  # 预留：mapping_rate, mapping_type_distribution, close_match_ratio, avg_mapping_confidence

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义 L3 L2 映射管道
      - 实现产品、能力、客户、痛点和定位到 L2 的精确映射
      - 遵循 L3 规范 §8.7，closeMatch 不作完全等价
      - 包含 6 个管道步骤、10 条规则和 7 项质量检查
    author: Brand Atlas Team