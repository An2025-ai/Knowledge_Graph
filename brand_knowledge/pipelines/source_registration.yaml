# Brand Atlas 第三层品牌认知层 — 管道定义：来源登记
# 版本: 1.0.0
# 范围: 在读取每份品牌资料前登记该来源实例和文档的元数据

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3

pipeline:
  id: pipeline_l3_source_registration
  name: 来源登记
  name_en: Source Registration
  version: 1.0.0
  purpose: >
    在读取每份品牌资料之前，为该来源实例和文档登记完整的
    元数据，包括 source_id、tenant_id、brand_id、source_type、
    publisher、canonical_url 或 external_path、retrieved_at、
    published_at、document_version、language、mime_type、
    content_hash、access_level、allowed_task_types、license 和
    owner，为后续所有 L3 处理管道建立可追溯的来源基线。
  description: >
    来源登记管道是 L3 品牌认知层处理流程的第一道工序。它负责
    在资料被读取和解析之前建立来源实例与文档的档案。管道校验
    来源实例和文档的必填字段，解析文档版本标识，并检测与已有
    来源记录的重复。特别强调文件名不是文档版本的唯一依据：
    必须同时解析封面、页眉、元数据和正文版本号，并将发现的
    版本冲突保留在记录中，交由下游处理而非静默丢弃。

  steps:
    - step: 1
      name: 加载来源登记规则
      name_en: Load Source Registration Rules
      description: 读取 L3 来源登记规则，包括必填字段、来源类型枚举和版本解析要求
      inputs:
        - registration_rules
      outputs:
        - parsed_rules: 解析后的登记规则（必填字段、来源类型、版本解析策略）
      rules:
        - registration_rules_must_be_active

    - step: 2
      name: 创建来源实例
      name_en: Create Source Instance
      description: 为资料的来源创建 source_instance 记录（来源、租户、品牌、类型、发布者）
      inputs:
        - incoming_source
        - parsed_rules
      outputs:
        - source_instance: 来源实例记录（source_id、tenant_id、brand_id、source_type、publisher）
      rules:
        - source_id_must_be_unique
        - must_have_valid_source_type
        - must_have_brand_id

    - step: 3
      name: 登记文档元数据
      name_en: Register Document Metadata
      description: 为来源实例对应的文档登记元数据（URL、抓取与发布时间、语言、MIME、哈希、权限）
      inputs:
        - incoming_document
        - source_instance
        - parsed_rules
      outputs:
        - document_metadata: 文档元数据（canonical_url/external_path、retrieved_at、published_at、language、mime_type、content_hash、access_level、allowed_task_types、license、owner）
      rules:
        - canonical_url_or_external_path_required
        - retrieved_at_must_be_present
        - access_level_must_be_valid
        - license_must_be_recorded

    - step: 4
      name: 解析文档版本
      name_en: Parse Document Version from Multiple Signals
      description: 从文件名、封面、页眉、元数据和正文版本号多信源解析文档版本，保留冲突
      inputs:
        - document_metadata
        - original_file
        - version_parsing_rules
      outputs:
        - document_version: 解析出的文档版本（含版本号、来源信号、冲突列表）
      rules:
        - filename_is_not_sole_version_evidence
        - version_conflicts_must_be_preserved

    - step: 5
      name: 检测来源重复
      name_en: Detect Duplicate Source Instances
      description: 将来源实例和文档与其在来源注册表中的已有记录比对，检测重复或更新
      inputs:
        - source_instance
        - document_metadata
        - source_registry
      outputs:
        - duplicate_findings: 重复检测结果（新建 / 更新已有 / 幂等跳过）
      rules:
        - same_url_same_hash_is_idempotent
        - same_url_diff_hash_is_new_version
        - duplicates_must_be_flagged_not_discarded

    - step: 6
      name: 输出来源登记记录
      name_en: Output Registered Source Record
      description: 将登记完成的来源实例和文档元数据写入来源注册表，输出登记清单
      inputs:
        - source_instance
        - document_metadata
        - document_version
        - duplicate_findings
      outputs:
        - registered_source: 登记的来源实例对象
        - registration_manifest: 登记清单（登记的来源、文档、版本与冲突统计）
      rules:
        - output_must_link_source_and_document
        - output_must_preserve_version_conflicts

  inputs:
    - registration_rules:
        description: L3 来源登记规则（必填字段、来源类型枚举、版本解析策略）
        source: 品牌知识配置
        fields: [rule_id, required_fields, allowed_source_types, version_parsing_strategy, conflict_policy]
    - incoming_source:
        description: 待登记的资料来源（来源类型、发布者、域名）
        source: 品牌资料采集模块
        fields: [source_type, publisher, domain, canonical_url, external_path]
    - incoming_document:
        description: 待登记的资料文档（抓取时间、语言、MIME、权限）
        source: 品牌资料采集模块
        fields: [retrieved_at, published_at, language, mime_type, access_level, allowed_task_types, license, owner]
    - original_file:
        description: 原始文件或网页快照（用于解析封面、页眉、元数据和正文版本号）
        source: 品牌资料采集模块
        fields: [file_path, file_name, snapshot_html, header_meta, body_version_markers]
    - version_parsing_rules:
        description: 版本解析规则（从不同信源解析版本号的方法和冲突处理）
        source: 版本管理系统
        fields: [signal_id, signal_source, extraction_method, confidence, conflict_priority]
    - source_registry:
        description: 品牌来源注册表（记录所有已登记的品牌来源实例和文档）
        source: 来源管理系统
        fields: [source_id, canonical_url, content_hash, document_version, registered_at, status]

  outputs:
    output_schema: registered_source
    output_fields:
      - registration_id: 登记批次唯一标识
      - source_instance:
          type: object
          description: 登记的来源实例
          fields:
            - source_id: 来源唯一标识
            - tenant_id: 租户标识
            - brand_id: 品牌标识
            - source_type: 来源类型
            - publisher: 发布者
            - canonical_url: 规范 URL
            - external_path: 外部路径
            - registered_at: 登记时间
      - document:
          type: object
          description: 登记的文档
          fields:
            - document_id: 文档唯一标识
            - source_id: 关联来源实例 ID
            - retrieved_at: 抓取时间
            - published_at: 发布时间
            - document_version: 文档版本
            - language: 语言
            - mime_type: MIME 类型
            - content_hash: 内容哈希
            - access_level: 访问级别
            - allowed_task_types: 允许的任务类型列表
            - license: 许可证
            - owner: 所有者
      - version_conflicts: 版本冲突列表（各信源的版本号差异）
      - duplicate_findings: 与已有来源的重复检测结果
      - registration_manifest: 登记清单摘要

  rules:
    - rule: registration_rules_must_be_active
      description: 使用的来源登记规则必须处于 active 状态，废弃规则不可使用
      severity: critical

    - rule: source_id_must_be_unique
      description: 每个来源实例的 source_id 在租户和品牌范围内必须唯一
      severity: critical

    - rule: must_have_valid_source_type
      description: 来源类型必须是注册表中定义的枚举值（官网、文档、媒体、客户等）
      severity: critical

    - rule: must_have_brand_id
      description: 每个品牌来源实例必须关联一个有效的 brand_id
      severity: critical

    - rule: canonical_url_or_external_path_required
      description: 文档必须具有 canonical_url 或 external_path 之一作为定位依据
      severity: critical

    - rule: retrieved_at_must_be_present
      description: 文档必须记录抓取时间 retrieved_at，用于时效性判断
      severity: high

    - rule: access_level_must_be_valid
      description: 访问级别必须是 public/restricted/internal/confidential 等受控值
      severity: critical

    - rule: license_must_be_recorded
      description: 文档必须记录许可证或版权信息，用于后续权限核验
      severity: high

    - rule: filename_is_not_sole_version_evidence
      description: 文档版本必须同时解析封面、页眉、元数据和正文版本号，文件名不能作为唯一依据
      severity: critical

    - rule: version_conflicts_must_be_preserved
      description: 各信源解析出的版本号冲突必须保留在登记记录中，不可静默覆盖
      severity: high

    - rule: same_url_same_hash_is_idempotent
      description: 相同 URL 且相同内容哈希的来源应幂等跳过，不重复登记
      severity: critical

    - rule: same_url_diff_hash_is_new_version
      description: 相同 URL 但内容哈希不同的来源应登记为新文档版本
      severity: high

    - rule: duplicates_must_be_flagged_not_discarded
      description: 检测到的重复来源必须标记但保留，交由下游或人工确认
      severity: high

    - rule: output_must_link_source_and_document
      description: 登记输出必须建立来源实例与文档的关联引用
      severity: critical

    - rule: output_must_preserve_version_conflicts
      description: 登记输出必须保留所有版本冲突记录，供后续版本处置使用
      severity: high

  failure_mode: source_registration_incomplete
  failure_handling:
    condition: 必填来源字段缺失、来源类型无效、品牌标识缺失或版本冲突无法解析
    action: 生成登记失败报告，标记缺失字段和冲突来源，拒绝登记该资料，将问题反馈给采集模块
    recovery: 采集模块补充来源元数据、修正来源类型或由人工确认版本冲突后重新登记

  quality_checks:
    - check: required_field_completeness
      description: 确认来源实例和文档的所有必填字段已登记
      method: 逐项检查 source_instance 和 document 的必填字段是否非空

    - check: source_id_uniqueness
      description: 确认新建来源的 source_id 在寄存器中唯一
      method: 在 source_registry 中按 source_id 查重

    - check: version_signal_coverage
      description: 确认版本解析覆盖了所有可用信源
      method: 比较 version_parsing_rules 中的 signal 数量与 document_version 中实际解析的信号数量

    - check: version_conflict_traceability
      description: 确认所有版本冲突被保留且可追溯
      method: 检查 version_conflicts 中每个冲突包含来源信号和原始值

    - check: duplicate_detection_coverage
      description: 确认所有登记来源都经过重复检测
      method: 检查 duplicate_findings 覆盖了本次登记的全部来源实例

    - check: brand_traceability
      description: 确认每个来源实例可追溯到品牌
      method: 检查所有 source_instance 的 brand_id 均为有效品牌

  metric_refs: []
  # 预留：sources_registered_per_batch, version_conflict_rate, duplicate_rate, registration_success_rate

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义 L3 来源登记管道
      - 实现来源实例与文档元数据的登记、版本多信源解析和冲突保留
      - 遵循 L3 规范 §8.1，文件名不作为版本唯一依据
      - 包含 6 个管道步骤、15 条规则和 6 项质量检查
    author: Brand Atlas Team