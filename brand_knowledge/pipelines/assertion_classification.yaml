# Brand Atlas 第三层品牌认知层 — 管道定义：事实、主张和推断判定
# 版本: 1.0.0
# 范围: 判定陈述类别与业务断言种类，评估是否可独立验证及来源利益关系

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: brand
  layer: L3

pipeline:
  id: pipeline_l3_assertion_classification
  name: 事实、主张和推断判定
  name_en: Assertion Classification
  version: 1.0.0
  purpose: >
    判定每条候选陈述的 factual 类别（fact/claim/observation/
    inference）和更细的业务断言种类（assertion_kind）。判定核心
    不是“来源是否官方”，而是“陈述能否独立验证，以及来源是否对
    结果有利益关系”。官网列出的品牌名等可判为 fact 候选；官网
    能力声称可判为 self_claim；内部路线图可判为 internal_claim
    并禁止公开输出；客户陈述可判为 attributed_claim 并保留条件；
    模型推断可判为 inference 并保存前提。
  description: >
    事实、主张和推断判定管道负责为每条候选陈述确定其证据地位。
    管道采用 L1 的 statement_class（fact/claim/observation/
    inference）作为基础类别，并引入 L3 更细的业务语义
    assertion_kind（identity_fact、product_spec、self_claim、
    attributed_claim、third_party_fact、internal_fact、
    draft_claim、inference）。判定的核心原则是陈述能否被独立
    验证，以及来源是否对结果有利益关系，而非简单判断来源是否
    官方。系统会为每类陈述标注其利益关系、可验证性和权限要求，
    例如内部资料和未公开路线图禁止公开输出，客户陈述需保留
    客户、样本和授权条件，模型推断需保存前提且不进入稳定能力事实。

  steps:
    - step: 1
      name: 加载判定规则
      name_en: Load Assertion Classification Rules
      description: 加载 statement_class 和 assertion_kind 的判定规则与基准
      inputs:
        - classification_rules
        - l1_statement_class_definition
      outputs:
        - parsed_rules: 解析后的判定规则（各类别的判定标准）
      rules:
        - classification_rules_must_be_active

    - step: 2
      name: 判定利益关系和可验证性
      name_en: Assess Stake and Independent Verifiability
      description: 评估来源对结果是否有利益关系，以及陈述能否被独立验证
      inputs:
        - statement_candidates
        - source_stake_model
        - verifiability_check
      outputs:
        - stake_verifiability: 每个陈述的利益关系与可验证性评估
      rules:
        - stake_not_officiality_is_the_core
        - verifiability_must_be_assessed

    - step: 3
      name: 判定陈述类别
      name_en: Classify into L1 Statement Class
      description: 判定陈述为 fact、claim、observation 或 inference
      inputs:
        - statement_candidates
        - stake_verifiability
        - parsed_rules
      outputs:
        - classified_statements: 分类后的陈述（statement_class + 判定理由）
      rules:
        - statement_class_must_be_one_of_four
        - classification_must_be_justified

    - step: 4
      name: 判定业务断言种类
      name_en: Determine L3 Assertion Kind
      description: 判定 assertion_kind（identity_fact、product_spec、self_claim、attributed_claim、third_party_fact、internal_fact、draft_claim、inference）
      inputs:
        - classified_statements
        - stake_verifiability
        - assertion_kind_rules
      outputs:
        - assertion_kinds: 每个陈述的业务断言种类
      rules:
        - assertion_kind_count_extends_l1
        - kind_must_be_from_fixed_enum
        - official_brand_name_is_identity_fact

    - step: 5
      name: 标注权限和输出限制
      name_en: Mark Access and Output Restrictions
      description: 对内部、路线图和未公开内容标注权限和禁止公开输出
      inputs:
        - assertion_kinds
        - access_policy
      outputs:
        - restriction_flags: 权限和输出限制标记
      rules:
        - internal_docs_must_block_public_output
        - attributed_claims_must_keep_conditions

    - step: 6
      name: 输出分类结果
      name_en: Output Assertion Classification Result
      description: 输出带 statement_class、assertion_kind 和限制标记的分类批次
      inputs:
        - classified_statements
        - assertion_kinds
        - restriction_flags
      outputs:
        - classified_batch: 分类批次（含类别、种类、限制标记）
        - classification_manifest: 分类清单（各类别统计、种类分布）
      rules:
        - batch_must_include_manifest
        - inference_must_be_flagged_for_review

  inputs:
    - classification_rules:
        description: 分类判定规则（fact/claim/observation/inference 的判定标准）
        source: 质量管理
        fields: [rule_id, statement_type, criteria, evidence_requirements, confidence_threshold]
    - l1_statement_class_definition:
        description: L1 通用知识层的陈述类别定义
        source: L1 通用知识层
        fields: [class_id, class_name, definition, examples]
    - statement_candidates:
        description: 抽取得到的命题候选
        source: 候选抽取管道输出
        fields: [candidate_id, subject_ref, predicate, object_ref_or_value, evidence_span, source_type]
    - source_stake_model:
        description: 来源利益关系模型（评估来源对结果的利益关系）
        source: 利益关系分析
        fields: [stake_id, source_type, stake_level, conflict_of_interest, description]
    - verifiability_check:
        description: 可验证性检查器（评估陈述能被独立验证的程度）
        source: 验证系统
        fields: [check_id, statement_type, verification_method, independent_sources]
    - assertion_kind_rules:
        description: assertion_kind 判定规则（identity_fact、product_spec 等八类）
        source: L3 品牌语义配置
        fields: [kind_id, kind_name, definition, examples, default_access]
    - access_policy:
        description: 权限策略（内部、路线图、未公开内容的输出限制）
        source: 合规管理
        fields: [policy_id, content_type, allowed_output, required_authorization]

  outputs:
    output_schema: classified_assertions
    output_fields:
      - classification_batch_id: 分类批次唯一标识
      - classified_statements:
          type: array
          description: 分类后的陈述列表
          item_fields:
            - statement_id: 陈述 ID
            - statement_class: 陈述类别（fact / claim / observation / inference）
            - assertion_kind: 业务断言种类（identity_fact / product_spec / self_claim / attributed_claim / third_party_fact / internal_fact / draft_claim / inference）
            - classification_reason: 分类理由
            - stake_assessment: 利益关系评估
            - verifiability: 可验证性评估
            - access_level: 访问级别
            - restriction_flags: 限制标记（如 block_public_output）
            - requires_review: 是否需要人工审核
      - classification_manifest: 分类清单（各类别和种类统计）

  rules:
    - rule: classification_rules_must_be_active
      description: 使用的分类规则必须处于 active 状态
      severity: critical

    - rule: stake_not_officiality_is_the_core
      description: 判定核心是陈述能否独立验证及来源是否有利益关系，而非来源是否官方
      severity: critical

    - rule: verifiability_must_be_assessed
      description: 每个陈述的可验证性必须被评估
      severity: critical

    - rule: statement_class_must_be_one_of_four
      description: statement_class 必须是 fact、claim、observation、inference 之一
      severity: critical

    - rule: classification_must_be_justified
      description: 每条陈述的分类必须附带判定理由
      severity: high

    - rule: assertion_kind_count_extends_l1
      description: assertion_kind 在 L1 statement_class 基础上提供 L3 更细的业务语义
      severity: high

    - rule: kind_must_be_from_fixed_enum
      description: assertion_kind 必须是固定的八类枚举值之一
      severity: critical

    - rule: official_brand_name_is_identity_fact
      description: 官网列出的官方品牌名、域名和当前产品名判为 fact 候选并标注 official_source
      severity: high

    - rule: internal_docs_must_block_public_output
      description: 内部说明书和未公开路线图判为 internal_claim 或 internal_fact，禁止公开输出
      severity: critical

    - rule: attributed_claims_must_keep_conditions
      description: 客户陈述判为 attributed_claim，保留客户、样本和授权条件
      severity: high

    - rule: inference_must_be_flagged_for_review
      description: 模型推断判为 inference 并保存前提，不进入稳定能力事实，需审核
      severity: critical

    - rule: batch_must_include_manifest
      description: 分类批次输出必须包含分类清单
      severity: high

  failure_mode: classification_inconsistency
  failure_handling:
    condition: 大量断言被错误分类、内部内容被标记为可公开输出或推断被当作稳定事实
    action: 生成分类报告，标记不一致和错误的断言，暂停该批次晋升，调整分类规则或利益关系模型后重新分类
    recovery: 修正分类规则、更新利益关系模型或由人工复核关键断言后重新分类

  quality_checks:
    - check: class_enum_validity
      description: 确认所有 statement_class 在四个类别内
      method: 检查 classified_statements 中 statement_class 均为 fact/claim/observation/inference

    - check: kind_enum_validity
      description: 确认所有 assertion_kind 在八类枚举内
      method: 检查 assertion_kind 均为 identity_fact/product_spec/self_claim/attributed_claim/third_party_fact/internal_fact/draft_claim/inference

    - check: justification_coverage
      description: 确认所有分类有理由
      method: 检查每条 classified_statement 的 classification_reason 非空

    - check: internal_output_restriction
      description: 确认内部和路线图内容禁止公开输出
      method: 检查 internal_fact/internal_claim 的 restriction_flags 含 block_public_output

    - check: attributed_claim_condition_retention
      description: 确认 attributed_claim 保留客户、样本和授权条件
      method: 检查 attributed_claim 陈述的保留字段完整

    - check: inference_review_flagging
      description: 确认推断被标记为需审核
      method: 检查 inference 陈述的 requires_review 为 true

    - check: stake_verifiability_traceability
      description: 确认利益关系和可验证性评估可追溯
      method: 检查 stake_assessment 和 verifiability 字段非空

  metric_refs: []
  # 预留：class_distribution, kind_distribution, self_claim_rate, inference_rate, internal_share

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义 L3 事实、主张和推断判定管道
      - 实现 statement_class 与 assertion_kind 双维度判定
      - 遵循 L3 规范 §8.8，核心判定为独立可验证性与利益关系
      - 包含 6 个管道步骤、12 条规则和 7 项质量检查
    author: Brand Atlas Team