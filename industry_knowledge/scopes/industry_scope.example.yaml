# Brand Atlas Knowledge Graph — L2 Industry Scope Manifest
# Example: CRM Industry in China Market
# Format: Section 8.1 of L2 Specification
#
# An industry scope manifest defines the research boundary
# before any knowledge requirement is compiled. It answers:
#   - What industry/category are we studying?
#   - Which market and language?
#   - Who is the target audience?
#   - Which competitors should we pay attention to?
#   - What dimensions are most important?
#   - What specific questions do we need answered?
#   - How often should this knowledge be refreshed?

# ============================================================
# Meta
# ============================================================

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: industry
  description: >
    Industry scope manifest for CRM (Customer Relationship Management)
    in the China market. Defines the research boundary for L2 industry
    knowledge building. This manifest is a prerequisite for compiling
    the Industry Knowledge Requirement.

# ============================================================
# Scope Manifest
# ============================================================

request_id: industry_crm_cn_001
mode: create

# --- Industry Identity ---
industry_id: ind_enterprise_software
industry_name: 企业软件
market: CN
languages:
  - zh-CN

# --- Category Scope ---
included_categories:
  - cat_crm
excluded_categories: []

# --- Target Audiences ---
target_audiences:
  - 中小企业销售负责人
  - 大客户销售总监
  - IT采购决策者

# --- Seed Competitors ---
# Brands and products to track as initial competitive landscape.
# These are starting points; additional competitors may be discovered
# during research.
seed_competitors:
  - canonical_name: Salesforce
    market_role: global_leader
    notes: 全球CRM市场领导者，在中国市场通过合作伙伴运营
  - canonical_name: HubSpot
    market_role: global_platform
    notes: 全球CRM平台，在中国市场存在但非核心市场
  - canonical_name: 销售易
    market_role: domestic_leader
    notes: 中国本土CRM领导者，专注大中型企业
  - canonical_name: 纷享销客
    market_role: domestic_competitor
    notes: 中国本土CRM，专注连接型CRM
  - canonical_name: 用友
    market_role: domestic_ecosystem
    notes: 中国企业管理软件巨头，CRM为其产品线之一

# --- Priority Dimensions ---
# The dimensions that are most important for this industry scope.
# All 15 standard dimensions from Section 4.3 are available, but
# these are designated as the highest priority for initial research.
priority_dimensions:
  - audience_and_decision_chain
  - problems_and_jobs
  - use_cases
  - capabilities
  - decision_factors
  - competition_structure

# --- Research Questions ---
# Specific questions that this scope seeks to answer.
# These guide the geo-research query planning and report generation.
research_questions:
  - 中国中小企业选择CRM系统时最关注哪些功能和决策因素？
  - CRM产品在2025-2026年的标准能力图谱是什么？哪些能力是差异化竞争点？
  - 中国CRM市场的主要参与者有哪些？各自的定位、优势和目标客户群是什么？
  - 从销售负责人的视角，CRM系统需要解决哪些核心痛点和使用场景？
  - 中国CRM市场的采购决策链是怎样的？谁在使用、谁在评估、谁在决策？

# --- Freshness Policy ---
# Defines how often the knowledge for this scope should be refreshed.
freshness_policy: monthly

# --- Seed Sources ---
# Initial trusted sources to seed the research. Additional sources
# will be discovered and validated during research.
seed_sources: []

# ============================================================
# Scope Status Tracking
# ============================================================

# Per-dimension coverage status. Updated after each research cycle.
# Values: covered_by_whitelist | covered_by_extended_sources |
#         partial | missing | conflicting | blocked | not_applicable
coverage_status: {}

# ============================================================
# Changelog
# ============================================================

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - Initial industry scope manifest for CRM in China market
      - Defined 5 seed competitors, 6 priority dimensions, 5 research questions
      - Set monthly freshness policy
    author: Brand Atlas Team
