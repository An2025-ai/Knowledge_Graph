# Brand Atlas Knowledge Graph — L2 去重策略
# 版本: 1.0.0
# 范围: L2 行业知识层

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: industry
  description: >
    定义 L2 行业知识层中的实体去重、报告导入幂等和近似重复检测策略。
    遵循 L1 context_policy 的去重规则，并扩展为 L2 特定的级联匹配策略。

# ============================================================
# 实体去重级联
# ============================================================

entity_dedup_cascade:
  description: 候选实体与已有实体的匹配优先级，从高到低

  levels:
    - level: 1
      method: exact_canonical_name
      description: 精确 canonical_name 匹配
      auto_merge: true
      confidence_threshold: 1.0

    - level: 2
      method: alias_and_domain
      description: aliases 列表和 official_domain 匹配
      auto_merge: true
      confidence_threshold: 0.95

    - level: 3
      method: external_stable_id
      description: 外部稳定 ID 匹配（如 Wikidata ID）
      auto_merge: true
      confidence_threshold: 0.95

    - level: 4
      method: string_fuzzy
      description: 字符串模糊匹配（编辑距离、Jaccard）
      auto_merge: false
      confidence_threshold: 0.85
      action: flag_for_review

    - level: 5
      method: embedding_similarity
      description: 向量语义相似度
      auto_merge: false
      confidence_threshold: 0.90
      action: flag_for_review

    - level: 6
      method: relation_context
      description: 行业、类型和邻接关系上下文消歧
      auto_merge: false
      confidence_threshold: 0.80
      action: require_human_review

    - level: 7
      method: llm_adjudication
      description: Cross-Encoder 或 LLM 裁决
      auto_merge: false
      confidence_threshold: 0.85
      action: require_human_review

  critical_rules:
    - 不得仅凭向量相似度自动合并品牌和产品
    - 自动合并阈值通过首个行业黄金集校准
    - 所有合并记录保存 match_method、candidate_ids、match_score 和 reviewer

# ============================================================
# 报告导入幂等
# ============================================================

report_import_idempotency:
  description: 确保同一报告版本不会产生重复知识

  idempotency_key:
    formula: "report_id + report_span + normalized_statement_hash + evidence_hash"
    description: 四字段组合作为幂等键

  duplicate_handling:
    - type: exact_duplicate
      condition: 幂等键完全匹配
      action: 跳过导入，记录 skipped_duplicate

    - type: same_conclusion_same_evidence
      condition: 结论相同且证据相同
      action: 合并 source_refs，不创建新记录

    - type: same_conclusion_different_evidence
      condition: 结论相同但证据不同
      action: 追加新证据到 source_refs，提升 confidence

    - type: different_conclusion
      condition: 同一 report_span 但结论不同
      action: 创建新版本，旧版本标记 superseded

# ============================================================
# 近似重复检测
# ============================================================

near_duplicate_detection:
  content_dedup:
    method: content_hash
    field: content_sha256
    description: 相同内容哈希的直接去重

  semantic_dedup:
    method: semantic_hash
    threshold: 0.85
    description: 语义相似度 > 0.85 的标记为潜在重复

  fact_dedup:
    method: subject_entity_id + predicate + object_value
    description: 相同主体、谓词和值的 fact 视为重复

  detection_actions:
    - action: mark_potential_duplicate
      condition: 语义相似度 > 0.85 且内容哈希不同
    - action: merge_sources
      condition: 相同事实但不同来源
    - action: create_new_version
      condition: 事实值已变化（如市场规模更新）

# ============================================================
# 变更记录
# ============================================================

