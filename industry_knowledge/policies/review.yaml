# Brand Atlas Knowledge Graph — L2 人工审核策略
# 版本: 1.0.0
# 范围: L2 行业知识层

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: industry
  description: >
    定义 L2 行业知识层中需要人工审核的触发条件、审核队列、
    质量状态流转和升级规则。

# ============================================================
# 审核触发条件
# ============================================================

review_triggers:
  - trigger: new_industry_root
    description: 新增行业根节点或一级品类
    severity: critical
    requires: senior_reviewer

  - trigger: entity_merge_suspicious
    description: 品牌/产品实体疑似错误合并
    severity: critical
    requires: senior_reviewer

  - trigger: high_authority_conflict
    description: 两个高权威来源相互冲突
    severity: critical
    requires: senior_reviewer

  - trigger: market_size_claim
    description: 市场规模、份额数据
    severity: high
    requires: domain_expert

  - trigger: regulatory_claim
    description: 监管、安全相关结论
    severity: high
    requires: domain_expert

  - trigger: competitive_relation
    description: 新建直接竞争关系
    severity: high
    requires: domain_expert

  - trigger: low_confidence_entity
    description: 低置信度实体映射（< 0.85）
    severity: medium
    requires: reviewer

  - trigger: topic_tree_modification
    description: 修改稳定主题树
    severity: medium
    requires: domain_expert

  - trigger: source_promotion
    description: 新发现来源从 candidate 晋升为 active
    severity: medium
    requires: reviewer

  - trigger: knowledge_promotion_critical
    description: 关键知识候选晋升（市场规模、监管、安全、效果、排名）
    severity: high
    requires: domain_expert

# ============================================================
# 质量状态流转
# ============================================================

quality_statuses:
  - status: candidate
    description: 从报告抽取的初始候选
    allowed_transitions: [normalized, rejected]

  - status: normalized
    description: 实体已消歧、字段已标准化
    allowed_transitions: [extracted, rejected]

  - status: extracted
    description: 结构化知识已抽取
    allowed_transitions: [verified, rejected]

  - status: verified
    description: 已通过自动验证和人工审核
    allowed_transitions: [active, rejected]

  - status: active
    description: 当前有效的稳定知识
    allowed_transitions: [expired, disputed, superseded]

  - status: expired
    description: 超过有效期的知识
    allowed_transitions: [active]

  - status: disputed
    description: 存在未解决冲突的知识
    allowed_transitions: [active, superseded]

  - status: superseded
    description: 被新版本替代的知识
    allowed_transitions: []

  - status: rejected
    description: 未通过门禁的知识
    allowed_transitions: [candidate]

# ============================================================
# 审核队列
# ============================================================

review_queue:
  priorities:
    - level: critical
      sla_hours: 4
      description: 影响核心业务决策，需 4 小时内处理

    - level: high
      sla_hours: 24
      description: 影响数据准确性，需 24 小时内处理

    - level: medium
      sla_hours: 72
      description: 影响数据完整性，需 72 小时内处理

    - level: low
      sla_hours: 168
      description: 常规审核，需 7 天内处理

  reviewer_roles:
    - role: senior_reviewer
      description: 高级审核员，可审核所有级别
    - role: domain_expert
      description: 行业领域专家，可审核 high 及以下
    - role: reviewer
      description: 普通审核员，可审核 medium 及以下

  escalation_rules:
    - condition: sla_exceeded
      action: 自动升级至上一级审核员
    - condition: reviewer_disagreement
      action: 升级至 senior_reviewer
    - condition: repeated_rejection
      action: 标记为 blocked，通知需求方

# ============================================================
# 变更记录
# ============================================================

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义 10 种审核触发条件
      - 建立 9 种质量状态和流转规则
      - 定义 4 级审核队列、SLA 和升级规则
    author: Brand Atlas Team