# GEO 第二层行业知识层 — 管道定义：知识晋升
# 版本: 1.0.0
# 范围: 将通过验证的候选知识晋升为 L2 稳定知识

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: industry_knowledge
  layer: L2

pipeline:
  id: pipeline_promotion
  name: 知识晋升
  name_en: Knowledge Promotion
  version: 1.0.0
  purpose: >
    将经过提取和验证的候选知识晋升为 L2 稳定知识。
    通过 10 道晋升关卡对候选知识进行逐项审查，包括行业范围、
    实体类型、关系类型、来源、证据、消歧、冲突等维度。
    解析候选实体与已有知识库的对应关系，检测并处理重复项，
    将关键条目路由到人工审核队列，最终将通过的候选知识
    写入稳定存储，并记录被拒绝的候选及原因。
  description: >
    知识晋升管道是 L2 行业知识层的最后一道工序，也是质量
    把关的关键环节。管道对每个候选知识条目执行 10 道晋升
    关卡的逐项审查，只有全部通过的候选才能晋升为稳定知识。
    未通过的候选根据失败关卡被拒绝或路由到审核队列。管道
    同时负责实体消歧（将候选实体与已有知识库中的实体匹配
    或创建新实体）、重复检测和冲突处理。晋升完成后生成
    详细的晋升报告，记录接受、拒绝和排队审核的完整统计。

  steps:
    - step: 1
      name: 执行晋升关卡
      name_en: Apply 10 Promotion Gates
      description: 对每个候选知识条目执行 10 道晋升关卡的逐项审查
      inputs:
        - structured_extraction
        - promotion_gates
      outputs:
        - gate_results: 每个候选在各关卡的通过/失败结果
        - passed_candidates: 通过所有关卡的候选
        - failed_candidates: 未通过关卡的候选（含失败关卡和原因）
      rules:
        - gates_must_execute_in_order
        - any_gate_failure_is_blocking
        - gate_results_must_be_recorded

    - step: 2
      name: 消歧实体
      name_en: Resolve Entities Against Existing Knowledge Base
      description: 将候选实体与已有知识库中的实体进行解析匹配
      inputs:
        - passed_candidates
        - existing_knowledge_base
        - entity_resolution_rules
      outputs:
        - entity_resolution: 实体消歧结果（新实体 / 合并 / 匹配已有 / 重复）
        - resolved_entities: 消歧后的实体列表
      rules:
        - must_match_by_canonical_name_first
        - resolution_type_must_be_determined
        - merged_entities_must_link_both_ids

    - step: 3
      name: 检测和处理重复
      name_en: Detect and Handle Duplicates
      description: 检测候选知识与已有知识及候选知识内部的重复
      inputs:
        - resolved_entities
        - promoted_relations
        - existing_knowledge_base
        - duplicate_detection_rules
      outputs:
        - duplicate_report: 重复检测报告
        - deduplicated_candidates: 去重后的候选知识
      rules:
        - exact_duplicates_must_be_rejected
        - near_duplicates_must_be_flagged
        - deduplication_must_be_auditable

    - step: 4
      name: 路由关键条目到审核队列
      name_en: Route Critical Items to Human Review Queue
      description: 将需要人工判断的条目路由到审核队列
      inputs:
        - deduplicated_candidates
        - review_routing_rules
      outputs:
        - review_queue_items: 审核队列条目
        - auto_approved_candidates: 自动批准的候选
      rules:
        - critical_claims_must_be_reviewed
        - conflicts_must_be_reviewed
        - low_confidence_items_must_be_reviewed

    - step: 5
      name: 写入稳定存储
      name_en: Upsert Promoted Knowledge to Stable Store
      description: 将晋升的候选知识写入 L2 稳定存储
      inputs:
        - auto_approved_candidates
        - review_approved_candidates
        - stable_store
      outputs:
        - promoted_entities: 已晋升的实体
        - promoted_relations: 已晋升的关系
        - promoted_statements: 已晋升的陈述
        - upsert_log: 写入操作日志
      rules:
        - upsert_must_be_atomic
        - version_must_increment
        - audit_log_must_be_written

    - step: 6
      name: 记录拒绝候选
      name_en: Record Rejected Candidates with Reasons
      description: 记录所有被拒绝的候选知识及其拒绝原因
      inputs:
        - failed_candidates
        - rejected_in_deduplication
      outputs:
        - rejection_report: 拒绝报告（含拒绝原因和失败关卡）
        - promotion_summary: 晋升摘要（接受 / 拒绝 / 排队统计）
      rules:
        - every_rejection_must_have_reason
        - rejection_must_be_traceable
        - resubmission_eligible_must_be_marked

  inputs:
    - promotion_gates:
        description: 10 道晋升关卡的定义和评审标准
        source: 质量管理系统
        fields:
          - gate_id: 关卡 ID
          - gate_name: 关卡名称
          - gate_order: 执行顺序（1-10）
          - check_method: 检查方法
          - failure_action: 失败处理（reject / review_queue / warn）
        gate_list:
          - gate_1_industry_scope: 行业范围：候选知识是否属于目标行业范围
          - gate_2_entity_type: 实体类型：实体类型是否在 L1 类型约束中定义
          - gate_3_relation_type: 关系类型：关系类型是否在 L1 关系注册表中定义
          - gate_4_source: 来源：来源是否在白名单中且权威等级达标
          - gate_5_evidence: 证据：证据支持状态是否达到 directly_supports 或 partially_supports
          - gate_6_entity_resolution: 实体消歧：候选实体是否已与已有知识库完成消歧
          - gate_7_duplicate: 重复检测：候选知识是否与已有知识重复
          - gate_8_conflict: 冲突检测：候选知识是否与已有知识存在冲突
          - gate_9_statement_type: 陈述分类：陈述类型分类是否正确
          - gate_10_quality: 综合质量：置信度、证据链完整性、格式规范性综合评分
    - existing_knowledge_base:
        description: 已有 L2 稳定知识库快照
        source: L2 稳定知识层
        fields: [entity_id, relation_id, fact_id, version, status, last_updated]
    - entity_resolution_rules:
        description: 实体消歧规则（匹配策略、置信度阈值、合并规则）
        source: 实体消歧系统
        fields: [rule_id, match_strategy, match_fields, confidence_threshold, merge_behavior]
    - duplicate_detection_rules:
        description: 重复检测规则（相似度算法、阈值、去重策略）
        source: 质量管理系统
        fields: [rule_id, similarity_algorithm, threshold, action_on_duplicate]
    - review_routing_rules:
        description: 审核路由规则（哪些类型的条目需要人工审核）
        source: 审核管理系统
        fields: [rule_id, condition, review_type, priority, default_assignee]
    - stable_store:
        description: L2 稳定存储接口
        source: 存储系统
        fields: [store_id, connection_config, write_permissions, versioning_strategy]

  outputs:
    output_schema: promotion_report
    output_fields:
      - promotion_id: 晋升批次唯一标识
      - extraction_id: 来源提取批次 ID
      - promoted_entities:
          type: array
          description: 晋升为 L2 的实体
          item_fields:
            - entity_id: 实体 ID
            - canonical_name: 实体规范名称
            - entity_type: 实体类型
            - promotion_status: 晋升状态（new / merged / updated）
            - gates_passed: 通过的关卡列表
            - promoted_at: 晋升时间
            - knowledge_version: 知识版本号
      - promoted_relations:
          type: array
          description: 晋升为 L2 的关系
          item_fields:
            - relation_id: 关系 ID
            - relation_type: 关系类型
            - subject_id: 主体实体 ID
            - object_id: 客体实体 ID
            - promotion_status: 晋升状态
            - gates_passed: 通过的关卡列表
            - promoted_at: 晋升时间
      - promoted_statements:
          type: array
          description: 晋升为 L2 的陈述
          item_fields:
            - statement_id: 陈述 ID
            - statement_type: 陈述类型
            - statement_text: 陈述内容
            - promotion_status: 晋升状态
            - evidence_support: 证据支持度
            - gates_passed: 通过的关卡列表
            - promoted_at: 晋升时间
      - rejected_candidates:
          type: array
          description: 被拒绝的候选
          item_fields:
            - candidate_id: 候选 ID
            - rejection_reason: 拒绝原因
            - failed_gate: 失败的关卡
            - rejection_detail: 详细说明
            - rejected_at: 拒绝时间
            - resubmission_eligible: 是否可重新提交
      - review_queue_items:
          type: array
          description: 审核队列条目
          item_fields:
            - review_id: 审核 ID
            - candidate_id: 候选 ID
            - review_type: 审核类型
            - priority: 优先级
            - reason: 需要审核的原因
            - status: 审核状态
            - assigned_to: 指派人
      - promotion_summary:
          type: object
          description: 晋升摘要
          fields:
            - accepted_count: 接受数量
            - rejected_count: 拒绝数量
            - queued_count: 排队审核数量
            - gate_failure_distribution: 各关卡失败分布
            - promotion_rate: 晋升率

  rules:
    - rule: gates_must_execute_in_order
      description: 10 道晋升关卡必须按 gate_order 顺序执行，不可跳关或乱序
      severity: critical

    - rule: any_gate_failure_is_blocking
      description: 任何一道关卡失败即导致该候选被拒绝或排队，不可绕过
      severity: critical

    - rule: gate_results_must_be_recorded
      description: 每个候选在每个关卡的评审结果必须记录，不可只记录最终结论
      severity: high

    - rule: must_match_by_canonical_name_first
      description: 实体消歧必须优先按规范名称精确匹配，名称匹配失败后才使用别名和模糊匹配
      severity: critical

    - rule: resolution_type_must_be_determined
      description: 每个候选实体必须明确判定消歧类型（new / merge / match / duplicate）
      severity: critical

    - rule: merged_entities_must_link_both_ids
      description: 合并实体时必须在记录中保留新旧两个 ID 的映射关系
      severity: high

    - rule: exact_duplicates_must_be_rejected
      description: 精确重复的候选必须直接拒绝，不可进入审核队列
      severity: critical

    - rule: near_duplicates_must_be_flagged
      description: 高度相似但非精确重复的候选必须标记并推入审核队列
      severity: high

    - rule: deduplication_must_be_auditable
      description: 重复检测和去重操作必须记录完整的审计日志
      severity: high

    - rule: critical_claims_must_be_reviewed
      description: 涉及重大事实、敏感领域或高影响的 claim 必须经过人工审核
      severity: critical

    - rule: conflicts_must_be_reviewed
      description: 与已有知识存在冲突的候选必须经过人工审核解决
      severity: critical

    - rule: low_confidence_items_must_be_reviewed
      description: 置信度低于阈值的候选必须经过人工审核
      severity: high

    - rule: upsert_must_be_atomic
      description: 写入稳定存储的操作必须原子化，全部成功或全部回滚
      severity: critical

    - rule: version_must_increment
      description: 更新已有实体时必须递增版本号，不可原地覆盖
      severity: critical

    - rule: audit_log_must_be_written
      description: 所有写入操作必须记录完整的审计日志（时间、操作类型、操作人、变更内容）
      severity: critical

    - rule: every_rejection_must_have_reason
      description: 每个被拒绝的候选必须附带明确的拒绝原因
      severity: critical

    - rule: rejection_must_be_traceable
      description: 每个拒绝记录必须可以追溯到具体的失败关卡和评审标准
      severity: high

    - rule: resubmission_eligible_must_be_marked
      description: 每个被拒绝的候选必须明确标记是否可重新提交
      severity: high

  failure_mode: promotion_rate_below_threshold
  failure_handling:
    condition: 晋升率过低（低于可接受阈值），表明上游提取质量或数据质量存在系统性问题
    action: 生成批量晋升失败报告，详细分析各关卡失败分布，暂停该批次的自动晋升，将问题反馈给上游管道（提取、证据解析）进行根因分析
    recovery: 上游管道优化后重新提取和验证，或调整晋升关卡阈值后重新执行晋升

  quality_checks:
    - check: gate_execution_order
      description: 确认 10 道关卡按正确顺序执行
      method: 检查 gate_results 中每个候选的 gates_passed 列表顺序与 promotion_gates.gate_order 一致

    - check: gate_completeness
      description: 确认每个候选在所有 10 道关卡上都有评审结果
      method: 检查每个候选的 gate_results 包含 10 条记录

    - check: entity_resolution_completeness
      description: 确认所有候选实体已完成消歧
      method: 检查每个 promoted_entities 的 resolution_type 非空

    - check: duplicate_prevention
      description: 确认没有重复写入已有知识
      method: 对比 promoted_entities 与 existing_knowledge_base 的规范名称和类型

    - check: rejection_reason_completeness
      description: 确认所有被拒绝候选有完整的拒绝原因
      method: 检查 rejected_candidates 中每个记录的 rejection_reason 和 failed_gate 非空

    - check: review_queue_priority
      description: 确认审核队列条目的优先级设置正确
      method: 检查 review_queue_items 中 priority 与 review_routing_rules 中的定义一致

    - check: audit_log_integrity
      description: 确认审计日志包含所有写入操作
      method: 检查 promoted_entities + promoted_relations + promoted_statements 的条目数与 audit_log 中的记录数一致

    - check: atomic_upsert_verification
      description: 确认写入操作原子化（无部分成功情况）
      method: 检查 upsert_log 中是否有部分写入的回滚记录

  metric_refs: []
  # 预留：promotion_pass_rate, gate_failure_distribution, review_queue_backlog, avg_promotion_latency, knowledge_growth_rate

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义知识晋升管道
      - 实现 10 道晋升关卡、实体消歧、重复检测和审核队列
      - 包含 6 个管道步骤、18 条规则和 8 项质量检查
    author: Brand Atlas Team