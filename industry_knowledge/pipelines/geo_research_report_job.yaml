# GEO 第二层行业知识层 — 管道定义：地理研究报告任务
# 版本: 1.0.0
# 范围: 向地理研究模块提交研究任务并监控完成，交付经过验证的报告包

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: industry_knowledge
  layer: L2

pipeline:
  id: pipeline_geo_research_report_job
  name: 地理研究报告任务
  name_en: Geo Research Report Job
  version: 1.0.0
  purpose: >
    向地理研究模块提交研究任务并监控其完成状态。
    基于已验证的需求文件生成来源覆盖计划，以白名单优先、
    扩展发现为辅的方式提交研究，最终交付经过验证的完整报告包
    （报告、证据、覆盖账本），并注册导入记录。
  description: >
    地理研究报告任务管道是连接需求定义和报告获取的桥梁。
    它加载已验证的行业知识需求，基于需求中的来源要求生成
    来源覆盖计划，然后将需求提交给地理研究模块并建立报告合同。
    管道持续监控研究任务的运行状态，在任务完成后验证交付的
    报告包是否完整（报告正文、证据附件、覆盖账本），最后注册
    导入记录供下游管道使用。

  steps:
    - step: 1
      name: 加载已验证的行业知识需求
      name_en: Load Validated Industry Knowledge Requirement
      description: 读取需求编译管道输出的版本化需求文件
      inputs:
        - industry_requirement_yaml
      outputs:
        - validated_requirement: 已解析的需求对象
      rules:
        - requirement_must_be_validated
        - requirement_must_not_be_expired

    - step: 2
      name: 生成来源覆盖计划
      name_en: Generate Source Coverage Plan
      description: 基于需求中的来源要求，生成以白名单优先、扩展发现为辅的覆盖计划
      inputs:
        - validated_requirement
        - source_whitelist
        - discovery_gap_dimensions
      outputs:
        - coverage_plan: 来源覆盖计划（白名单来源 + 扩展发现来源）
      rules:
        - whitelist_sources_first
        - extended_discovery_must_fill_gaps

    - step: 3
      name: 提交需求到地理研究模块
      name_en: Submit Requirement to Geo-Research with Report Contract
      description: 向地理研究模块提交需求和覆盖计划，建立报告合同
      inputs:
        - validated_requirement
        - coverage_plan
        - report_contract_template
      outputs:
        - job_submission: 任务提交确认（job_id、contract_id、estimated_completion）
      rules:
        - contract_must_specify_deliverables
        - contract_must_include_sla

    - step: 4
      name: 监控研究任务运行状态
      name_en: Monitor Geo-Research Run Status
      description: 轮询或等待回调，监控研究任务的运行状态直到完成或失败
      inputs:
        - job_submission
      outputs:
        - run_status: 任务状态（running / completed / failed / timeout）
        - status_log: 状态变更日志
      rules:
        - must_monitor_until_terminal
        - timeout_must_trigger_alert

    - step: 5
      name: 验证交付的报告包
      name_en: Validate Delivered Report Package
      description: 验证地理研究模块交付的完整报告包（报告 + 证据 + 覆盖账本）
      inputs:
        - delivered_package
        - contract_acceptance_criteria
      outputs:
        - validation_result: 验证结果（pass / fail with issues）
        - validated_package: 验证通过的报告包
      rules:
        - report_must_have_chapters
        - evidence_must_accompany_report
        - coverage_ledger_must_be_complete

    - step: 6
      name: 注册导入记录
      name_en: Register Import Record
      description: 将验证通过的报告包注册为导入记录，供下游管道引用
      inputs:
        - validated_package
        - import_registry
      outputs:
        - import_record: 导入记录（import_id、package_ref、registered_at）
      rules:
        - import_record_must_be_unique
        - import_record_must_link_package

  inputs:
    - industry_requirement_yaml:
        description: 已验证的版本化行业知识需求文件
        source: 需求编译管道输出
        fields: [requirement_id, requirement_version, industry_scope, dimensions, compiled_at, valid_until]
    - source_whitelist:
        description: 已验证的权威来源白名单
        source: 来源发现与验证任务输出
        fields: [source_id, canonical_name, source_type, authority_level, allowed_uses, verified_at]
    - discovery_gap_dimensions:
        description: 来源发现缺口维度（指示需要补充哪些类型的来源）
        source: 来源管理分析
        fields: [dimension_id, source_type_gap, geo_gap, topic_gap, priority]
    - report_contract_template:
        description: 报告合同模板（定义交付物、验收标准、SLA）
        source: 合同管理系统
        fields: [template_id, deliverables, acceptance_criteria, sla_hours, revision_policy]
    - import_registry:
        description: 导入注册表（记录所有已导入的报告包）
        source: 导入管理系统
        fields: [import_id, requirement_id, package_ref, status, registered_at]
    - contract_acceptance_criteria:
        description: 合同验收标准（各交付物的最低质量要求）
        source: 质量管理系统
        fields: [criterion_id, deliverable_type, min_quality_score, required_fields, validation_method]

  outputs:
    output_schema: validated_report_package
    output_fields:
      - import_id: 导入记录唯一标识
      - requirement_id: 关联的需求文件 ID
      - job_id: 地理研究任务 ID
      - contract_id: 报告合同 ID
      - report: 验证通过的报告正文
      - evidence_package: 证据附件包
      - coverage_ledger: 来源覆盖账本
      - validation_result: 包验证结果
      - registered_at: 注册时间
      - package_hash: 报告包完整性哈希

  rules:
    - rule: requirement_must_be_validated
      description: 加载的需求文件必须已经通过 schema 校验，不可使用未验证的需求
      severity: critical

    - rule: requirement_must_not_be_expired
      description: 需求文件的 valid_until 必须晚于当前日期，过期需求不可提交
      severity: high

    - rule: whitelist_sources_first
      description: 来源覆盖计划必须优先使用白名单中的来源，白名单用尽后才使用扩展发现
      severity: high

    - rule: extended_discovery_must_fill_gaps
      description: 扩展发现来源必须针对性地填补白名单未覆盖的缺口维度
      severity: high

    - rule: contract_must_specify_deliverables
      description: 报告合同必须明确列出所有交付物（报告、证据、覆盖账本）
      severity: critical

    - rule: contract_must_include_sla
      description: 报告合同必须包含 SLA 条款（最长完成时间、质量要求等）
      severity: high

    - rule: must_monitor_until_terminal
      description: 必须持续监控任务直到达到终态（completed / failed / timeout），不可中途放弃
      severity: critical

    - rule: timeout_must_trigger_alert
      description: 任务超时必须触发告警并记录，不可静默跳过
      severity: high

    - rule: report_must_have_chapters
      description: 交付的报告必须包含至少一个章节，空报告不可接受
      severity: critical

    - rule: evidence_must_accompany_report
      description: 证据包必须与报告一同交付，缺少证据的交付物视为不完整
      severity: critical

    - rule: coverage_ledger_must_be_complete
      description: 覆盖账本必须记录每个来源的实际使用情况和覆盖状态
      severity: high

    - rule: import_record_must_be_unique
      description: 同一需求文件和报告包的组合只能注册一次导入记录
      severity: critical

    - rule: import_record_must_link_package
      description: 导入记录必须包含到报告包的可追溯引用
      severity: high

  failure_mode: research_job_failed
  failure_handling:
    condition: 地理研究任务失败、超时或交付包验证不通过
    action: 生成失败报告，记录失败原因（任务失败 / 超时 / 包不完整），标记需求文件为 pending_retry，释放导入槽位
    recovery: 根据失败原因重试（调整超时阈值、放宽来源限制、重新提交需求）或人工介入

  quality_checks:
    - check: requirement_currency
      description: 确认加载的需求文件在有效期内
      method: 检查 validated_requirement.valid_until > current_date

    - check: coverage_plan_balance
      description: 确认覆盖计划在来源类型上分布合理
      method: 检查各 source_type 在 coverage_plan 中的占比，避免单一来源类型过度集中

    - check: contract_completeness
      description: 确认报告合同包含所有必需的交付物定义
      method: 检查 contract 的 deliverables 列表包含 report、evidence、coverage_ledger

    - check: status_monitoring_continuity
      description: 确认状态监控日志无断档
      method: 检查 status_log 的时间戳连续且覆盖从 submission 到 terminal 的完整周期

    - check: package_integrity
      description: 确认交付包的文件完整性
      method: 验证 package_hash 与实际文件内容的哈希值一致

    - check: evidence_package_validity
      description: 确认证据包中每个证据文件可读且格式正确
      method: 遍历 evidence_package 中所有文件，验证文件格式和可访问性

    - check: import_record_deduplication
      description: 确认没有重复的导入记录
      method: 按 requirement_id + package_hash 组合检查 import_registry 中的唯一性

  metric_refs: []
  # 预留：job_submission_success_rate, avg_completion_time_minutes, package_validation_pass_rate, coverage_plan_saturation

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义地理研究报告任务管道
      - 实现从需求到报告包的完整提交-监控-验证-注册流程
      - 包含 6 个管道步骤、13 条规则和 7 项质量检查
    author: Brand Atlas Team
