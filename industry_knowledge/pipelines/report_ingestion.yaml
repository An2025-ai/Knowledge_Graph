# GEO 第二层行业知识层 — 管道定义：报告摄入
# 版本: 1.0.0
# 范围: 解析行业报告为知识候选，提取带引用的候选陈述

meta:
  version: 1.0.0
  created_at: 2026-08-11
  updated_at: 2026-08-11
  status: active
  scope: industry_knowledge
  layer: L2

pipeline:
  id: pipeline_report_ingestion
  name: 报告摄入
  name_en: Report Ingestion
  version: 1.0.0
  purpose: >
    将经过验证的行业报告解析为结构化的知识候选。
    验证报告合同完整性，解析报告章节，提取带引用标签和
    报告跨度的候选陈述，检测与历史导入的重复，并按照章节和
    维度对候选进行分类，最终输出候选批次供证据解析使用。
  description: >
    报告摄入管道是知识提取的前置工序。它负责将非结构化的
    行业报告正文转换为半结构化的候选陈述集合。管道首先验证
    报告合同（章节、引用、来源清单），然后使用 Markdown AST
    解析报告章节，提取候选陈述并标注引用标签和报告内位置。
    通过与历史导入记录比对检测重复内容，最后按章节和维度
    对候选进行分类，输出标准化的候选批次。

  steps:
    - step: 1
      name: 验证报告合同
      name_en: Validate Report Contract
      description: 验证报告的结构完整性（章节、引用、来源清单）
      inputs:
        - validated_package
        - contract_acceptance_criteria
      outputs:
        - contract_validation_result: 合同验证结果
        - report_structure: 报告结构概述（章节列表、引用数量、来源分布）
      rules:
        - chapters_must_be_present
        - citations_must_be_indexed
        - source_inventory_must_be_complete

    - step: 2
      name: 解析报告章节
      name_en: Parse Report Sections Using Markdown AST
      description: 使用 Markdown AST 解析器将报告正文分解为章节树
      inputs:
        - report_body
        - report_structure
      outputs:
        - section_tree: 章节 AST 树（层级、标题、段落、列表、表格）
        - paragraph_spans: 每个段落在报告中的位置跨度
      rules:
        - ast_must_preserve_hierarchy
        - paragraph_spans_must_be_accurate

    - step: 3
      name: 提取候选陈述
      name_en: Extract Candidate Statements with Citation Labels and Report Span
      description: 从段落中提取候选陈述，标注引用标签和报告内位置跨度
      inputs:
        - section_tree
        - paragraph_spans
        - citation_index
      outputs:
        - candidate_statements: 候选陈述列表（内容、引用标签、报告跨度、段落 ID）
      rules:
        - each_statement_must_have_citation
        - each_statement_must_have_span
        - candidate_id_must_be_unique

    - step: 4
      name: 检测重复
      name_en: Detect Duplicates Against Previous Imports
      description: 将候选陈述与历史导入记录比对，检测重复或高度相似的陈述
      inputs:
        - candidate_statements
        - previous_import_index
      outputs:
        - duplicate_report: 重复检测报告（标记重复的候选、相似度、匹配的已有记录）
        - unique_candidates: 去重后的候选陈述列表
      rules:
        - similarity_threshold_must_be_defined
        - duplicates_must_be_flagged_not_discarded

    - step: 5
      name: 分类候选
      name_en: Classify Candidates by Section and Dimension
      description: 按章节归属和知识维度对候选陈述进行分类
      inputs:
        - unique_candidates
        - section_tree
        - dimension_mapping
      outputs:
        - classified_candidates: 分类后的候选批次（section + dimension 标签）
      rules:
        - each_candidate_must_have_section
        - each_candidate_must_have_dimension

    - step: 6
      name: 输出候选批次
      name_en: Output Candidate Batch for Evidence Resolution
      description: 将分类后的候选批次序列化输出，供证据解析管道使用
      inputs:
        - classified_candidates
        - batch_manifest
      outputs:
        - candidate_batch: 标准化的候选批次文件
        - batch_manifest: 批次清单（候选数量、分类分布、报告来源）
      rules:
        - batch_must_include_manifest
        - batch_must_reference_source_report

  inputs:
    - validated_package:
        description: 经过验证的报告包（报告正文 + 证据 + 覆盖账本）
        source: 地理研究报告任务管道输出
        fields: [import_id, report, evidence_package, coverage_ledger, package_hash]
    - contract_acceptance_criteria:
        description: 合同验收标准（章节、引用、来源的最低要求）
        source: 质量管理系统
        fields: [criterion_id, deliverable_type, min_chapters, min_citations, required_source_types]
    - report_body:
        description: 报告正文（Markdown 格式）
        source: 报告包中提取
        fields: [report_text, format, encoding, line_count]
    - citation_index:
        description: 报告引用索引（[S#] 标签到来源的映射）
        source: 报告包中提取
        fields: [citation_label, source_id, page_ref, url, content_hash]
    - previous_import_index:
        description: 历史导入记录索引（用于重复检测）
        source: 导入管理系统
        fields: [import_id, candidate_hash, statement_text, imported_at]
    - dimension_mapping:
        description: 章节到知识维度的映射关系
        source: 需求编译管道输出
        fields: [section_pattern, dimension_id, dimension_name, priority]
    - batch_manifest:
        description: 批次清单模板（定义批次元数据格式）
        source: 管道配置
        fields: [batch_id, pipeline_id, report_ref, candidate_count, classification_summary]

  outputs:
    output_schema: report_candidates
    output_fields:
      - batch_id: 候选批次唯一标识
      - import_id: 关联的导入记录 ID
      - report_ref: 报告引用（报告 ID、版本）
      - candidates: 候选陈述数组
        item_fields:
          - candidate_id: 候选唯一标识
          - statement_text: 陈述文本
          - citation_labels: 引用标签列表（如 [S1], [S3]）
          - report_span: 报告内位置跨度（起始行-结束行，段落 ID）
          - section_id: 所属章节 ID
          - dimension_id: 所属知识维度 ID
          - is_duplicate: 是否检测为重复
          - duplicate_of: 如重复，指向已有记录的引用
          - confidence: 提取置信度
      - classification_summary: 分类摘要（按章节和维度的分布统计）
      - extraction_timestamp: 提取时间戳

  rules:
    - rule: chapters_must_be_present
      description: 报告必须包含至少一个章节，无章节结构的报告拒绝摄入
      severity: critical

    - rule: citations_must_be_indexed
      description: 报告中所有引用标签必须可索引，无法解析的引用标记为悬空引用
      severity: critical

    - rule: source_inventory_must_be_complete
      description: 来源清单必须覆盖报告中的所有引用，每项引用必须有对应的来源记录
      severity: critical

    - rule: ast_must_preserve_hierarchy
      description: Markdown AST 解析必须保留原报告的章节层级结构
      severity: high

    - rule: paragraph_spans_must_be_accurate
      description: 段落位置跨度必须准确反映在原始报告中的行号范围
      severity: high

    - rule: each_statement_must_have_citation
      description: 每条候选陈述必须至少带有一个引用标签，无引用的陈述标记为 uncited
      severity: critical

    - rule: each_statement_must_have_span
      description: 每条候选陈述必须标注其在报告中的位置跨度
      severity: high

    - rule: candidate_id_must_be_unique
      description: 每个候选陈述的 ID 在批次内必须唯一
      severity: critical

    - rule: similarity_threshold_must_be_defined
      description: 重复检测的相似度阈值必须明确定义，不可使用模糊标准
      severity: high

    - rule: duplicates_must_be_flagged_not_discarded
      description: 检测到的重复候选必须标记但保留，不可直接丢弃（需人工确认）
      severity: high

    - rule: each_candidate_must_have_section
      description: 每个候选陈述必须归属到至少一个报告章节
      severity: high

    - rule: each_candidate_must_have_dimension
      description: 每个候选陈述必须映射到至少一个知识维度
      severity: high

    - rule: batch_must_include_manifest
      description: 候选批次输出必须包含批次清单，描述候选数量和分类分布
      severity: high

    - rule: batch_must_reference_source_report
      description: 候选批次必须包含对源报告的可追溯引用
      severity: critical

  failure_mode: report_contract_invalid
  failure_handling:
    condition: 报告合同验证失败（缺少章节、引用无法解析、来源清单不完整）
    action: 生成合同违规报告，详细列出每一项违规，拒绝摄入该报告，将问题反馈给地理研究模块
    recovery: 地理研究模块修复报告问题后重新提交，或由人工审核决定是否放宽合同要求

  quality_checks:
    - check: contract_validation
      description: 确认报告合同满足所有验收标准
      method: 逐项检查 contract_acceptance_criteria 中的各项要求是否满足

    - check: ast_structure_fidelity
      description: 确认 AST 解析的章节层级与原始报告一致
      method: 对比 section_tree 的层级深度和标题文本与原始 Markdown 的对应关系

    - check: citation_linkage
      description: 确认每个引用标签在 citation_index 中可解析
      method: 提取所有 candidate_statements 中的 citation_labels，逐一在 citation_index 中查找

    - check: duplicate_detection_coverage
      description: 确认重复检测覆盖了所有候选
      method: 检查 unique_candidates 数量 + 被标记的重复数量 = 原始 candidate_statements 数量

    - check: classification_completeness
      description: 确认所有候选已按章节和维度分类
      method: 检查 classified_candidates 中 section_id 和 dimension_id 字段非空

    - check: span_accuracy
      description: 确认报告跨度的行号范围在原始报告内
      method: 检查每个 candidate 的 report_span 起始行 <= 结束行，且不超过报告总行数

  metric_refs: []
  # 预留：candidates_per_report, duplicate_rate, avg_citations_per_statement, classification_coverage

changelog:
  - version: 1.0.0
    date: 2026-08-11
    changes:
      - 初始版本，定义报告摄入管道
      - 实现从 Markdown 报告到分类候选批次的完整解析流程
      - 包含 6 个管道步骤、14 条规则和 6 项质量检查
    author: Brand Atlas Team