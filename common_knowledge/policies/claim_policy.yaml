# L1 通用知识层 — 事实与主张策略
# 版本: 1.2.0
# 范围: 跨品牌、跨行业复用的方法与规范层

meta:
  version: 1.2.0
  created_at: 2026-08-07
  updated_at: 2026-08-11
  status: active
  scope: shared
  description: >
    定义事实(fact)、主张(claim)、观测(observation)和推断(inference)的
    区分标准、证据要求和处理策略。
    v1.2.0 新增 L3 assertion_kind 到 L1 statement_class 的映射说明。

# ============================================================
# 信息分类定义
# ============================================================

information_classes:

  - class: fact
    name: 事实
    definition: 有证据支持的客观陈述，可被独立验证
    evidence_requirement: 必须有至少一个来源
    source_requirement: 至少一个高权威来源或两个中权威来源
    verification: 可被第三方独立验证
    mutability: 在有效期内稳定，过期后可能变化
    examples:
      - Salesforce 成立于 1999 年（有公开记录）
      - 2025 年 Q1 该产品月活用户 100 万（有数据来源）
      - 该功能于 2024 年 Q3 上线（有官方记录）

  - class: claim
    name: 主张
    definition: 来源主体对自身或他人的陈述，具有主观性和立场
    evidence_requirement: 必须有来源标注出处
    source_requirement: 标注陈述主体和立场
    verification: 需要第三方独立验证才能转为 fact
    mutability: 随陈述主体立场变化
    sub_types:
      - self_claim: 品牌/产品对自身的陈述（如行业领先）
      - third_party_claim: 第三方对品牌的陈述（如分析师认为）
      - user_review: 用户对产品的评价（如很好用）
    examples:
      - 行业领先的 CRM 平台（品牌自述，self_claim）
      - 分析师认为该产品具有竞争力（第三方观点，third_party_claim）
      - 这个产品非常好用（用户评价，user_review）

  - class: observation
    name: 观测
    definition: 特定时间和条件下获取的来源快照、校验结果或变更事件
    evidence_requirement: 必须有观测时间戳
    source_requirement: 标注观测来源和条件
    verification: 需要多次观测交叉验证
    mutability: 高度时间敏感，可能下一次观测就不同
    sub_types:
      - source_snapshot: 来源内容快照
      - validation_run: 一次校验运行结果
      - change_event: 知识变更事件
      - trend: 趋势观测
    examples:
      - "2026-08-07 来源页面的版本快照已保存"
      - "2026-08-07 校验发现一条关系缺少证据"

  - class: inference
    name: 推断
    definition: 基于事实、主张或观测得出的推理结论
    evidence_requirement: 必须标注推理依据和逻辑链
    source_requirement: 标注推理所依据的事实和观测
    verification: 需要验证推理逻辑和前提
    mutability: 随前提变化而变化
    examples:
      - "基于近期搜索观测，该品牌在 AI 搜索中的可见度呈上升趋势"
      - "结合市场规模和增长率，该品类预计明年达到 XX 规模"

# ============================================================
# 分类决策流程
# ============================================================

classification_flow:
  step_1:
    question: 是否有可验证的来源？
    yes: 继续下一步
    no: 标记为 unverifiable_claim 或 observation

  step_2:
    question: 陈述是否包含主观判断或立场？
    yes: 标记为 claim
    no: 继续下一步

  step_3:
    question: 是否基于特定时间的快照？
    yes: 标记为 observation
    no: 标记为 fact

  step_4:
    question: 是推理结论还是直接陈述？
    answer_if_inference: 标记为 inference
    answer_if_direct: 保持当前分类

# ============================================================
# 晋升规则
# ============================================================

promotion_rules:

  observation_to_fact:
    description: 观测经验证后可晋升为事实
    requirements:
      - 至少 3 次独立观测结果一致
      - 观测时间跨度至少 7 天
      - 至少有一个高权威来源交叉验证
    process:
      - 记录原始观测
      - 多次观测一致性检查
      - 高权威来源验证
      - 晋升为 fact 并保留原始观测引用

  claim_to_fact:
    description: 主张经第三方验证后可晋升为事实
    requirements:
      - 至少一个独立第三方来源验证
      - 验证来源与主张主体无利益关联
      - 验证结果与主张一致
    process:
      - 记录原始主张
      - 寻找独立第三方验证
      - 验证结果比对
      - 晋升为 fact 或标记为 disputed_claim

  observation_to_claim:
    description: 观测可作为主张的证据
    requirements:
      - 观测来源和条件明确
      - 观测内容与主张直接相关
    process:
      - 记录观测
      - 建立观测与主张的关系
      - 观测作为主张的 support 证据

# ============================================================
# 统计数据处理规则
# ============================================================

statistical_data_rules:

  - rule: 保留原始数值
    description: 不能仅保留百分比或相对值，必须保留原始绝对数字
    example:
      wrong: "市场份额增长了 20%"
      correct: "市场份额从 15%（100 万用户）增长到 18%（120 万用户），增长 20%"

  - rule: 标注单位
    description: 所有数值必须标注单位（货币、百分比、数量等）
    example:
      wrong: "市场规模 880"
      correct: "市场规模 880 亿美元（USD）"

  - rule: 标注时间范围
    description: 统计数字必须标注数据采集的时间范围
    example:
      wrong: "月活用户 500 万"
      correct: "2025 年 Q4 月活用户 500 万（2025 年 10-12 月均值）"

  - rule: 标注适用范围
    description: 统计数据必须标注适用的地理范围、行业范围或人群范围
    example:
      wrong: "CRM 采用率 85%"
      correct: "北美中大型企业（500+ 员工）CRM 采用率 85%（2025 年）"

# ============================================================
# 过期数据处理规则
# ============================================================

expiration_rules:

  - rule: 时效性标注
    description: 有时效性的信息必须标注 valid_from 和 valid_to
    applies_to: [fact, claim, observation]
    examples:
      - 产品价格：有效期至下次价格调整
      - 市场数据：标注数据年份
      - 产品功能：标注版本号

  - rule: 过期处理
    description: 超过有效期的信息处理方式
    actions:
      - status 改为 inactive
      - 降低 confidence 至 0.5 以下
      - 保留历史记录不被删除
      - 在引用时标注"历史数据"

  - rule: 定期复核
    description: 活跃事实和主张应定期复核有效期
    frequency: 每季度
    review_items:
      - 产品价格和功能
      - 市场数据
      - 行业标准
      - 监管政策

# ============================================================
# L3 assertion_kind 到 L1 statement_class 映射
# ============================================================

l3_assertion_kind_mapping:
  description: >
    L3 使用 assertion_kind 表达更细的业务语义，statement_class 保持 L1 的
    fact/claim/observation/inference。以下是 L3 assertion_kind 与 L1 statement_class 的对应关系。
  mapping:
    - assertion_kind: identity_fact
      statement_class: fact
      public_output: true
    - assertion_kind: product_spec
      statement_class: fact_conditional
      public_output: per_document_permission
    - assertion_kind: self_claim
      statement_class: claim
      public_output: subject_to_claim_review
    - assertion_kind: attributed_claim
      statement_class: claim
      public_output: upon_authorization
    - assertion_kind: third_party_fact
      statement_class: fact
      public_output: per_source_license
    - assertion_kind: internal_fact
      statement_class: fact_conditional
      public_output: false_by_default
    - assertion_kind: draft_claim
      statement_class: claim
      public_output: false
    - assertion_kind: inference
      statement_class: inference
      public_output: not_as_stable_fact

  handling:
    - internal_fact: 内部事实，仅限内部分析，默认不可公开输出
    - product_spec: 产品规格，按文档权限决定输出
    - draft_claim: 草稿主张（路线图、未发布功能），不可公开输出
    - approved_claim: 批准主张，允许公开使用，需经口径审核

