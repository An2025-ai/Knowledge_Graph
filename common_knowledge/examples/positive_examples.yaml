          canonical_name: 中小企业主
          pain_points: [不了解CRM]
      industry_topics:
        - topic_id: ent_topic_crm_basics
          canonical_name: CRM基础知识
      intent_definitions:
        - intent_id: intent_definition
        - intent_id: intent_education
    expected_output:
      generated_prompts:
        - id: ent_prompt_crm_definition
          canonical_name: 什么是CRM？
          intent_id: intent_definition
          decision_stage: awareness
          language: zh
          targets: [ent_audience_smb_owner]
          related_entities: [ent_topic_crm_basics]
          generation_source: pattern_based
          priority: medium
        - id: ent_prompt_crm_how_works
          canonical_name: CRM系统是如何工作的？
          intent_id: intent_education
          decision_stage: awareness
          language: zh
          targets: [ent_audience_smb_owner]
          related_entities: [ent_topic_crm_basics]
          generation_source: pattern_based
          priority: medium
      coverage_summary:
        total_prompts: 2
        intents_covered: 2
        stages_covered: 1
        intent_gaps: []
        duplicate_removed: 1
      prompt_clusters:
        - topic_id: ent_topic_crm_basics
          prompts:
            - ent_prompt_crm_definition
            - ent_prompt_crm_how_works
    demonstrates: >
      演示no_duplicate_prompts规则。
      当系统生成"什么是CRM"和"CRM是什么意思"两个语义等价的提问词时，
      仅保留一个（优先保留更符合prompt_patterns.yaml模式的版本）。
      "CRM系统是如何工作的"与"什么是CRM"语义不同（一个问定义，一个问原理），
      因此保留两个不同意图的提问词。
    source_refs:
      - prompt_patterns.yaml
      - prompt_generation.yaml
    tags: [prompt_generation, deduplication, prompt, intent]

