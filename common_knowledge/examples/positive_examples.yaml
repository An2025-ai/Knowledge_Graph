# GEO 第一层通用知识层 — 正向示例（正确示例）
# 版本: 1.0.0
# 范围: 跨品牌、跨行业复用的方法与规范层
# 用途: 为5个任务模板提供正确的输入→输出映射示例，用于训练和验证

meta:
  version: 1.0.0
  created_at: 2026-08-07
  updated_at: 2026-08-07
  status: active
  scope: shared
  description: >
    本文件包含5个GEO L1任务模板的正向示例（正确示例）。
    每个任务至少5个示例，展示正确的输入→输出映射关系，
    并标注每个示例所演示的规则或原则以及引用来源。
    示例覆盖品牌导入、提问词生成、主题规划、搜索诊断和内容Brief生成。

# ============================================================
# 任务1: 品牌导入 (task_brand_onboarding)
# ============================================================

examples:

  # --- 品牌导入 示例 1 ---
  - id: ex_bo_001
    task_id: task_brand_onboarding
    name: 标准品牌导入-企业软件品牌
    scenario: >
      一个新品牌（企业软件CRM领域）首次接入知识图谱系统，需要建立完整的品牌实体、
      产品列表、行业归属和用户角色关系。
    input:
      brand_profile:
        canonical_name: Salesforce
        aliases: [Salesforce.com, 赛富时]
        description: 全球领先的客户关系管理 (CRM) 平台
        website: https://www.salesforce.com
        industry: 企业软件
        headquarters: 美国旧金山
      product_catalog:
        - canonical_name: Salesforce Sales Cloud
          description: 销售自动化 CRM 产品
          category: CRM
          pricing_model: subscription
          deployment_type: cloud
        - canonical_name: Salesforce Service Cloud
          description: 客户服务管理平台
          category: 客服系统
          pricing_model: subscription
          deployment_type: cloud
      industry_classification:
        industry_id: ent_industry_enterprise_software
        category_ids:
          - ent_category_crm
          - ent_category_customer_service
      target_audience:
        - canonical_name: 销售负责人
          description: 负责销售团队管理和业绩达成的决策者
          decision_authority: high
        - canonical_name: 客服主管
          description: 负责客户服务团队运营的管理者
          decision_authority: medium
    expected_output:
      created_entities:
        - id: ent_brand_salesforce
          type: brand
          canonical_name: Salesforce
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_salesforce_official]
        - id: ent_product_salesforce_sales_cloud
          type: product
          canonical_name: Salesforce Sales Cloud
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_salesforce_official]
        - id: ent_product_salesforce_service_cloud
          type: product
          canonical_name: Salesforce Service Cloud
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_salesforce_official]
        - id: ent_audience_sales_leader
          type: audience
          canonical_name: 销售负责人
          status: active
          version: 1.0.0
          scope: shared
          decision_authority: high
        - id: ent_audience_cs_manager
          type: audience
          canonical_name: 客服主管
          status: active
          version: 1.0.0
          scope: shared
          decision_authority: medium
      created_relations:
        - subject_id: ent_brand_salesforce
          relation: operates_in
          object_id: ent_industry_enterprise_software
          source_refs: [src_salesforce_official]
        - subject_id: ent_product_salesforce_sales_cloud
          relation: belongs_to
          object_id: ent_brand_salesforce
          source_refs: [src_salesforce_official]
        - subject_id: ent_product_salesforce_sales_cloud
          relation: belongs_to
          object_id: ent_category_crm
          source_refs: [src_salesforce_official]
        - subject_id: ent_brand_salesforce
          relation: serves
          object_id: ent_audience_sales_leader
          source_refs: [src_salesforce_official]
        - subject_id: ent_brand_salesforce
          relation: serves
          object_id: ent_audience_cs_manager
          source_refs: [src_salesforce_official]
      onboarding_summary:
        entity_count: 5
        relation_count: 5
        coverage_score: 1.0
        missing_fields: []
      recommended_actions:
        - competitor_discovery
        - topic_planning
        - content_audit
    demonstrates: >
      演示品牌基本信息、产品、行业、用户角色的完整导入流程。
      所有实体ID遵循ent_{type}_{short_name}格式，所有关系带有source_refs。
      验证规则：brand_profile_completeness, entity_id_format, source_required_for_facts。
    source_refs:
      - src_salesforce_official
      - entities.yaml
    tags: [brand_onboarding, brand_profile, brand, product, audience]

  # --- 品牌导入 示例 2 ---
  - id: ex_bo_002
    task_id: task_brand_onboarding
    name: 品牌导入-品牌主张与事实分离
    scenario: >
      品牌官网宣称"行业领先"和"市场份额第一"，导入时需要将品牌自述标记为claim，
      区分事实性信息（公司成立时间、产品名称）和品牌主张。
    input:
      brand_profile:
        canonical_name: 某CRM品牌
        aliases: []
        description: 行业领先的CRM解决方案提供商
        website: https://www.example-crm.com
        industry: 企业软件
        headquarters: 中国北京
      product_catalog:
        - canonical_name: 某CRM标准版
          description: 市场占有率第一的CRM产品
          category: CRM
          pricing_model: subscription
          deployment_type: cloud
      brand_claims:
        - claim_statement: 行业领先的CRM解决方案提供商
          claimant: 品牌官网 About Us 页面
          stance: self_claim
        - claim_statement: 市场占有率第一的CRM产品
          claimant: 品牌官网产品页
          stance: self_claim
      industry_classification:
        industry_id: ent_industry_enterprise_software
        category_ids:
          - ent_category_crm
      target_audience:
        - canonical_name: 中小企业主
          description: 中小企业的经营决策者
          decision_authority: high
    expected_output:
      created_entities:
        - id: ent_brand_example_crm
          type: brand
          canonical_name: 某CRM品牌
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_example_crm_official]
        - id: ent_product_example_crm_standard
          type: product
          canonical_name: 某CRM标准版
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_example_crm_official]
        - id: ent_claim_example_crm_leader
          type: claim
          canonical_name: 某CRM品牌-行业领先
          claim_statement: 行业领先的CRM解决方案提供商
          claimant_id: ent_brand_example_crm
          stance: self_claim
          evidence_level: weak
          status: active
          version: 1.0.0
          source_refs: [src_example_crm_official]
        - id: ent_claim_example_crm_market_share
          type: claim
          canonical_name: 某CRM品牌-市场占有率第一
          claim_statement: 市场占有率第一的CRM产品
          claimant_id: ent_brand_example_crm
          stance: self_claim
          evidence_level: unverifiable
          status: active
          version: 1.0.0
          source_refs: [src_example_crm_official]
      created_relations:
        - subject_id: ent_brand_example_crm
          relation: operates_in
          object_id: ent_industry_enterprise_software
          source_refs: [src_example_crm_official]
        - subject_id: ent_product_example_crm_standard
          relation: belongs_to
          object_id: ent_brand_example_crm
          source_refs: [src_example_crm_official]
      onboarding_summary:
        entity_count: 4
        relation_count: 2
        coverage_score: 0.85
        missing_fields: [founded_date]
      recommended_actions:
        - claim_verification
        - competitor_discovery
    demonstrates: >
      演示品牌自述必须标记为claim而非fact的规则（brand_claims_as_claims）。
      "行业领先"和"市场占有率第一"为self_claim，evidence_level分别为weak和unverifiable。
      品牌基本信息不含未经验证的主张。
    source_refs:
      - src_example_crm_official
      - claim_policy.yaml
      - entities.yaml
    tags: [brand_onboarding, claim_separation, brand, claim, self_claim]

  # --- 品牌导入 示例 3 ---
