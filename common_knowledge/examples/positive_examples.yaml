  # --- 品牌导入 示例 4 ---
  - id: ex_bo_004
    task_id: task_brand_onboarding
    name: 品牌导入-防重复创建检查
    scenario: >
      系统已存在品牌"小米"的实体记录，再次导入同名品牌时，
      应触发duplicate_check规则，返回已存在实体的引用而非创建新实体。
    input:
      brand_profile:
        canonical_name: 小米
        aliases: [Xiaomi, 小米科技]
        description: 智能手机和智能硬件制造商
        website: https://www.mi.com
        industry: 消费电子
        headquarters: 中国北京
      product_catalog:
        - canonical_name: 小米 14 Pro
          description: 旗舰智能手机
          category: 智能手机
          pricing_model: one_time
          deployment_type: hardware
      industry_classification:
        industry_id: ent_industry_consumer_electronics
        category_ids:
          - ent_category_smartphone
      target_audience:
        - canonical_name: 消费者
          description: 个人电子产品购买者
          decision_authority: medium
    expected_output:
      created_entities:
        - id: ent_product_xiaomi_14pro
          type: product
          canonical_name: 小米 14 Pro
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_xiaomi_official]
      created_relations:
        - subject_id: ent_product_xiaomi_14pro
          relation: belongs_to
          object_id: ent_brand_xiaomi
          source_refs: [src_xiaomi_official]
        - subject_id: ent_product_xiaomi_14pro
          relation: belongs_to
          object_id: ent_category_smartphone
          source_refs: [src_xiaomi_official]
      onboarding_summary:
        entity_count: 1
        relation_count: 2
        coverage_score: 1.0
        missing_fields: []
        duplicate_detected: true
        existing_brand_id: ent_brand_xiaomi
      recommended_actions:
        - product_catalog_refresh
        - topic_planning
    demonstrates: >
      演示duplicate_check规则：创建前检查是否已存在同名品牌实体。
      检测到ent_brand_xiaomi已存在，不重复创建品牌实体，
      仅追加新产品ent_product_xiaomi_14pro并建立关系。
    source_refs:
      - src_xiaomi_official
      - brand_onboarding.yaml
    tags: [brand_onboarding, duplicate_check, brand, product]

  # --- 品牌导入 示例 5 ---
  - id: ex_bo_005
    task_id: task_brand_onboarding
    name: 品牌导入-使用场景与问题关联
    scenario: >
      品牌导入时不仅建立基本实体和关系，还建立使用场景（use_case）和用户问题（problem）实体，
      以及产品与使用场景、产品与问题之间的关联关系。
    input:
      brand_profile:
        canonical_name: 飞书
        aliases: [Feishu, Lark]
        description: 企业协作与管理平台
        website: https://www.feishu.cn
        industry: 企业软件
        headquarters: 中国北京
      product_catalog:
        - canonical_name: 飞书
          description: 一站式企业协作平台
          category: 协同办公
          pricing_model: subscription
          deployment_type: cloud
      industry_classification:
        industry_id: ent_industry_enterprise_software
        category_ids:
          - ent_category_collaboration
      target_audience:
        - canonical_name: 企业管理者
          description: 企业管理与运营决策者
          decision_authority: high
        - canonical_name: 团队成员
          description: 日常使用协作工具的员工
          decision_authority: low
    expected_output:
      created_entities:
        - id: ent_brand_feishu
          type: brand
          canonical_name: 飞书
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_feishu_official]
        - id: ent_product_feishu
          type: product
          canonical_name: 飞书
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_feishu_official]
        - id: ent_use_case_remote_communication
          type: use_case
          canonical_name: 远程沟通协作
          description: 分布式团队通过即时消息、视频会议进行日常沟通
          status: active
          version: 1.0.0
          scope: shared
          related_audience_ids: [ent_audience_team_member]
        - id: ent_use_case_document_collaboration
          type: use_case
          canonical_name: 文档协同编辑
          description: 多人实时协作编辑文档、表格和知识库
          status: active
          version: 1.0.0
          scope: shared
          related_audience_ids: [ent_audience_team_member]
        - id: ent_problem_communication_inefficiency
          type: problem
          canonical_name: 团队沟通效率低
          description: 信息分散在多个工具中，沟通成本高，信息传递不及时
          status: active
          version: 1.0.0
          scope: shared
          severity: high
          related_audience_ids: [ent_audience_manager, ent_audience_team_member]
      created_relations:
        - subject_id: ent_brand_feishu
          relation: operates_in
          object_id: ent_industry_enterprise_software
          source_refs: [src_feishu_official]
        - subject_id: ent_product_feishu
          relation: belongs_to
          object_id: ent_brand_feishu
          source_refs: [src_feishu_official]
        - subject_id: ent_product_feishu
          relation: belongs_to
          object_id: ent_category_collaboration
          source_refs: [src_feishu_official]
        - subject_id: ent_product_feishu
          relation: supports_use_case
          object_id: ent_use_case_remote_communication
          source_refs: [src_feishu_official]
        - subject_id: ent_product_feishu
          relation: supports_use_case
          object_id: ent_use_case_document_collaboration
          source_refs: [src_feishu_official]
        - subject_id: ent_product_feishu
          relation: solves
          object_id: ent_problem_communication_inefficiency
          source_refs: [src_feishu_official]
        - subject_id: ent_brand_feishu
          relation: serves
          object_id: ent_audience_manager
          source_refs: [src_feishu_official]
        - subject_id: ent_brand_feishu
          relation: serves
          object_id: ent_audience_team_member
          source_refs: [src_feishu_official]
      onboarding_summary:
        entity_count: 6
        relation_count: 8
        coverage_score: 1.0
        missing_fields: []
      recommended_actions:
        - competitor_discovery
        - topic_planning
        - content_audit
    demonstrates: >
      演示品牌导入时创建use_case和problem实体，并建立supports_use_case和solves关系。
      产品与使用场景的关联不限于品类归属，而是描述具体工作流。
      问题实体从用户视角描述痛点，非产品功能视角。
    source_refs:
      - src_feishu_official
      - entities.yaml
    tags: [brand_onboarding, use_case, problem, brand, product, audience]

  # --- 品牌导入 示例 6 ---
