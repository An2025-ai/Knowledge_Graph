          type: brand
          canonical_name: 华为
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_huawei_official]
        - id: ent_product_huawei_mate60pro
          type: product
          canonical_name: 华为 Mate 60 Pro
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_huawei_official]
        - id: ent_product_huawei_cloud
          type: product
          canonical_name: 华为云
          status: active
          version: 1.0.0
          scope: brand_specific
          source_refs: [src_huawei_official]
      created_relations:
        - subject_id: ent_brand_huawei
          relation: operates_in
          object_id: ent_industry_consumer_electronics
          source_refs: [src_huawei_official]
        - subject_id: ent_product_huawei_mate60pro
          relation: belongs_to
          object_id: ent_brand_huawei
          source_refs: [src_huawei_official]
        - subject_id: ent_product_huawei_mate60pro
          relation: belongs_to
          object_id: ent_category_smartphone
          source_refs: [src_huawei_official]
        - subject_id: ent_product_huawei_cloud
          relation: belongs_to
          object_id: ent_brand_huawei
          source_refs: [src_huawei_official]
        - subject_id: ent_product_huawei_cloud
          relation: belongs_to
          object_id: ent_category_cloud_computing
          source_refs: [src_huawei_official]
        - subject_id: ent_brand_huawei
          relation: serves
          object_id: ent_audience_consumer
          source_refs: [src_huawei_official]
        - subject_id: ent_brand_huawei
          relation: serves
          object_id: ent_audience_cto
          source_refs: [src_huawei_official]
      onboarding_summary:
        entity_count: 3
        relation_count: 7
        coverage_score: 0.9
        missing_fields: []
      recommended_actions:
        - competitor_discovery
        - topic_planning
    demonstrates: >
      演示industry_validation和category_validation规则。
      行业分类ent_industry_consumer_electronics和品类ent_category_smartphone、
      ent_category_cloud_computing均引用entities.yaml中定义的实体类型。
      品牌关联多个行业时，每个产品正确归属到对应品类。
