          - 标注对比数据的来源和测试条件
          - 提供实际使用体验
      competitive_context:
        competitor_content_gaps:
          - 大多数对比文章缺少卫星通信维度的深入分析
          - 缺少户外场景的针对性推荐
        differentiation_points:
          - 突出卫星通信的独特价值
          - 提供场景化推荐而非一刀切结论
          - 引用第三方评测数据增加可信度
        content_angle: >
          以"场景化对比"为核心角度，不只告诉读者哪个更好，
          而是帮读者根据自身使用场景找到最适合的选择。
    demonstrates: >
      演示comparison意图的内容Brief生成。
      内容结构对应intent_comparison的expected_answer_blocks的四个模块。
      遵守must_avoid_unverified_superlatives规则：evidence_requirements中明确要求
      避免"绝对最好""完胜"等绝对化表述。
      遵守must_note_conditions_for_each_recommendation规则：
      推荐基于不同使用场景，而非一刀切。
      cite_all_claims规则：所有主张和对比数据要求有来源引用。
    source_refs:
      - content_brief.yaml
      - intent_types.yaml
    tags: [content_brief, comparison, evidence, differentiation, intent]

  # --- 内容Brief 示例 4 ---
  - id: ex_cb_004
    task_id: task_content_brief
    name: 内容Brief生成-案例研究类
    scenario: >
      基于case意图的主题机会，生成客户案例研究类内容的Brief。
      内容应包含case_overview、before_after_comparison、measurable_results和implementation_details。
    input:
      topic_opportunity:
        topic_id: ent_topic_sales_automation
        opportunity_score: 0.75
        priority: high
        recommended_content_types: [case_study]
      target_prompts:
        - prompt_id: ent_prompt_crm_case_study
          canonical_name: CRM系统的客户案例有哪些？
          intent_id: intent_case
          decision_stage: decision
          targets: [ent_audience_sales_leader, ent_audience_smb_owner]
      target_audience:
        - audience_id: ent_audience_sales_leader
          canonical_name: 销售负责人
          pain_points: [销售流程不透明, 业绩预测不准确]
          decision_authority: high
      intent_definition:
        intent_id: intent_case
        expected_answer_blocks: [case_overview, before_after_comparison, measurable_results, implementation_details]
        preferred_evidence: [verified_case_studies, customer_testimonials, third_party_reports]
        content_types: [case_study, customer_story, roi_report]
        quality_checks: [must_include_measurable_outcomes, must_verify_case_authenticity, must_note_conditions_that_may_differ]
      brand_capabilities:
        product_id: ent_product_salesforce_sales_cloud
        capabilities: [销售自动化, 报表分析, AI预测]
        use_cases: [销售管理, 绩效追踪]
    expected_output:
      brief:
        brief_id: ent_brief_crm_case_study
        title_suggestions:
          - 某科技公司如何通过CRM将销售效率提升40%
          - 从混乱到有序：一家制造企业的CRM实施案例
          - CRM案例研究：X公司销售流程数字化转型之路
        meta_description: 深入了解某企业如何通过CRM系统实现销售流程数字化转型，将销售效率提升40%，销售周期缩短25%。
        content_type: case_study
        target_audience: [ent_audience_sales_leader]
        target_prompts:
          - ent_prompt_crm_case_study
        intent: intent_case
        decision_stage: decision
        content_structure:
          - section: 客户背景
            description: 介绍客户公司的行业、规模、业务模式和原有挑战
            covers: case_overview
          - section: 面临的挑战
            description: 详细描述CRM实施前的销售管理痛点
            covers: case_overview
          - section: 实施前后对比
            description: 从销售流程、数据管理、团队协作三个维度对比实施前后变化
            covers: before_after_comparison
          - section: 可量化的成果
            description: 列举具体的可量化指标
            covers: measurable_results
            subsections:
              - 销售效率提升40%
              - 销售周期缩短25%
              - 客户响应时间减少60%
              - 数据准确率提升至98%
          - section: 实施详情
            description: 描述CRM系统的部署过程、关键决策和实施时间线
            covers: implementation_details
          - section: 客户证言
            description: 引用客户方的关键决策者评价
            covers: customer_testimonials
          - section: 经验总结
            description: 总结可复用的经验和注意事项
            covers: lessons_learned
        key_points:
          - 客户面临的真实业务挑战
          - 实施前后的量化对比
          - 具体的可量化成果
          - 实施过程中的关键决策
          - 客户方的真实评价
        evidence_requirements:
          - 必须获得客户授权和使用许可
          - 所有量化数据需客户方确认
          - 标注数据采集的时间范围
          - 标注实施条件（企业规模、行业、使用场景）
          - 引用客户方的官方评价
        source_suggestions:
          - src_customer_authorization
          - src_crm_implementation_record
          - src_customer_testimonial
        internal_linking:
          - 链接到CRM产品介绍页
          - 链接到其他客户案例
          - 链接到CRM选型指南
        differentiation_angle: >
          与竞品的案例研究不同，本案例聚焦销售流程数字化转型
          的实际效果，提供可量化的ROI数据。
        quality_checklist:
          - 是否包含了可量化的成果指标？
          - 案例是否经过客户方验证和授权？
          - 是否标注了实施条件可能影响结果差异？
          - 是否包含了客户证言？
          - 所有数据是否有明确来源？
        word_count_range: 1500-2500
      seo_guidance:
        primary_keywords:
          - CRM客户案例
          - CRM实施案例
          - 销售管理案例
        secondary_keywords:
          - 销售效率提升
          - 销售流程数字化
          - CRM效果
        semantic_entities:
          - 销售自动化
          - ROI
          - 数字化转型
          - 客户关系管理
        structured_data_type: Article
        eeat_signals:
          - 客户方授权和验证
          - 可量化的真实数据
          - 标注实施条件和时间
          - 客户证言增强可信度
      competitive_context:
        competitor_content_gaps:
          - 竞品案例缺少量化对比数据
          - 竞品案例偏重功能描述，轻视实际效果
        differentiation_points:
          - 强调可量化的ROI
          - 提供实施前后对比
          - 客户方验证增强可信度
        content_angle: >
          以"数据驱动的案例研究"为核心角度，
          区别于泛泛的客户介绍，聚焦可量化的业务成果
          和实施过程中的关键决策。
    demonstrates: >
      演示case意图的内容Brief生成。
      内容结构对应intent_case的expected_answer_blocks：
      case_overview、before_after_comparison、measurable_results、implementation_details。
      遵守must_include_measurable_outcomes质量检查：明确列出可量化指标。
      遵守must_verify_case_authenticity和must_note_conditions_that_may_differ规则：
      要求客户授权和标注实施条件。
    source_refs:
      - content_brief.yaml
      - intent_types.yaml
    tags: [content_brief, case_study, measurable_results, evidence, intent]

  # --- 内容Brief 示例 5 ---
  - id: ex_cb_005
    task_id: task_content_brief
    name: 内容Brief生成-差异化与竞争对齐
    scenario: >
      基于搜索诊断结果，生成内容Brief时需要体现与竞品的差异化，
      结合搜索诊断中发现的content_gaps和optimization_recommendations。
    input:
      topic_opportunity:
        topic_id: ent_topic_data_privacy
        opportunity_score: 0.7
        priority: high
        recommended_content_types: [whitepaper, educational_article]
      target_prompts:
        - prompt_id: ent_prompt_crm_data_privacy
          canonical_name: 使用云端CRM数据安全吗？
          intent_id: intent_risk
          decision_stage: evaluation
          targets: [ent_audience_sales_leader, ent_audience_smb_owner]
      target_audience:
        - audience_id: ent_audience_sales_leader
          canonical_name: 销售负责人
          pain_points: [数据安全担忧]
          decision_authority: high
        - audience_id: ent_audience_smb_owner
          canonical_name: 中小企业主
          pain_points: [合规顾虑]
          decision_authority: high
      intent_definition:
        intent_id: intent_risk
        expected_answer_blocks: [identified_risks, known_limitations, mitigation_strategies, when_not_to_use]
        preferred_evidence: [independent_audits, user_reported_issues, technical_analyses]
        content_types: [risk_analysis, limitation_guide, security_advisory]
        quality_checks: [must_balance_risks_with_context, must_cite_specific_evidence, must_provide_mitigation_where_possible]
      brand_capabilities:
        product_id: ent_product_salesforce_sales_cloud
        capabilities: [数据加密, 访问控制, 合规认证]
        use_cases: [客户数据管理]
        facts:
          - fact_id: ent_fact_crm_security_cert
            canonical_name: CRM安全认证
            description: 平台通过ISO 27001和SOC 2认证
            source_refs: [src_security_certification]
      search_diagnosis:
        content_gaps:
          - prompt_id: ent_prompt_crm_data_privacy
            gap_type: no_citation
            severity: high
            recommended_action: 创建数据安全白皮书，主动回应安全担忧
        optimization_recommendations:
          - recommendation: 发布数据安全与合规白皮书，提供第三方安全认证信息
            priority: critical
            expected_impact: 改善在risk意图下的品牌形象
            effort_level: high
            related_prompts: [ent_prompt_crm_data_privacy]
      competitor_content:
        - content_id: ent_content_competitor_security
          canonical_name: HubSpot安全白皮书
          strengths: [内容全面, 设计精美]
          weaknesses: [缺少中文版本, 缺少行业合规细节]
          covers: [ent_topic_data_privacy]
    expected_output:
      brief:
        brief_id: ent_brief_crm_data_privacy
        title_suggestions:
          - 云端CRM数据安全白皮书：企业数据保护完全指南
          - 使用云端CRM安全吗？数据隐私与合规深度解析
          - CRM数据安全：从ISO 27001到SOC 2的完整合规路径
        meta_description: 深度解析云端CRM的数据安全机制，包括加密技术、访问控制、合规认证，并提供风险评估和缓解策略，帮助企业做出数据安全决策。
        content_type: whitepaper
        target_audience: [ent_audience_sales_leader, ent_audience_smb_owner]
        target_prompts:
          - ent_prompt_crm_data_privacy
        intent: intent_risk
        decision_stage: evaluation
        content_structure:
          - section: 云端CRM的数据安全概述
            description: 介绍云端CRM面临的数据安全挑战和整体安全框架
            covers: identified_risks
          - section: 潜在风险与已知局限
            description: 客观分析云端CRM的潜在安全风险和已知局限性
            covers: known_limitations
          - section: 安全缓解策略
            description: 从加密、访问控制、合规认证三个维度阐述缓解措施
            covers: mitigation_strategies
          - section: 不适合使用云端CRM的场景
            description: 明确哪些场景不适合使用云端CRM
            covers: when_not_to_use
          - section: 合规认证解读
            description: 详细解读ISO 27001、SOC 2等认证的含义和覆盖范围
            covers: mitigation_strategies
          - section: 最佳实践建议
            description: 企业选择和使用CRM时的数据安全最佳实践
            covers: mitigation_strategies
        key_points:
          - 云端CRM数据安全的核心风险
          - 加密技术和访问控制机制
          - ISO 27001和SOC 2认证的意义
          - 不适合使用云端CRM的场景
          - 数据安全最佳实践建议
        evidence_requirements:
          - 引用第三方安全审计报告
          - 引用ISO 27001和SOC 2认证证书
          - 引用行业数据安全法规
          - 平衡呈现风险和缓解措施
          - 所有安全声明有具体证据支撑
        source_suggestions:
          - src_security_certification
          - src_third_party_audit
          - src_data_protection_regulation
          - src_industry_security_standard
        internal_linking:
          - 链接到CRM产品功能页
          - 链接到技术架构文档
        differentiation_angle: >
          与HubSpot安全白皮书相比，本白皮书：
          1. 提供中文版本，覆盖中国市场
          2. 增加中国数据保护法规（如个保法、数据安全法）的合规分析
          3. 提供行业特定的合规建议（金融、医疗等）
          4. 平衡呈现风险和缓解措施，而非仅宣传优势
        quality_checklist:
          - 是否平衡呈现了风险和缓解措施？
          - 所有安全声明是否有具体证据？
          - 是否提供了缓解策略？
          - 是否明确了不适合使用的场景？
          - 是否引用了第三方安全认证？
        word_count_range: 3000-5000
      seo_guidance:
        primary_keywords:
          - CRM数据安全
          - 云端CRM安全
          - CRM数据隐私
        secondary_keywords:
          - CRM安全认证
          - ISO 27001 CRM
          - SOC 2 CRM
          - 数据加密
        semantic_entities:
          - 数据保护
          - 合规认证
          - 访问控制
          - 加密技术
          - 个人信息保护法
        structured_data_type: Article
        eeat_signals:
          - 引用第三方安全审计和认证
          - 展示行业安全专业知识
          - 提供可验证的安全认证编号
          - 标注内容更新时间
      competitive_context:
        competitor_content_gaps:
          - 竞品HubSpot白皮书缺少中文版本
          - 缺少中国数据法规合规分析
          - 缺少行业特定的合规建议
          - 偏重宣传优势，风险评估不足
        differentiation_points:
          - 中文版本覆盖中国市场
          - 中国数据法规合规分析
          - 行业特定合规建议
          - 平衡呈现风险和缓解
        content_angle: >
          以"客观全面的数据安全指南"为核心角度，
          不回避风险，平衡呈现安全挑战和解决方案，
          建立品牌在数据安全领域的专业可信形象。
    demonstrates: >
      演示内容Brief如何结合搜索诊断结果进行差异化。
      利用search_diagnosis中的content_gaps和optimization_recommendations
      指导Brief的生成方向。
      遵守differentiate_from_competitors规则：通过分析竞品HubSpot白皮书的
      优缺点（缺少中文、缺少行业合规细节），制定差异化策略。
      遵守must_balance_risks_with_context质量检查：内容结构包含风险识别、
      已知局限和缓解策略，平衡呈现而非仅宣传优势。
    source_refs:
      - content_brief.yaml
      - search_diagnosis.yaml
      - intent_types.yaml
    tags: [content_brief, differentiation, search_diagnosis, risk, competitor]

