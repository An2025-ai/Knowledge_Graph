        - topic_id: ent_topic_ai_crm
          gap_description: 品牌无AI CRM相关内容
          competitor_coverage: HubSpot已覆盖
          urgency: high
      topic_clusters:
        - cluster_name: CRM技术趋势
          pillar_topic: ent_topic_ai_crm
          subtopics: [ent_topic_web3_crm]
          coverage_score: 0.0
    demonstrates: >
      演示avoid_trend_only规则。
      "Web3与CRM"主题虽然在社交媒体上趋势上升，但品牌不具备相关能力，
      用户痛点也不匹配该主题，因此opportunity_score仅为0.15，优先级为low。
      与之对比，"AI驱动的CRM"趋势稳定且与品牌能力和用户需求匹配，优先级为high。
      趋势数据应与品牌能力和用户需求结合判断，而非作为唯一依据。
    source_refs:
      - topic_planning.yaml
    tags: [topic_planning, avoid_trend_only, trend, opportunity_score]

