        - subject_id: ent_brand_example_ai
          relation: operates_in
          object_id: ent_industry_enterprise_software
          source_refs: [src_example_ai_official]
        - subject_id: ent_product_example_ai_platform
          relation: belongs_to
          object_id: ent_brand_example_ai
          source_refs: [src_example_ai_official]
        - subject_id: ent_product_example_ai_platform
