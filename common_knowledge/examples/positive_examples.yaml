  # --- 搜索诊断 示例 2 ---
  - id: ex_sd_002
    task_id: task_search_diagnosis
    name: 搜索诊断-区分提及与引用
    scenario: >
      品牌在AI回答中被提及（mention）和被引用（citation）是两种不同的可见度指标。
      提及仅表示品牌被列出，引用表示AI以品牌内容为信息源。
    input:
      brand_profile:
        brand_id: ent_brand_huawei
        canonical_name: 华为
        aliases: [Huawei]
        products: [ent_product_huawei_mate60pro]
        industry: 消费电子
      target_prompts:
        - prompt_id: ent_prompt_phone_comparison
          canonical_name: 华为 Mate 60 Pro 和 iPhone 15 Pro 怎么选？
          intent_id: intent_comparison
          decision_stage: evaluation
        - prompt_id: ent_prompt_satellite_phone
          canonical_name: 卫星通信手机有哪些？
          intent_id: intent_recommendation
          decision_stage: solution
      search_observations:
        - observation_id: ent_obs_010
          platform: Google AI Overview
          prompt_id: ent_prompt_phone_comparison
          result_snapshot:
            brand_mentioned: true
            brand_cited: false
            mention_context: 华为Mate 60 Pro和iPhone 15 Pro都是优秀的选择
            citation_text: null
          observed_at: 2026-08-06
        - observation_id: ent_obs_011
          platform: Google AI Overview
          prompt_id: ent_prompt_satellite_phone
          result_snapshot:
            brand_mentioned: true
            brand_cited: true
            mention_context: 华为Mate 60 Pro是首款支持卫星通信的智能手机
            citation_text: 根据华为官方技术文档，Mate 60 Pro支持天通卫星通信
          observed_at: 2026-08-06
        - observation_id: ent_obs_012
          platform: 百度AI
          prompt_id: ent_prompt_phone_comparison
          result_snapshot:
            brand_mentioned: true
            brand_cited: true
            mention_context: 华为Mate 60 Pro搭载麒麟芯片
            citation_text: 参考华为官方参数页面
          observed_at: 2026-08-06
      competitor_list:
        - competitor_id: ent_competitor_apple
          canonical_name: Apple
          market_position: leader
    expected_output:
      visibility_summary:
        overall_score: 0.67
        brand_mention_rate: 1.0
        citation_rate: 0.67
        share_of_voice: 0.67
        trend_direction: stable
      platform_breakdown:
        - platform: Google AI Overview
          mention_count: 2
          citation_count: 1
          sentiment: positive
          top_prompts: [ent_prompt_satellite_phone]
          weak_prompts: []
        - platform: 百度AI
          mention_count: 1
          citation_count: 1
          sentiment: neutral
          top_prompts: [ent_prompt_phone_comparison]
          weak_prompts: []
      competitor_comparison:
        - competitor_id: ent_competitor_apple
          share_of_voice: 0.33
          strength_areas: []
          weakness_areas: [卫星通信相关提问词]
      content_gaps:
        - prompt_id: ent_prompt_phone_comparison
          gap_type: no_citation
          severity: medium
          recommended_action: 优化对比类内容以增加被Google AI引用的概率
          platform: Google AI Overview
      optimization_recommendations:
        - recommendation: 创建结构化对比内容，覆盖华为与竞品在各维度的对比
          priority: medium
          expected_impact: 提升在comparison意图下的引用率
          effort_level: medium
          related_prompts: [ent_prompt_phone_comparison]
    demonstrates: >
      演示distinguish_mention_from_citation规则。
      在Google AI Overview中，"手机怎么选"仅有mention无citation；
      "卫星通信手机"既有mention又有citation。
      品牌提及率1.0但引用率0.67，说明虽然每次都被提及但不一定被引用。
      content_gaps中区分了no_mention和no_citation两种缺口类型。
    source_refs:
      - search_diagnosis.yaml
      - claim_policy.yaml
    tags: [search_diagnosis, mention_vs_citation, citation, visibility]

