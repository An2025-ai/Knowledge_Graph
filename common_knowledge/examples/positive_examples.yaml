  # --- 主题规划 示例 3 ---
  - id: ex_tp_003
    task_id: task_topic_planning
    name: 主题规划-证据链追溯
    scenario: >
      每个机会点应追溯其推导证据链（evidence_chain_transparency规则）。
      机会评分基于多维度证据，而非主观判断。
    input:
      brand_profile:
        brand_id: ent_brand_huawei
        canonical_name: 华为
        industry: 消费电子
        products: [ent_product_huawei_mate60pro]
      industry_topics:
        - topic_id: ent_topic_satellite_comm
          canonical_name: 卫星通信手机
          search_volume: 8000
          competition_level: low
        - topic_id: ent_topic_mobile_photo
          canonical_name: 手机摄影技术
          search_volume: 12000
          competition_level: high
      audience_and_use_cases:
        - audience_id: ent_audience_consumer
          canonical_name: 消费者
          pain_points: [手机拍照效果不满意, 户外通信无信号]
          use_case_ids: [ent_use_case_photography, ent_use_case_outdoor]
      competitor_coverage:
        - competitor_id: ent_competitor_apple
          covered_topics: [ent_topic_mobile_photo]
          content_strengths: [手机摄影, 视频拍摄]
          content_weaknesses: [卫星通信]
        - competitor_id: ent_competitor_samsung
          covered_topics: [ent_topic_mobile_photo]
          content_strengths: [屏幕技术]
          content_weaknesses: [卫星通信]
      content_inventory: []
      recent_observations:
        - observation_id: ent_obs_satellite_trend
          observation_type: trend
          platform: 百度指数
          query_context: 卫星通信手机
          observed_at: 2026-08-05
    expected_output:
      opportunities:
        - topic_id: ent_topic_satellite_comm
          topic_name: 卫星通信手机
          opportunity_type: competitive
          relevance_score: 0.95
          demand_score: 0.7
          competition_score: 0.1
          opportunity_score: 0.9
          priority: critical
          recommended_content_types: [educational_article, comparison_article, case_study]
          target_audiences: [ent_audience_consumer]
          related_prompts: [ent_prompt_satellite_phone_how]
          evidence: >
            [证据1] 品牌能力：华为Mate 60 Pro支持卫星通信功能（来源：src_huawei_official）。
            [证据2] 受众需求：消费者痛点"户外通信无信号"（来源：受众画像分析）。
            [证据3] 竞品缺口：竞品Apple和Samsung均未推出卫星通信功能（来源：产品功能对比）。
            [证据4] 搜索趋势：百度指数显示"卫星通信手机"搜索量上升（来源：ent_obs_satellite_trend，2026-08-05）。
            [证据5] 竞争度：搜索量8000，竞争度低，为蓝海市场。
            [综合判断] 品牌具备独特能力+竞品空白+用户需求+搜索趋势上升，综合评分0.9。
        - topic_id: ent_topic_mobile_photo
          topic_name: 手机摄影技术
          opportunity_type: competitive
          relevance_score: 0.8
          demand_score: 0.9
          competition_score: 0.9
          opportunity_score: 0.55
          priority: medium
          recommended_content_types: [comparison_article]
          target_audiences: [ent_audience_consumer]
          related_prompts: [ent_prompt_phone_photo_compare]
          evidence: >
            [证据1] 品牌能力：华为Mate 60 Pro具备超感知影像系统（来源：src_huawei_official）。
            [证据2] 受众需求：消费者痛点"手机拍照效果不满意"（来源：受众画像分析）。
            [证据3] 竞品情况：竞品Apple和Samsung在手机摄影主题上已有大量内容覆盖（来源：竞品分析）。
            [证据4] 竞争度：搜索量12000，竞争度高，市场份额被高度瓜分。
            [综合判断] 品牌具备能力但竞争激烈，建议差异化切入（如夜景拍摄、长焦微距），综合评分0.55。
      content_gaps:
        - topic_id: ent_topic_satellite_comm
          gap_description: 品牌无卫星通信相关的独立内容资产
          competitor_coverage: 竞品均未覆盖
          urgency: critical
      topic_clusters:
        - cluster_name: 手机通信技术
          pillar_topic: ent_topic_satellite_comm
          subtopics: []
          coverage_score: 0.0
        - cluster_name: 手机影像
          pillar_topic: ent_topic_mobile_photo
          subtopics: []
          coverage_score: 0.0
    demonstrates: >
      演示evidence_chain_transparency规则。
      每个机会点的evidence字段以结构化方式追溯推导证据链：
      标注[证据1]到[证据5]，每条证据明确来源和类型。
      综合评分基于多维度证据（品牌能力、受众需求、竞品缺口、搜索趋势、竞争度），
      而非单一维度或主观判断。
    source_refs:
      - topic_planning.yaml
      - claim_policy.yaml
    tags: [topic_planning, evidence_chain, opportunity_score, topic, competitor]

  # --- 主题规划 示例 4 ---
  - id: ex_tp_004
    task_id: task_topic_planning
    name: 主题规划-避免仅凭趋势推荐
    scenario: >
      不应仅凭短期趋势推荐主题，需结合品牌能力和用户需求（avoid_trend_only规则）。
      对于趋势高但品牌能力弱或用户需求不匹配的主题，应降低优先级。
    input:
      brand_profile:
        brand_id: ent_brand_example_crm
        canonical_name: 某CRM品牌
        industry: 企业软件
        products: [ent_product_example_crm_standard]
      industry_topics:
        - topic_id: ent_topic_web3_crm
          canonical_name: Web3与CRM
          search_volume: 2000
          competition_level: low
        - topic_id: ent_topic_ai_crm
          canonical_name: AI驱动的CRM
          search_volume: 6000
          competition_level: medium
      audience_and_use_cases:
        - audience_id: ent_audience_smb_owner
          canonical_name: 中小企业主
          pain_points: [客户管理效率低, 获客成本高]
          use_case_ids: [ent_use_case_customer_management]
      competitor_coverage:
        - competitor_id: ent_competitor_hubspot
          covered_topics: [ent_topic_ai_crm]
          content_strengths: [AI CRM]
          content_weaknesses: [Web3 CRM]
      content_inventory: []
      recent_observations:
        - observation_id: ent_obs_web3_trending
          observation_type: trend
          platform: 社交媒体
          query_context: Web3 CRM
          observed_at: 2026-08-07
    expected_output:
      opportunities:
        - topic_id: ent_topic_ai_crm
          topic_name: AI驱动的CRM
          opportunity_type: competitive
          relevance_score: 0.8
          demand_score: 0.8
          competition_score: 0.5
          opportunity_score: 0.75
          priority: high
          recommended_content_types: [educational_article, case_study, whitepaper]
          target_audiences: [ent_audience_smb_owner]
          related_prompts: [ent_prompt_ai_crm_how]
          evidence: >
            AI驱动的CRM直接解决"客户管理效率低"痛点；
            品牌产品具备AI能力基础；搜索量6000，趋势稳定；
            竞品HubSpot已有覆盖，但可通过差异化角度切入。
        - topic_id: ent_topic_web3_crm
          topic_name: Web3与CRM
          opportunity_type: trending
          relevance_score: 0.1
          demand_score: 0.2
          competition_score: 0.2
          opportunity_score: 0.15
          priority: low
          recommended_content_types: []
          target_audiences: []
          related_prompts: []
          evidence: >
            该主题在社交媒体上短期趋势上升（来源：ent_obs_web3_trending）；
            但品牌产品不涉及Web3能力，用户痛点不匹配；
            仅凭短期趋势不足以支撑推荐，标记为low优先级。
