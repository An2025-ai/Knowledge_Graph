  # --- 搜索诊断 示例 4 ---
  - id: ex_sd_004
    task_id: task_search_diagnosis
    name: 搜索诊断-情感分析需上下文
    scenario: >
      情感分析必须考虑上下文，避免误判（sentiment_accuracy规则）。
      品牌在AI回答中被提及的上下文和语气需要仔细分析。
    input:
      brand_profile:
        brand_id: ent_brand_example_crm
        canonical_name: 某CRM品牌
        aliases: []
        products: [ent_product_example_crm_standard]
        industry: 企业软件
      target_prompts:
        - prompt_id: ent_prompt_crm_pricing
          canonical_name: CRM系统一般多少钱？
          intent_id: intent_pricing
          decision_stage: decision
        - prompt_id: ent_prompt_crm_risk
          canonical_name: 使用云端CRM有什么风险？
          intent_id: intent_risk
          decision_stage: evaluation
      search_observations:
        - observation_id: ent_obs_030
          platform: Google AI Overview
          prompt_id: ent_prompt_crm_pricing
          result_snapshot:
            brand_mentioned: true
            brand_cited: false
            mention_context: 某CRM品牌定价较高，但功能全面
            sentiment_label: neutral
          observed_at: 2026-08-07
        - observation_id: ent_obs_031
          platform: Google AI Overview
          prompt_id: ent_prompt_crm_risk
          result_snapshot:
            brand_mentioned: true
            brand_cited: false
            mention_context: 某CRM品牌在数据安全方面存在一些用户的担忧
            sentiment_label: negative
          observed_at: 2026-08-07
      competitor_list:
        - competitor_id: ent_competitor_hubspot
          canonical_name: HubSpot
          market_position: leader
    expected_output:
      visibility_summary:
        overall_score: 0.4
        brand_mention_rate: 1.0
        citation_rate: 0.0
        share_of_voice: 0.5
        trend_direction: stable
      platform_breakdown:
        - platform: Google AI Overview
          mention_count: 2
          citation_count: 0
          sentiment: mixed
          top_prompts: []
          weak_prompts: [ent_prompt_crm_pricing, ent_prompt_crm_risk]
          sentiment_details:
            - prompt: ent_prompt_crm_pricing
              sentiment: neutral
              nuance: '定价较高为客观描述，但功能全面为正面补充'
            - prompt: ent_prompt_crm_risk
              sentiment: negative
              nuance: 提及用户担忧但未引用具体来源，需验证
      competitor_comparison:
        - competitor_id: ent_competitor_hubspot
          share_of_voice: 0.5
          strength_areas: [定价相关提问词]
          weakness_areas: [风险相关提问词]
      content_gaps:
        - prompt_id: ent_prompt_crm_risk
          gap_type: negative_sentiment
          severity: high
          recommended_action: 创建数据安全白皮书，主动回应安全担忧
        - prompt_id: ent_prompt_crm_pricing
          gap_type: no_citation
          severity: medium
          recommended_action: 确保定价信息在权威来源中可被引用
      optimization_recommendations:
        - recommendation: 发布数据安全与合规白皮书，提供第三方安全认证信息
          priority: critical
          expected_impact: 改善在risk意图下的品牌形象
          effort_level: high
          related_prompts: [ent_prompt_crm_risk]
        - recommendation: 在官方网站标注清晰的定价信息，便于AI引用
          priority: medium
          expected_impact: 提升pricing意图下的引用率
          effort_level: low
          related_prompts: [ent_prompt_crm_pricing]
    demonstrates: >
      演示sentiment_accuracy规则。
      对"定价较高"的分析：虽然"较高"可能被视为负面，但上下文"功能全面"提供了平衡，
      因此整体标记为neutral而非negative。
      对"安全担忧"的分析：标记为negative但标注nuance说明"未引用具体来源需验证"，
      避免仅凭一次观测做出确定性负面判断。
      通过sentiment_details.nuance字段提供上下文分析。
    source_refs:
      - search_diagnosis.yaml
    tags: [search_diagnosis, sentiment_accuracy, sentiment, context, risk]

