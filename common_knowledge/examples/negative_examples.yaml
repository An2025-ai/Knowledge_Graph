# GEO 第一层通用知识层 — 反例/错误示例
# 版本: 1.0.0
# 范围: 跨品牌、跨行业复用的方法与规范层
# 用途: 展示各任务模板中常见的错误做法，帮助理解规则边界

meta:
  version: 1.0.0
  created_at: 2026-08-07
  updated_at: 2026-08-07
  status: active
  scope: shared
  description: >
    本文件收集了 5 个 GEO L1 任务模板的典型反例（错误示例）。
    每个反例包含错误场景、错误做法、违规规则和正确做法，
    用于任务执行者的培训和自查。共 25 个反例，每任务 5 个。

# ============================================================
# 任务 1: 品牌导入 (Brand Onboarding)
# ============================================================

task_brand_onboarding_examples:

  - id: neg_bo_001
    task_id: task_brand_onboarding
    name: 品牌实体 ID 格式错误
    scenario: >
      导入新品牌时，操作者创建了品牌实体但使用了不符合规范的 ID 格式。
      品牌名称为"Salesforce"，操作者随手写了 ID 为 "salesforce_001"。
    wrong_approach:
      entity:
        id: "salesforce_001"
        type: "brand"
        canonical_name: "Salesforce"
        status: "active"
        version: "1.0.0"
    why_wrong: >
      实体 ID 必须遵循 ent_{type}_{short_name} 格式。ID "salesforce_001"
      缺少 ent_ 前缀，且使用了自增编号 001，不符合系统 ID 命名规范。
      这种 ID 无法被实体解析器正确识别类型，也无法与其他实体进行关系匹配。
    violated_rule: entity_id_format
    correct_approach:
      entity:
        id: "ent_brand_salesforce"
        type: "brand"
        canonical_name: "Salesforce"
        status: "active"
        version: "1.0.0"
    severity: critical
    tags: [brand_onboarding, entity_id_format]

  - id: neg_bo_002
    task_id: task_brand_onboarding
    name: 品牌 self_claim 被标记为 fact
    scenario: >
      从品牌官网收集信息时，操作者读到"行业领先的 CRM 平台"这一描述，
      直接将其标记为 fact 实体，没有标注来源和立场。
    wrong_approach:
      entity:
        id: "ent_fact_salesforce_leader"
        type: "fact"
        canonical_name: "行业领先的 CRM 平台"
        status: "active"
        subject_entity_id: "ent_brand_salesforce"
        # 缺少 source_refs 和 claimant 信息
    why_wrong: >
      品牌对自身的描述具有主观性，属于 self_claim，不能直接标记为 fact。
      根据 claim_policy.yaml，品牌自述必须标注 claimant_id 和 stance，
      且要求至少一个独立第三方验证才能晋升为 fact。缺少 source_refs 更是
      违反了 fact 实体的约束。
    violated_rule: brand_claims_as_claims
    correct_approach:
      entity:
        id: "ent_claim_salesforce_leader"
        type: "claim"
        canonical_name: "行业领先的 CRM 平台"
        status: "active"
        subject_entity_id: "ent_brand_salesforce"
        claimant_id: "ent_brand_salesforce"
        claim_statement: "行业领先的 CRM 平台"
        stance: "self_claim"
        evidence_level: "weak"
        source_refs: ["src_salesforce_official"]
    severity: high
    tags: [brand_onboarding, claim_vs_fact]

  - id: neg_bo_003
    task_id: task_brand_onboarding
    name: 品牌信息缺少必要字段
    scenario: >
      导入一个新兴品牌时，操作者仅填写了品牌名称和官网，遗漏了 industry
      和 product 信息，认为后续可以再补充。
    wrong_approach:
      entity:
        id: "ent_brand_newco"
        type: "brand"
        canonical_name: "NewCo"
        status: "active"
        website: "https://newco.example.com"
        # 缺少 industry 字段
        # 没有创建任何 product 实体
    why_wrong: >
      品牌基本信息必须包含 canonical_name、industry 和至少一个 product，
      这是品牌导入的 completion 标准。缺少 industry 会导致品牌无法参与
      行业分类分析，缺少 product 则无法进行后续的内容策略和搜索诊断。
    violated_rule: brand_profile_completeness
    correct_approach:
      entity:
        id: "ent_brand_newco"
        type: "brand"
        canonical_name: "NewCo"
        status: "active"
        website: "https://newco.example.com"
        industry: "企业软件"
      # 同时创建至少一个 product 实体
      product:
        id: "ent_product_newco_platform"
        type: "product"
        canonical_name: "NewCo Platform"
        status: "active"
        brand_id: "ent_brand_newco"
    severity: critical
    tags: [brand_onboarding, incomplete_profile]

  - id: neg_bo_004
    task_id: task_brand_onboarding
    name: 未检查重复品牌实体
    scenario: >
      操作者导入品牌"华为"时，未检查是否已存在同名实体，直接创建了
      新的 brand 实体，导致系统中出现两个"华为"品牌。
    wrong_approach:
      # 系统中已存在 ent_brand_huawei，但操作者不知情
      entity:
        id: "ent_brand_huawei_consumer"
        type: "brand"
        canonical_name: "华为"
        status: "active"
        # 未执行 duplicate_check
    why_wrong: >
      创建前必须检查是否已存在同名品牌实体。重复创建会导致知识图谱中
      出现多个指向同一品牌的实体，破坏关系网络的完整性和数据一致性。
      后续任务可能在不同实体上操作，产生矛盾的分析结果。
    violated_rule: duplicate_check
    correct_approach:
      # 第一步：检查是否存在同名实体
      # SELECT * WHERE type='brand' AND canonical_name='华为'
      # 发现已存在 ent_brand_huawei
      # 第二步：更新现有实体而非创建新实体
      entity:
        id: "ent_brand_huawei"
        type: "brand"
        canonical_name: "华为"
        status: "active"
        # 合并或补充信息
    severity: high
    tags: [brand_onboarding, duplicate_entity]

  - id: neg_bo_005
    task_id: task_brand_onboarding
    name: 行业分类未引用标准类型
    scenario: >
      操作者导入品牌时，随意填写了行业分类为"高科技"，但该分类
      不在 entities.yaml 定义的 industry 类型中。
    wrong_approach:
      relation:
        subject_id: "ent_brand_newco"
        relation_type: "operates_in"
        object_id: "高科技"  # 不是标准 industry 实体 ID
      # 或者创建了一个不在标准列表中的 industry
      entity:
        id: "ent_industry_high_tech"
        type: "industry"
        canonical_name: "高科技"  # 不在标准 industry 列表中
    why_wrong: >
      行业分类必须引用 entities.yaml 中定义的 industry 类型。
      使用非标准分类会导致行业分析无法统一，品牌之间无法正确比较。
      操作者应查阅 ontology/entities.yaml 确认可用的 industry 实体。
    violated_rule: industry_validation
    correct_approach:
      relation:
        subject_id: "ent_brand_newco"
        relation_type: "operates_in"
        object_id: "ent_industry_enterprise_software"
      # 如果"高科技"确实需要，应先在 entities.yaml 中注册该 industry
    severity: medium
    tags: [brand_onboarding, invalid_industry]

# ============================================================
# 任务 2: 提问词生成 (Prompt Generation)
# ============================================================

task_prompt_generation_examples:

  - id: neg_pg_001
    task_id: task_prompt_generation
    name: 仅生成品牌词提问词
    scenario: >
      为 Salesforce 品牌生成提问词时，操作者只生成了品牌名相关的提问词，
      如"Salesforce是什么""Salesforce怎么样"，没有覆盖品类词和问题词。
    wrong_approach:
      generated_prompts:
        - id: "ent_prompt_salesforce_what"
          canonical_name: "Salesforce 是什么"
          intent_id: "intent_brand"
        - id: "ent_prompt_salesforce_review"
          canonical_name: "Salesforce 怎么样"
          intent_id: "intent_review"
        - id: "ent_prompt_salesforce_price"
          canonical_name: "Salesforce 价格"
          intent_id: "intent_pricing"
        # 全部是品牌词，没有品类词和问题词
    why_wrong: >
      提问词不应仅包含品牌词。用户在实际搜索中大量使用品类词和问题词
      （如"CRM 怎么选""销售团队管理工具有哪些"），仅覆盖品牌词会导致
      提问词的搜索覆盖范围极窄，无法发现品牌可触达的非品牌搜索流量。
    violated_rule: avoid_branded_only
    correct_approach:
      generated_prompts:
        - id: "ent_prompt_salesforce_brand"
          canonical_name: "Salesforce CRM 平台介绍"
          intent_id: "intent_brand"
        - id: "ent_prompt_crm_selection"
          canonical_name: "中小企业 CRM 系统怎么选"
          intent_id: "intent_comparison"
        - id: "ent_prompt_sales_management"
          canonical_name: "销售团队管理工具有哪些"
          intent_id: "intent_recommendation"
        - id: "ent_prompt_crm_benefits"
          canonical_name: "CRM 系统对企业有什么好处"
          intent_id: "intent_education"
        - id: "ent_prompt_salesforce_price"
          canonical_name: "Salesforce 价格"
          intent_id: "intent_pricing"
    severity: high
    tags: [prompt_generation, branded_only]

  - id: neg_pg_002
    task_id: task_prompt_generation
    name: 提问词未关联目标用户角色
    scenario: >
      操作者生成了一批提问词，但所有提问词都未关联到任何 target_audience，
      使提问词成为无特定受众的通用词。
    wrong_approach:
      generated_prompts:
        - id: "ent_prompt_crm_how_to"
          canonical_name: "如何使用 CRM 管理销售线索"
          intent_id: "intent_how_to"
          # 缺少 targets 字段
          # 没有关联任何 audience
    why_wrong: >
      每个提问词应关联到至少一个目标用户角色。不关联受众会导致后续
      内容策略无法对准特定用户群体，内容创作缺乏针对性。
      提问词"如何使用 CRM 管理销售线索"明显面向销售负责人，
      应明确标注。
    violated_rule: audience_alignment
    correct_approach:
      generated_prompts:
        - id: "ent_prompt_crm_how_to"
          canonical_name: "如何使用 CRM 管理销售线索"
          intent_id: "intent_how_to"
          targets: ["ent_audience_sales_manager"]
          related_entities: ["ent_product_salesforce_sales_cloud"]
    severity: high
    tags: [prompt_generation, missing_audience]

  - id: neg_pg_003
    task_id: task_prompt_generation
    name: 意图覆盖不足
    scenario: >
      操作者生成的提问词全部集中在 comparison 和 review 两种意图类型，
      缺少 awareness、problem、implementation 等阶段的提问词。
    wrong_approach:
      generated_prompts:
        - id: "ent_prompt_crm_compare_a"
          canonical_name: "Salesforce 和 HubSpot 对比"
          intent_id: "intent_comparison"
        - id: "ent_prompt_crm_compare_b"
          canonical_name: "Zoho 和 Salesforce 区别"
          intent_id: "intent_comparison"
        - id: "ent_prompt_crm_review"
          canonical_name: "Salesforce 评测"
          intent_id: "intent_review"
        # 仅覆盖 2 种意图，远低于最低 8 种的要求
    why_wrong: >
      生成的提问词应覆盖至少 8 种意图类型，确保覆盖从 awareness 到
      decision 的完整决策链。仅覆盖 comparison 和 review 意味着用户
      在认知阶段、问题识别阶段、实施阶段都无法触达品牌内容。
    violated_rule: intent_coverage
    correct_approach:
      # 应补充覆盖多种意图的提问词，包括：
      # - intent_definition: "CRM 是什么"
      # - intent_education: "CRM 如何帮助企业提升销售效率"
      # - intent_problem_solving: "销售线索跟进不及时怎么办"
      # - intent_how_to: "如何在 CRM 中设置自动化工作流"
      # - intent_recommendation: "适合小团队的 CRM 推荐"
      # - intent_pricing: "CRM 系统一般多少钱"
      # - intent_case: "CRM 实施成功案例"
      # - intent_trend: "CRM 行业未来趋势"
      coverage_summary:
        total_prompts: 12
        intents_covered: 8
        stages_covered: 5
        intent_gaps: ["intent_definition", "intent_alternative", "intent_risk"]
    severity: medium
    tags: [prompt_generation, insufficient_intent_coverage]

  - id: neg_pg_004
    task_id: task_prompt_generation
    name: 生成语义重复的提问词
    scenario: >
      操作者批量生成了多个提问词，但其中多个在语义上高度重复，
      实际上表达的是同一个搜索意图。
    wrong_approach:
      generated_prompts:
        - id: "ent_prompt_crm_best_1"
          canonical_name: "最好的 CRM 系统是什么"
        - id: "ent_prompt_crm_best_2"
          canonical_name: "哪个 CRM 系统最好"
        - id: "ent_prompt_crm_best_3"
          canonical_name: "什么 CRM 最好用"
        - id: "ent_prompt_crm_best_4"
          canonical_name: "最佳 CRM 系统推荐"
        # 四个提问词语义完全相同
    why_wrong: >
      不应生成语义重复的提问词。重复的提问词会导致内容策略重复、
      搜索诊断结果冗余，浪费后续分析资源。虽然表达方式不同，
      但搜索意图相同，应合并为一个提问词，通过别名变体覆盖。
    violated_rule: no_duplicate_prompts
    correct_approach:
      generated_prompts:
        - id: "ent_prompt_crm_best"
          canonical_name: "最适合中小企业的 CRM 系统推荐"
          aliases:
            - "最好的 CRM 系统是什么"
            - "哪个 CRM 系统最好"
            - "什么 CRM 最好用"
          intent_id: "intent_recommendation"
    severity: medium
    tags: [prompt_generation, duplicate_prompts]

  - id: neg_pg_005
    task_id: task_prompt_generation
    name: 提问词语言不适配目标市场
    scenario: >
      品牌的目标市场是中国市场，但操作者生成的所有提问词均为英文，
      未根据目标市场语言生成中文提问词。
    wrong_approach:
      generated_prompts:
        - id: "ent_prompt_crm_what"
          canonical_name: "What is CRM"
          language: "en"
          intent_id: "intent_definition"
        - id: "ent_prompt_crm_how"
          canonical_name: "How to choose CRM"
          language: "en"
          intent_id: "intent_comparison"
        # 全部为英文，但目标市场是中国市场
    why_wrong: >
      根据目标市场生成对应语言的提问词。对于中国市场，应生成中文提问词。
      英文提问词在中国搜索引擎中的搜索量极低，无法有效覆盖目标用户。
      语言选择应匹配品牌的目标市场和用户搜索习惯。
    violated_rule: language_appropriateness
    correct_approach:
      generated_prompts:
        - id: "ent_prompt_crm_what"
          canonical_name: "CRM 是什么"
          language: "zh"
          intent_id: "intent_definition"
        - id: "ent_prompt_crm_how"
          canonical_name: "CRM 系统怎么选"
          language: "zh"
          intent_id: "intent_comparison"
      # 如果品牌同时覆盖海外市场，可额外生成英文提问词
    severity: medium
    tags: [prompt_generation, wrong_language]

# ============================================================
# 任务 3: 主题规划 (Topic Planning)
# ============================================================

task_topic_planning_examples:

  - id: neg_tp_001
    task_id: task_topic_planning
    name: 主题机会未映射到用户问题
    scenario: >
      操作者推荐了一个主题机会"AI 在 CRM 中的应用"，但未说明该主题
      解决哪个用户角色的什么问题，机会点缺乏用户视角。
    wrong_approach:
      opportunity:
        topic_id: "ent_topic_ai_in_crm"
        topic_name: "AI 在 CRM 中的应用"
        opportunity_type: "trending"
        opportunity_score: 0.85
        priority: "high"
        recommended_content_types: ["trend_report"]
        target_audiences: []  # 空，未关联任何用户角色
        related_prompts: []
        evidence: "AI 是当前热门话题"
        # 没有映射到具体的用户问题
    why_wrong: >
      每个主题机会必须映射到至少一个用户角色的具体问题。仅凭"AI 是热门话题"
      推荐主题，没有说明该主题能解决用户的什么痛点，违反了"主题必须服务于用户
      需求"的核心原则。没有用户问题映射，内容创作方向将偏离用户需求。
    violated_rule: topic_must_map_to_audience_problem
    correct_approach:
      opportunity:
        topic_id: "ent_topic_ai_in_crm"
        topic_name: "AI 在 CRM 中的应用"
        opportunity_type: "gap_fill"
        opportunity_score: 0.78
        priority: "high"
        recommended_content_types: ["educational_article", "buyer_guide"]
        target_audiences: ["ent_audience_sales_manager", "ent_audience_cto"]
        related_prompts:
          - "AI 如何帮助销售团队提高效率"
          - "CRM 中的 AI 功能有哪些实际价值"
        evidence: >
          调查显示 67% 的销售负责人不了解 AI 在 CRM 中的实际应用场景
          (source: 2025 行业报告), 且竞品尚未覆盖该主题的实操内容
    severity: critical
    tags: [topic_planning, no_audience_problem_mapping]

  - id: neg_tp_002
    task_id: task_topic_planning
    name: 使用过期观测数据作为事实依据
    scenario: >
      操作者引用 2024 年 Q1 的搜索趋势数据（距今已超过 18 个月）
      作为推荐"远程办公工具"主题的事实依据，未标注数据时效性。
    wrong_approach:
      opportunity:
        topic_id: "ent_topic_remote_work"
        topic_name: "远程办公工具选型指南"
        opportunity_score: 0.90
        priority: "critical"
        evidence: "远程办公搜索量增长 300%（2024 年 Q1 数据）"
        # 使用了 18 个月前已过期的观测数据
        # 未标注数据可能已过时
    why_wrong: >
      不应将过期观测数据用作事实性依据。2024 年 Q1 的搜索趋势距今已超过
      18 个月，可能已发生重大变化（如远程办公趋势可能已回落）。使用过期
      数据会导致错误的优先级判断。应使用近期（通常 3 个月内）的数据，
      或标注数据的时间范围并说明可能的变化。
    violated_rule: do_not_use_expired_observations_as_facts
    correct_approach:
      opportunity:
        topic_id: "ent_topic_remote_work"
        topic_name: "远程办公工具选型指南"
        opportunity_score: 0.65  # 基于近期数据调整
        priority: "medium"
        evidence: >
          2026 年 Q2 搜索趋势显示远程办公相关搜索量稳定（月均 12 万次），
          较 2024 年峰值下降 45%，但混合办公模式相关搜索上升 30%
          (source: Google Trends, observed_at: 2026-07)
    severity: critical
    tags: [topic_planning, expired_observation]

  - id: neg_tp_003
    task_id: task_topic_planning
    name: 仅凭短期趋势推荐主题
    scenario: >
      操作者看到"AI 生成视频"搜索量在近一周突然飙升，在没有分析
      品牌能力是否匹配的情况下，直接将其推荐为最高优先级主题。
    wrong_approach:
      opportunity:
        topic_id: "ent_topic_ai_video"
        topic_name: "AI 视频生成工具对比"
        opportunity_type: "trending"
        opportunity_score: 0.95
        priority: "critical"
        evidence: "近一周搜索量飙升 500%"
        # 仅凭短期趋势，未考虑品牌能力和用户需求的相关性
        # 品牌可能在 AI 视频领域没有任何产品能力
    why_wrong: >
      不应仅凭短期趋势推荐主题，需结合品牌能力和用户需求。短期搜索飙升
      可能是热点事件驱动，不具备持续性。如果品牌没有 AI 视频相关能力，
      强行创建该主题内容会导致内容与品牌定位脱节，无法建立品牌权威。
    violated_rule: avoid_trend_only
    correct_approach:
      opportunity:
        topic_id: "ent_topic_ai_video"
        topic_name: "AI 视频生成工具对比"
        opportunity_type: "trending"
        opportunity_score: 0.55  # 相关性低，降分
        priority: "low"
        evidence: >
          近一周搜索量飙升 500%，但品牌无 AI 视频相关产品能力。
          关注该趋势但不作为优先内容方向。
        # 如果品牌确实有相关能力，需补充品牌能力映射
    severity: medium
    tags: [topic_planning, trend_only]

  - id: neg_tp_004
    task_id: task_topic_planning
    name: 品牌主张作为机会点但无独立证据
    scenario: >
      操作者基于品牌官网的 self_claim"行业领先的数据安全方案"，
      推荐了"数据安全最佳实践"主题，但未提供任何第三方验证证据。
    wrong_approach:
      opportunity:
        topic_id: "ent_topic_data_security"
        topic_name: "企业数据安全最佳实践"
        opportunity_score: 0.85
        priority: "high"
        evidence: "品牌官网声称其为行业领先的数据安全方案提供商"
        # 仅凭品牌 self_claim，无独立证据
    why_wrong: >
      基于品牌主张的机会点必须有独立证据支撑。品牌自述"行业领先"
      属于 self_claim，不能作为推荐主题的唯一依据。需要第三方评测、
      安全认证、独立分析师报告等独立证据来验证品牌在该领域的权威性。
    violated_rule: brand_claims_require_evidence
    correct_approach:
      opportunity:
        topic_id: "ent_topic_data_security"
        topic_name: "企业数据安全最佳实践"
        opportunity_score: 0.80
        priority: "high"
        evidence: >
          品牌获得 ISO 27001 和 SOC 2 Type II 认证
          (source: 官方认证页面, verified: 2026-06);
          Gartner 报告将其列为数据安全领域领导者
          (source: 2025 Gartner Magic Quadrant);
          竞品在数据安全内容方面覆盖薄弱（仅 2 篇通用文章）
    severity: high
    tags: [topic_planning, unsupported_claim]

  - id: neg_tp_005
    task_id: task_topic_planning
    name: 主题层级关系不一致
    scenario: >
      操作者创建了主题"CRM 选型"并设置了 parent_topic_id 为
      "ent_topic_ai"，但"CRM 选型"与"AI"在语义上并无父子关系，
      破坏了主题层级结构的逻辑一致性。
    wrong_approach:
      topic:
        id: "ent_topic_crm_selection"
        type: "topic"
        canonical_name: "CRM 选型"
        parent_topic_id: "ent_topic_ai"  # 错误的父主题
        # "CRM 选型" 的父主题应为 "CRM" 而非 "AI"
    why_wrong: >
      主题关系应符合层级结构逻辑。"CRM 选型"与"AI"没有直接层级关系，
      正确的父主题应为"CRM"或"企业软件选型"。错误的层级关系会导致
      主题集群分析混乱、内容缺口检测不准确。
    violated_rule: topic_hierarchy_consistency
    correct_approach:
      topic:
        id: "ent_topic_crm_selection"
        type: "topic"
        canonical_name: "CRM 选型"
        parent_topic_id: "ent_topic_crm"  # 正确的父主题
      # 如果 "ent_topic_crm" 不存在，应先创建
      topic:
        id: "ent_topic_crm"
        type: "topic"
        canonical_name: "CRM"
        parent_topic_id: "ent_topic_enterprise_software"
    severity: medium
    tags: [topic_planning, hierarchy_inconsistency]

# ============================================================
# 任务 4: 搜索诊断 (Search Diagnosis)
# ============================================================

task_search_diagnosis_examples:

  - id: neg_sd_001
    task_id: task_search_diagnosis
    name: 观测结论未标注时间范围
    scenario: >
      操作者基于一次搜索观测得出结论"品牌在 AI 搜索中可见度很高"，
      但未标注观测时间，将这个结论当作永久性结论写入诊断报告。
    wrong_approach:
      visibility_summary:
        overall_score: 0.85
        brand_mention_rate: 0.72
        trend_direction: "improving"
        # 整个诊断报告没有 observed_at 时间戳
        # 没有标注观测时间范围
      conclusion: "品牌在 AI 搜索中可见度很高，处于行业领先地位"
    why_wrong: >
      搜索观测结果是快照，不是永久事实。诊断结论必须标注观测时间。
      搜索可见度会随时间、算法更新、竞品动作而变化。不标注时间范围
      的结论会在情况变化后产生误导，导致错误的策略决策。
    violated_rule: observation_is_not_fact
    correct_approach:
      visibility_summary:
        overall_score: 0.85
        brand_mention_rate: 0.72
        trend_direction: "improving"
        observation_period:
          start: "2026-07-07"
          end: "2026-08-07"
        observation_count: 12
      conclusion: >
        2026 年 7 月 7 日至 8 月 7 日期间，基于 12 次观测，
        品牌在 AI 搜索中可见度评分 0.85，处于行业较高水平。
        该结论仅在观测期内有效，需持续监测以验证趋势稳定性。
    severity: critical
    tags: [search_diagnosis, missing_timestamp]

  - id: neg_sd_002
    task_id: task_search_diagnosis
    name: 混淆品牌提及和来源引用
    scenario: >
      操作者在诊断报告中统计了品牌可见度，但将所有"品牌被提到"
      的情况都计为"被引用"，未区分 mention 和 citation。
    wrong_approach:
      visibility_summary:
        brand_mention_rate: 0.65
        citation_rate: 0.65  # 与 mention_rate 完全相同，显然是混为一谈
      platform_breakdown:
        - platform: "Google AI Overview"
          mention_count: 45
          citation_count: 45  # 错误：将 mention 统计为 citation
          # 实际上仅有 12 次是真正的引用（含链接），33 次只是提及
    why_wrong: >
      必须区分品牌提及（mention）和来源引用（citation）。Mention 是
      品牌名称被提及，Citation 是品牌的内容被引用为信息来源。两者的
      价值和含义完全不同——Citation 代表品牌被作为权威来源认可，
      而 Mention 仅是品牌被提及。混淆两者会严重高估品牌的实际影响力。
    violated_rule: distinguish_mention_from_citation
    correct_approach:
      visibility_summary:
        brand_mention_rate: 0.65
        citation_rate: 0.17  # 正确区分后 citation 远低于 mention
      platform_breakdown:
        - platform: "Google AI Overview"
          mention_count: 45
          citation_count: 12  # 仅 12 次是真正的引用
          note: "33 次为无链接的品牌提及，12 次为含来源链接的引用"
    severity: high
    tags: [search_diagnosis, mention_vs_citation]

  - id: neg_sd_003
    task_id: task_search_diagnosis
    name: 缺少竞品对比基准
    scenario: >
      操作者诊断品牌搜索可见度评分为 0.65，直接得出结论"品牌可见度
      表现良好"，但没有和竞品做对比，不知道 0.65 是否真的算好。
    wrong_approach:
      visibility_summary:
        overall_score: 0.65
        brand_mention_rate: 0.45
        conclusion: "品牌可见度表现良好，达到预期水平"
        # 没有 competitor_comparison 部分
        # 没有竞品数据进行对比
    why_wrong: >
      品牌可见度评估必须有竞品对比基准。0.65 的评分在孤立情况下没有意义：
      如果竞品评分都在 0.80 以上，0.65 实际上是落后水平；
      如果竞品评分都在 0.40 左右，则 0.65 确实是领先水平。
      没有竞品对比的诊断报告缺乏决策参考价值。
    violated_rule: competitor_benchmark_required
    correct_approach:
      visibility_summary:
        overall_score: 0.65
        brand_mention_rate: 0.45
        conclusion: >
          品牌可见度评分 0.65，低于行业领先竞品 A（0.82）和竞品 B（0.78），
          高于竞品 C（0.51）。品牌在品牌提及率方面有较大提升空间。
      competitor_comparison:
        - competitor_id: "ent_competitor_a"
          share_of_voice: 0.35
          strength_areas: ["AI 搜索", "行业术语"]
        - competitor_id: "ent_competitor_b"
          share_of_voice: 0.30
          strength_areas: ["产品对比", "评测"]
    severity: high
    tags: [search_diagnosis, missing_competitor_benchmark]

  - id: neg_sd_004
    task_id: task_search_diagnosis
    name: 单次观测即得出一致性结论
    scenario: >
      操作者仅做了一次搜索观测，就得出结论"品牌在 AI 搜索中
      持续领先"，违反了多平台多时间点交叉验证的要求。
    wrong_approach:
      visibility_summary:
        overall_score: 0.90
        trend_direction: "improving"
        observation_count: 1  # 仅 1 次观测
        observation_period: "2026-08-07"  # 单日
      conclusion: "品牌在 AI 搜索中持续领先，趋势向好"
    why_wrong: >
      需要在多个平台/时间点观测后才能得出一致性结论。单次观测可能是
      偶发结果（算法波动、时间因素、特定查询词等），不具备统计意义。
      质量检查要求至少 3 次不同时间的观测且时间跨度 >= 7 天。
    violated_rule: cross_platform_consistency
    correct_approach:
      visibility_summary:
        overall_score: 0.75  # 多次观测后可能得到不同的综合评分
        trend_direction: "stable"
        observation_count: 12
        observation_period:
          start: "2026-07-07"
          end: "2026-08-07"
      conclusion: >
        基于 2026 年 7 月 7 日至 8 月 7 日期间 12 次跨平台观测，
        品牌可见度评分 0.75，趋势稳定。单次观测曾出现 0.90 的高分，
        但综合评估后更接近 0.75。
    severity: high
    tags: [search_diagnosis, single_observation_conclusion]

  - id: neg_sd_005
    task_id: task_search_diagnosis
    name: 不同平台搜索结果混为一谈
    scenario: >
      操作者将 Google AI Overview、Bing Chat、百度 AI 三个平台的
      搜索结果合并统计，未区分各平台的行为差异，得出笼统的结论。
    wrong_approach:
      platform_breakdown:
        - platform: "AI 搜索引擎"
          mention_count: 100  # 将三个平台的数据合并
          citation_count: 30
          sentiment: "positive"
          note: "综合 Google AI、Bing Chat、百度 AI 数据"
        # 未区分各平台的独立表现
    why_wrong: >
      不同 AI 搜索引擎行为不同，不可混为一谈。Google AI Overview 的
      引用机制、百度 AI 的答案生成方式、Bing Chat 的信息来源偏好
      各不相同。合并统计会掩盖平台差异，导致优化建议无法针对
      特定平台进行微调。
    violated_rule: platform_specific_behavior
    correct_approach:
      platform_breakdown:
        - platform: "Google AI Overview"
          mention_count: 45
          citation_count: 15
          sentiment: "positive"
          top_prompts: ["CRM 选型", "销售管理工具"]
        - platform: "Bing Chat"
          mention_count: 30
          citation_count: 10
          sentiment: "neutral"
          top_prompts: ["企业软件对比", "CRM 评测"]
        - platform: "百度 AI"
          mention_count: 25
          citation_count: 5
          sentiment: "positive"
          top_prompts: ["CRM 是什么", "CRM 系统推荐"]
    severity: medium
    tags: [search_diagnosis, platform_conflation]

# ============================================================
# 任务 5: 内容 Brief 生成 (Content Brief Generation)
# ============================================================

task_content_brief_examples:

  - id: neg_cb_001
    task_id: task_content_brief
    name: 内容结构未覆盖目标提问词
    scenario: >
      操作者生成了一份关于"CRM 选型"的内容 Brief，但 Brief 中的
      content_structure 仅覆盖了 5 个目标提问词中的 2 个，其余 3 个
      提问词的核心语义在内容大纲中完全没有体现。
    wrong_approach:
      brief:
        brief_id: "brief_crm_selection_001"
        content_type: "buyer_guide"
        target_prompts:
          - "中小企业 CRM 怎么选"
          - "CRM 系统价格对比"
          - "CRM 和 Excel 的区别"
          - "免费 CRM 有哪些"
          - "CRM 实施注意事项"
        content_structure:
          - section: "选型标准"
            covers: ["中小企业 CRM 怎么选"]
          - section: "价格对比"
            covers: ["CRM 系统价格对比"]
          # 缺少 "CRM 和 Excel 的区别"、"免费 CRM 有哪些"、"CRM 实施注意事项"
    why_wrong: >
      内容必须覆盖所有目标提问词的核心语义。如果 Brief 中有 3 个提问词
      未被覆盖，那么生成的内容将无法满足这些搜索意图，导致内容缺口
      未能填补，搜索可见度无法提升。这是内容 Brief 最基本的完整性要求。
    violated_rule: must_cover_target_prompts
    correct_approach:
      brief:
        brief_id: "brief_crm_selection_002"
        content_type: "buyer_guide"
        target_prompts:
          - "中小企业 CRM 怎么选"
          - "CRM 系统价格对比"
          - "CRM 和 Excel 的区别"
          - "免费 CRM 有哪些"
          - "CRM 实施注意事项"
        content_structure:
          - section: "CRM 选型标准"
            covers: ["中小企业 CRM 怎么选"]
          - section: "CRM vs Excel：何时需要升级"
            covers: ["CRM 和 Excel 的区别"]
          - section: "CRM 价格对比"
            covers: ["CRM 系统价格对比"]
          - section: "免费 CRM 方案评估"
            covers: ["免费 CRM 有哪些"]
          - section: "CRM 实施注意事项"
            covers: ["CRM 实施注意事项"]
    severity: critical
    tags: [content_brief, incomplete_prompt_coverage]

  - id: neg_cb_002
    task_id: task_content_brief
    name: 证据要求与意图定义不匹配
    scenario: >
      操作者为 intent_comparison（对比选择）意图生成 Brief，
      但 evidence_requirements 中仅要求引用品牌官网，未包含独立评测
      和第三方验证来源，而 intent_types.yaml 明确要求 comparison 意图
      需要 independent_reviews 和 customer_case。
    wrong_approach:
      brief:
        brief_id: "brief_crm_comparison_001"
        intent: "intent_comparison"
        evidence_requirements:
          - "引用品牌官网产品页"
          - "引用品牌官网定价页"
          # 缺少 independent_reviews 和 customer_case
        source_suggestions:
          - "src_salesforce_official"
          - "src_hubspot_official"
          # 全部是品牌来源，无第三方来源
    why_wrong: >
      证据要求必须匹配意图定义中的 preferred_evidence。intent_comparison
      的 preferred_evidence 明确要求 official_product_docs + independent_reviews
      + customer_case。仅引用品牌官网会导致内容缺乏客观性，无法满足用户
      对对比内容中立性的期望，损害内容可信度。
    violated_rule: evidence_requirements_by_intent
    correct_approach:
      brief:
        brief_id: "brief_crm_comparison_002"
        intent: "intent_comparison"
        evidence_requirements:
          - "引用品牌官网产品功能页"
          - "引用第三方独立评测报告（如 G2、Gartner）"
          - "引用至少 2 个真实客户案例"
          - "标注评测时间和条件"
        source_suggestions:
          - "src_salesforce_official"
          - "src_hubspot_official"
          - "src_g2_crm_reviews_2026"
          - "src_gartner_crm_mq_2025"
          - "src_customer_case_midmarket"
    severity: high
    tags: [content_brief, evidence_intent_mismatch]

  - id: neg_cb_003
    task_id: task_content_brief
    name: 使用无依据的绝对化表述
    scenario: >
      操作者在 Brief 的 key_points 中使用了"最佳""最先进""顶级"
      等绝对化表述，但没有任何数据或第三方验证支持这些说法。
    wrong_approach:
      brief:
        brief_id: "brief_crm_guide_001"
        key_points:
          - "Salesforce 是最佳的 CRM 解决方案"
          - "拥有行业最先进的功能"
          - "提供顶级的客户服务体验"
          - "市场占有率遥遥领先"
          # 全部是绝对化表述，无数据支撑
    why_wrong: >
      不使用无依据的绝对化表述。"最佳""最先进""顶级"等表述如果没有
      具体数据或第三方验证支持，属于无依据的吹嘘，违反内容可信度原则。
      即使品牌确实在某个维度领先，也必须用具体数据说明领先程度和范围。
    violated_rule: avoid_unsupported_superlatives
    correct_approach:
      brief:
        brief_id: "brief_crm_guide_002"
        key_points:
          - "Salesforce 在 Gartner 2025 CRM 魔力象限中连续第 8 年位于领导者象限"
          - "AI 功能方面，Einstein GPT 于 2025 年 Q2 上线，支持自然语言交互"
          - "客户服务方面，Trustpilot 评分 4.2/5（基于 5,000+ 条评价，2026 年 7 月）"
          - "全球 CRM 市场份额约 21.7%（IDC 2025 年数据）"
        source_suggestions:
          - "src_gartner_mq_2025"
          - "src_salesforce_einstein_release"
          - "src_trustpilot_2026"
          - "src_idc_crm_market_2025"
    severity: high
    tags: [content_brief, unsupported_superlatives]

  - id: neg_cb_004
    task_id: task_content_brief
    name: 内容结构未覆盖意图的期望回答块
    scenario: >
      操作者生成了 intent_how_to（操作方法）意图的 Brief，
      但 content_structure 仅包含步骤说明，缺少 intent_types.yaml 中
      how_to 意图定义的 expected_answer_blocks 中的 prerequisites、
      expected_outcome 和 common_mistakes。
    wrong_approach:
      brief:
        brief_id: "brief_crm_setup_001"
        intent: "intent_how_to"
        content_structure:
          - section: "注册账号"
          - section: "添加团队成员"
          - section: "导入客户数据"
          - section: "创建第一个销售漏斗"
          # 只有 step_by_step_instructions
          # 缺少 prerequisites、expected_outcome、common_mistakes
    why_wrong: >
      内容结构应覆盖意图定义中的 expected_answer_blocks。intent_how_to
      要求四个回答块：step_by_step_instructions、prerequisites、
      expected_outcome、common_mistakes。缺少前置条件可能导致用户
      在未满足条件时开始操作，缺少预期结果会让用户无法验证操作是否成功，
      缺少常见错误会让用户遇到问题时无法自行排查。
    violated_rule: structure_matches_answer_blocks
    correct_approach:
      brief:
        brief_id: "brief_crm_setup_002"
        intent: "intent_how_to"
        content_structure:
          - section: "开始前的准备"
            covers: "prerequisites"
            content: "管理权限、团队成员邮箱、客户数据文件格式要求"
          - section: "注册和配置账号"
            covers: "step_by_step_instructions"
          - section: "添加团队成员和设置权限"
            covers: "step_by_step_instructions"
          - section: "导入客户数据"
            covers: "step_by_step_instructions"
          - section: "创建第一个销售漏斗"
            covers: "step_by_step_instructions"
          - section: "完成后的验证"
            covers: "expected_outcome"
            content: "如何确认设置成功、应看到的数据和界面"
          - section: "常见问题和解决方法"
            covers: "common_mistakes"
            content: "数据导入失败、权限设置错误、团队成员无法登录"
    severity: high
    tags: [content_brief, missing_answer_blocks]

  - id: neg_cb_005
    task_id: task_content_brief
    name: 未标注统计数据的时效性
    scenario: >
      操作者在 Brief 中引用了市场规模数据但未标注数据年份，
      使用了"CRM 市场规模达 880 亿美元"的表述，缺少时间、单位和范围。
    wrong_approach:
      brief:
        brief_id: "brief_crm_market_001"
        key_points:
          - "CRM 市场规模达 880 亿美元"
          - "年增长率 14%"
          - "超过 90% 的企业使用 CRM"
          # 所有数据都缺少时间、单位和范围
