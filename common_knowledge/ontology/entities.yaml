# GEO 第一层通用知识层 — 实体定义
# 版本: 1.2.0
# 范围: 跨品牌、跨行业复用的方法与规范层
# 参考: W3C SKOS, Schema.org, Wikidata

meta:
  version: 1.2.0
  created_at: 2026-08-07
  updated_at: 2026-08-11
  status: active
  scope: shared
  description: >
    定义 GEO/Brand Atlas 系统中使用的全部实体类型。v1.2.0 新增 organization 和
    product_version 两种实体类型，总数增至 21 个。
    其中 fact、claim、observation、inference 由 statement_class 统一归类。
  source_refs:
    - https://schema.org/
    - https://www.w3.org/TR/skos-reference/
    - https://www.wikidata.org/

# ============================================================
# 实体类型定义
# ============================================================

entity_types:

  # --- 1. 品牌 ---
  - type: brand
    canonical_name: 品牌
    canonical_name_en: Brand
    definition: >
      对外提供产品或服务的组织或品牌。品牌是第一层知识图谱中的核心实体之一，
      通过多种关系与产品、行业、竞品、主题等实体连接。
    examples:
      - Salesforce
      - 华为
      - 小米
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - created_at
      - updated_at
      - valid_from
      - valid_to
      - industry
      - headquarters
      - website
    constraints:
      - canonical_name 必须唯一
      - aliases 在同一 type 内不得重复
      - scope 取值为 shared / industry_specific / brand_specific
      - status 取值为 active / inactive / deprecated
    version: 1.0.0

  # --- 2. 产品 ---
  - type: product
    canonical_name: 产品
    canonical_name_en: Product
    definition: >
      可独立描述的产品或服务。产品归属于品牌，可以属于品类、解决用户问题、
      支持使用场景、面向用户角色。
    examples:
      - Salesforce Sales Cloud
      - 华为 Mate 60 Pro
      - 企业微信
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - created_at
      - updated_at
      - valid_from
      - valid_to
      - brand_id
      - category_id
      - pricing_model
      - deployment_type
    constraints:
      - 必须通过 belongs_to 关系关联到至少一个 category
      - 通常通过关系关联到一个 brand
    version: 1.0.0

  # --- 3. 行业 ---
  - type: industry
    canonical_name: 行业
    canonical_name_en: Industry
    definition: >
      宏观行业分类，用于将品牌和产品归类到更大的经济领域。
      行业是品牌 operates_in 关系的目标实体。
    examples:
      - 企业软件
      - 消费电子
      - 金融服务
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - parent_industry_id
      - industry_code
    constraints:
      - 支持层级结构（通过 parent_industry_id）
      - canonical_name 必须唯一
    version: 1.0.0

  # --- 4. 品类 ---
  - type: category
    canonical_name: 品类
    canonical_name_en: Category
    definition: >
      市场中的解决方案类别，比行业更细粒度。
      产品通过 belongs_to 关系归属到品类。
    examples:
      - CRM
      - 智能手机
      - 协同办公
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - parent_category_id
      - industry_id
    constraints:
      - 支持层级结构（通过 parent_category_id）
      - 通常关联到某个 industry
    version: 1.0.0

  # --- 5. 用户角色 ---
  - type: audience
    canonical_name: 用户角色
    canonical_name_en: Audience
    definition: >
      具有相似任务和决策权的用户群体。产品和服务面向特定用户角色，
      内容和提问词也以特定用户角色为目标。
    examples:
      - 销售负责人
      - CTO/技术决策者
      - 中小企业主
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - persona_attributes
      - decision_authority
    constraints:
      - canonical_name 在同一 type 内必须唯一
      - persona_attributes 为可选的结构化画像字段
    version: 1.0.0

  # --- 6. 使用场景 ---
  - type: use_case
    canonical_name: 使用场景
    canonical_name_en: Use Case
    definition: >
      用户使用产品完成特定任务的情境。使用场景描述的是"谁在什么情况下做什么"，
      是连接用户角色和产品功能的桥梁。
    examples:
      - 管理销售线索
      - 远程视频会议
      - 财务报表生成
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - related_audience_ids
      - related_product_ids
      - workflow_steps
    constraints:
      - 应描述具体情境，而非泛化功能列表
      - 通常关联到至少一个 audience
    version: 1.0.0

  # --- 7. 用户问题 ---
  - type: problem
    canonical_name: 用户问题
    canonical_name_en: Problem
    definition: >
      用户希望解决的痛点或完成的任务。问题是内容策略和产品定位的出发点，
      产品通过 solves 关系关联到问题。
    examples:
      - 销售线索分散
      - 团队沟通效率低
      - 数据报表制作耗时
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - severity
      - frequency
      - related_audience_ids
    constraints:
      - 问题描述应来自用户视角，非产品功能视角
      - severity 取值为 critical / high / medium / low
    version: 1.0.0

  # --- 8. 主题 ---
  - type: topic
    canonical_name: 主题
    canonical_name_en: Topic
    definition: >
      可持续组织内容的一组语义范围。主题是内容策略的核心组织单元，
      用于话题聚类、内容缺口分析和主题规划。
    examples:
      - CRM 选型
      - 远程办公最佳实践
      - AI 在营销中的应用
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - parent_topic_id
      - related_entities
      - search_volume
      - competition_level
    constraints:
      - 支持层级结构（通过 parent_topic_id）
      - 主题应具有持续的内容组织价值，而非一次性热点
    version: 1.0.0

  # --- 9. 提问词 ---
  - type: prompt
    canonical_name: 提问词
    canonical_name_en: Prompt / Query
    definition: >
      面向搜索或生成式引擎的具体问题。提问词是意图分析的输入，
      通过 expresses_intent 关系关联到意图，通过 targets 关系关联到用户角色。
    examples:
      - 适合中小企业的 CRM 有哪些
      - 华为 Mate 60 Pro 和 iPhone 15 Pro 怎么选
      - 如何搭建远程办公团队
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - intent_id
      - language
      - search_volume
      - generation_source
    constraints:
      - canonical_name 即提问词原文
      - language 取值为 zh / en / multilingual
      - generation_source 标记是人工标注还是自动生成
    version: 1.0.0

  # --- 10. 竞品 ---
  - type: competitor
    canonical_name: 竞品
    canonical_name_en: Competitor
    definition: >
      在同一需求或预算中与目标品牌形成竞争关系的品牌或产品。
      竞品通过 competes_with 关系与目标品牌/产品关联。
    examples:
      - HubSpot（相对于 Salesforce）
      - 小米（相对于华为）
      - Notion（相对于飞书）
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - competition_type
      - market_position
      - target_brand_id
    constraints:
      - 竞品是相对于特定目标品牌的概念
      - competition_type 取值为 direct / indirect / substitute
    version: 1.0.0

  # --- 11. 内容 ---
  - type: content
    canonical_name: 内容
    canonical_name_en: Content
    definition: >
      可被阅读、引用或优化的内容资产。内容包括网页、文章、白皮书、
      视频、社交媒体帖子等形式。
    examples:
      - 产品介绍页
      - 行业白皮书
      - 客户案例
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - content_type
      - url
      - published_at
      - author
      - brand_id
      - language
    constraints:
      - 如果没有 url 则必须有 source_refs
      - content_type 取值为 article / product_page / whitepaper / case_study / video / social_post / report / other
    version: 1.0.0

  # --- 12. 来源 ---
  - type: source
    canonical_name: 来源
    canonical_name_en: Source
    definition: >
      内容或事实的出处。来源是证据链的起点，所有事实和主张都必须有来源支撑。
      来源本身有权威等级和适用性规则。
    examples:
      - 品牌官网
      - 学术论文
      - 第三方评测报告
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - source_type
      - url
      - authority_level
      - access_date
      - publisher
    constraints:
      - source_type 必须引用 source_types.yaml 中定义的类型
      - authority_level 取值为 high / medium / low
      - access_date 记录最后访问时间
    version: 1.0.0

  # --- 13. 事实 ---
  - type: fact
    canonical_name: 事实
    canonical_name_en: Fact
    definition: >
      有证据支持的客观陈述。事实必须关联到至少一个来源，
      包含原始数值、单位、时间和适用范围。没有来源的内容不得标记为 fact。
    examples:
      - 产品支持私有化部署
      - 2025 年市场规模达到 500 亿元
      - 该功能于 2024 年 Q3 上线
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
      - source_refs
    optional_fields:
      - aliases
      - description
      - scope
      - subject_entity_id
      - predicate
      - object_value
      - unit
      - valid_from
      - valid_to
      - confidence
      - verification_status
    constraints:
      - 必须有至少一个 source_refs
      - 统计数字必须保存原始数字、单位、时间和适用范围
      - 如果没有 source_refs，类型必须改为 claim 或 observation
      - verification_status 取值为 verified / unverified / disputed
    version: 1.0.0

  # --- 14. 主张 ---
  - type: claim
    canonical_name: 主张
    canonical_name_en: Claim
    definition: >
      来源主体对自身或他人的陈述，具有主观性。品牌自述应标记为 claim，
      不能直接转成客观结论。主张需要标注陈述主体和立场。
    examples:
      - 行业领先（品牌自述）
      - 市场占有率第一（无第三方验证）
      - 最佳实践（主观评价）
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
      - source_refs
    optional_fields:
      - aliases
      - description
      - scope
      - claimant_id
      - subject_entity_id
      - claim_statement
      - stance
      - evidence_level
      - valid_from
      - valid_to
    constraints:
      - 必须有 source_refs 标注出处
      - claimant_id 标注谁在主张
      - stance 取值为 self_claim / third_party_claim / user_review
      - evidence_level 取值为 strong / moderate / weak / unverifiable
      - 品牌自述必须标记为 self_claim
    version: 1.0.0

  # --- 15. 观测 ---
  - type: observation
    canonical_name: 观测
    canonical_name_en: Observation
    definition: >
      特定时间和条件下得到的搜索结果或系统观测。单次联网搜索结果默认是观测，
      不得直接写入稳定规则或品牌事实。观测经过验证后可晋升为事实或主张。
    examples:
      - 某次 AI 回答中提及品牌
      - 某日搜索结果的排名变化
      - 某平台上的品牌提及次数
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
      - observed_at
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - observation_type
      - platform
      - query_context
      - raw_data
      - confidence
      - promoted_to
    constraints:
      - 必须有 observed_at 时间戳
      - observation_type 取值为 search_result / ai_answer / mention / ranking / trend / other
      - 不得直接用作事实推论的基础，需经验证后晋升
      - promoted_to 标记晋升后的 fact 或 claim 的 id
    version: 1.1.0

  # --- 16. 能力 ---
  - type: capability
    canonical_name: 能力
    canonical_name_en: Capability
    definition: >
      产品具备的独立功能或技术能力。能力描述的是"产品能做什么"，
      与使用场景（use_case，描述"用户在什么情境下使用"）语义不同。
      能力是行业共享字典的核心，使 L3 能将品牌产品映射到同一能力坐标系。
    examples:
      - 销售预测
      - 自然语言处理
      - 多渠道数据接入
      - 自动化工作流
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - parent_capability_id
      - related_problem_ids
      - supported_use_case_ids
      - evaluation_dimensions
    constraints:
      - 能力只描述能力本身，不描述具体品牌是否具备
      - 支持层级结构（通过 parent_capability_id）
      - evaluation_dimensions 为评价该能力的维度列表
      - 具体品牌是否具备该能力属于 L3 范畴
    version: 1.1.0

  # --- 17. 决策因素 ---
  - type: decision_factor
    canonical_name: 决策因素
    canonical_name_en: Decision Factor
    definition: >
      用户在购买或选择产品时关注的核心考量维度。决策因素是提问词挖掘、
      选型比较和内容优化的核心坐标，连接用户角色、品类和主题。
    examples:
      - 实施周期
      - 数据安全
      - 总体拥有成本
      - 易用性
      - 系统集成能力
      - 合规性
      - 可扩展性
      - 本地化支持
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - applicable_category_ids
      - related_audience_ids
      - evaluation_method
      - importance
    constraints:
      - 决策因素应具有跨品牌通用性
      - applicable_category_ids 标注适用的品类范围
      - importance 取值为 critical / high / medium / low / unknown
      - evaluation_method 为衡量该因素的方法列表
    version: 1.1.0

  # --- 18. 用户任务 ---
  - type: job_to_be_done
    canonical_name: 用户任务
    canonical_name_en: Job to Be Done
    definition: >
      用户希望完成的独立任务或目标，独立于具体产品或使用场景。
      JTBD 关注的是"用户想要达成什么"，而非"用户如何使用产品达成"。
      与 use_case 的区别在于 JTBD 是产品无关的，而 use_case 是产品相关的。
    examples:
      - 统一管理销售线索
      - 提升客户复购率
      - 减少人工数据录入
      - 实时掌握团队业绩
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - related_audience_ids
      - related_problem_ids
      - functional_dimensions
      - emotional_dimensions
      - desired_outcome_ids
    constraints:
      - JTBD 描述应产品无关，聚焦用户目标
      - functional_dimensions 为功能性需求维度
      - emotional_dimensions 为情感性需求维度
      - 与 use_case 通过关系连接而非直接替代
    version: 1.1.0

  # --- 19. 期望结果 ---
  - type: outcome
    canonical_name: 期望结果
    canonical_name_en: Desired Outcome
    definition: >
      用户期望通过完成某项任务或使用某个场景后取得的业务结果。
      Outcome 是可衡量的、与业务价值直接关联的最终状态。
    examples:
      - 缩短线索响应时间至 5 分钟以内
      - 提升线索转化率 20%
      - 降低客户流失率
      - 实现销售流程自动化覆盖 90%
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - related_jtbd_ids
      - related_use_case_ids
      - measurement_method
      - baseline_value
      - target_value
      - unit
    constraints:
      - outcome 应具有可衡量性
      - measurement_method 描述如何衡量该结果
      - baseline_value 和 target_value 提供量化参考
      - 与 use_case 通过 produces_outcome 关系连接
    version: 1.1.0

  # --- 20. 组织 ---
  - type: organization
    canonical_name: 组织
    canonical_name_en: Organization
    definition: >
      法律或运营主体，负责拥有和运营品牌。一个组织可运营多个品牌，
      与 brand 必须分开。解决当前 brand 同时承担法律主体和品牌身份的问题。
    examples:
      - 上海智算云图科技有限公司
      - 阿里巴巴集团
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - legal_name
      - registration_number
      - headquarters
      - official_domains
    constraints:
      - 通过 owns_brand 关系关联到品牌
      - brand 不是法律实体，organization 才是
      - 一个组织可拥有多个品牌，一个品牌通常由一个组织运营
    version: 1.2.0

  # --- 21. 产品版本 ---
  - type: product_version
    canonical_name: 产品版本
    canonical_name_en: Product Version
    definition: >
      产品能力、定价、命名和限制随版本变化的版本边界。
      版本级断言必须指向 product_version，不能只依赖文档文件名。
    examples:
      - DeepCleer_QA_V2.1
      - CRM 2026 Enterprise 版
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
      - product_ref
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - release_date
      - semantic_version
      - document_version
      - changelog_summary
    constraints:
      - 通过 version_of 关系关联到产品
      - 产品版本状态取值为 planned / beta / active / deprecated
      - 能力断言必须限定在 product_version 范围内
      - 处理文档版本冲突时不自动选择版本
    version: 1.2.0

# ============================================================
# 陈述类别（statement_class）
# ============================================================

statement_classes:
  - class: fact
    description: 有证据支持的客观陈述，可被独立验证
    entity_type: fact
  - class: claim
    description: 来源主体对自身或他人的陈述，具有主观性
    entity_type: claim
  - class: observation
    description: 特定时间和条件下获取的快照
    entity_type: observation
  - class: inference
    description: 基于事实、主张或观测得出的推理结论
    note: >
      inference 不是独立的图谱实体类型，而是结论的陈述属性。
      推理结论应保存为 fact 或 claim，并标注 statement_class 为 inference

# ============================================================
# 实体字段规范
# ============================================================

field_definitions:
  id:
    type: string
    description: 唯一标识符，格式为 ent_{type}_{short_name}
    pattern: "^ent_[a-z]+_[a-z0-9_]+$"
    example: ent_brand_salesforce

  canonical_name:
    type: string
    description: 规范名称，为此实体的主要显示名称
    example: Salesforce

  aliases:
    type: array[string]
    description: 别名列表，用于搜索和匹配
    example: [Salesforce.com, 赛富时]

  status:
    type: string
    description: 实体状态
    values: [active, inactive, deprecated]

  scope:
    type: string
    description: 实体适用范围
    values: [shared, industry_specific, brand_specific]

  version:
    type: string
    description: 语义化版本号
    pattern: "^\\d+\\.\\d+\\.\\d+$"

  source_refs:
    type: array[string]
    description: 来源引用 ID 列表
    example: [src_salesforce_official]

  confidence:
    type: float
    description: 置信度 0.0-1.0
    range: [0.0, 1.0]

