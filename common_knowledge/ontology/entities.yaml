# GEO 第一层通用知识层 — 实体定义
# 版本: 1.0.0
# 范围: 跨品牌、跨行业复用的方法与规范层
# 参考: W3C SKOS, Schema.org, Wikidata

meta:
  version: 1.0.0
  created_at: 2026-08-07
  updated_at: 2026-08-07
  status: active
  scope: shared
  description: >
    定义 GEO/Brand Atlas 系统中使用的全部实体类型。实体类型控制在 15 个以内，
    覆盖品牌、产品、行业、品类、用户角色、场景、问题、主题、提问词、竞品、
    内容、来源、事实、主张和观测。每种实体类型包含字段定义、约束和示例。
  source_refs:
    - https://schema.org/
    - https://www.w3.org/TR/skos-reference/
    - https://www.wikidata.org/

# ============================================================
# 实体类型定义
# ============================================================

entity_types:

  # --- 1. 品牌 ---
  - type: brand
    canonical_name: 品牌
    canonical_name_en: Brand
    definition: >
      对外提供产品或服务的组织或品牌。品牌是第一层知识图谱中的核心实体之一，
      通过多种关系与产品、行业、竞品、主题等实体连接。
    examples:
      - Salesforce
      - 华为
      - 小米
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - created_at
      - updated_at
      - valid_from
      - valid_to
      - industry
      - headquarters
      - website
    constraints:
      - canonical_name 必须唯一
      - aliases 在同一 type 内不得重复
      - scope 取值为 shared / industry_specific / brand_specific
      - status 取值为 active / inactive / deprecated
    version: 1.0.0

  # --- 2. 产品 ---
  - type: product
    canonical_name: 产品
    canonical_name_en: Product
    definition: >
      可独立描述的产品或服务。产品归属于品牌，可以属于品类、解决用户问题、
      支持使用场景、面向用户角色。
    examples:
      - Salesforce Sales Cloud
      - 华为 Mate 60 Pro
      - 企业微信
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - created_at
      - updated_at
      - valid_from
      - valid_to
      - brand_id
      - category_id
      - pricing_model
      - deployment_type
    constraints:
      - 必须通过 belongs_to 关系关联到至少一个 category
      - 通常通过关系关联到一个 brand
    version: 1.0.0

  # --- 3. 行业 ---
  - type: industry
    canonical_name: 行业
    canonical_name_en: Industry
    definition: >
      宏观行业分类，用于将品牌和产品归类到更大的经济领域。
      行业是品牌 operates_in 关系的目标实体。
    examples:
      - 企业软件
      - 消费电子
      - 金融服务
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - parent_industry_id
      - industry_code
    constraints:
      - 支持层级结构（通过 parent_industry_id）
      - canonical_name 必须唯一
    version: 1.0.0

  # --- 4. 品类 ---
  - type: category
    canonical_name: 品类
    canonical_name_en: Category
    definition: >
      市场中的解决方案类别，比行业更细粒度。
      产品通过 belongs_to 关系归属到品类。
    examples:
      - CRM
      - 智能手机
      - 协同办公
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - parent_category_id
      - industry_id
    constraints:
      - 支持层级结构（通过 parent_category_id）
      - 通常关联到某个 industry
    version: 1.0.0

  # --- 5. 用户角色 ---
  - type: audience
    canonical_name: 用户角色
    canonical_name_en: Audience
    definition: >
      具有相似任务和决策权的用户群体。产品和服务面向特定用户角色，
      内容和提问词也以特定用户角色为目标。
    examples:
      - 销售负责人
      - CTO/技术决策者
      - 中小企业主
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - persona_attributes
      - decision_authority
    constraints:
      - canonical_name 在同一 type 内必须唯一
      - persona_attributes 为可选的结构化画像字段
    version: 1.0.0

  # --- 6. 使用场景 ---
  - type: use_case
    canonical_name: 使用场景
    canonical_name_en: Use Case
    definition: >
      用户使用产品完成特定任务的情境。使用场景描述的是"谁在什么情况下做什么"，
      是连接用户角色和产品功能的桥梁。
    examples:
      - 管理销售线索
      - 远程视频会议
      - 财务报表生成
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - related_audience_ids
      - related_product_ids
      - workflow_steps
    constraints:
      - 应描述具体情境，而非泛化功能列表
      - 通常关联到至少一个 audience
    version: 1.0.0

  # --- 7. 用户问题 ---
  - type: problem
    canonical_name: 用户问题
    canonical_name_en: Problem
    definition: >
      用户希望解决的痛点或完成的任务。问题是内容策略和产品定位的出发点，
      产品通过 solves 关系关联到问题。
    examples:
      - 销售线索分散
      - 团队沟通效率低
      - 数据报表制作耗时
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - severity
      - frequency
      - related_audience_ids
    constraints:
      - 问题描述应来自用户视角，非产品功能视角
      - severity 取值为 critical / high / medium / low
    version: 1.0.0

  # --- 8. 主题 ---
  - type: topic
    canonical_name: 主题
    canonical_name_en: Topic
    definition: >
      可持续组织内容的一组语义范围。主题是内容策略的核心组织单元，
      用于话题聚类、内容缺口分析和主题规划。
    examples:
      - CRM 选型
      - 远程办公最佳实践
      - AI 在营销中的应用
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - parent_topic_id
      - related_entities
      - search_volume
      - competition_level
    constraints:
      - 支持层级结构（通过 parent_topic_id）
      - 主题应具有持续的内容组织价值，而非一次性热点
    version: 1.0.0

  # --- 9. 提问词 ---
  - type: prompt
    canonical_name: 提问词
    canonical_name_en: Prompt / Query
    definition: >
      面向搜索或生成式引擎的具体问题。提问词是意图分析的输入，
      通过 expresses_intent 关系关联到意图，通过 targets 关系关联到用户角色。
    examples:
      - 适合中小企业的 CRM 有哪些
      - 华为 Mate 60 Pro 和 iPhone 15 Pro 怎么选
      - 如何搭建远程办公团队
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - intent_id
      - language
      - search_volume
      - generation_source
    constraints:
      - canonical_name 即提问词原文
      - language 取值为 zh / en / multilingual
      - generation_source 标记是人工标注还是自动生成
    version: 1.0.0

  # --- 10. 竞品 ---
  - type: competitor
    canonical_name: 竞品
    canonical_name_en: Competitor
    definition: >
      在同一需求或预算中与目标品牌形成竞争关系的品牌或产品。
      竞品通过 competes_with 关系与目标品牌/产品关联。
    examples:
      - HubSpot（相对于 Salesforce）
      - 小米（相对于华为）
      - Notion（相对于飞书）
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - competition_type
      - market_position
      - target_brand_id
    constraints:
      - 竞品是相对于特定目标品牌的概念
      - competition_type 取值为 direct / indirect / substitute
    version: 1.0.0

  # --- 11. 内容 ---
  - type: content
    canonical_name: 内容
    canonical_name_en: Content
    definition: >
      可被阅读、引用或优化的内容资产。内容包括网页、文章、白皮书、
      视频、社交媒体帖子等形式。
    examples:
      - 产品介绍页
      - 行业白皮书
      - 客户案例
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - content_type
      - url
      - published_at
      - author
      - brand_id
      - language
    constraints:
      - 如果没有 url 则必须有 source_refs
      - content_type 取值为 article / product_page / whitepaper / case_study / video / social_post / report / other
    version: 1.0.0

  # --- 12. 来源 ---
  - type: source
    canonical_name: 来源
    canonical_name_en: Source
    definition: >
      内容或事实的出处。来源是证据链的起点，所有事实和主张都必须有来源支撑。
      来源本身有权威等级和适用性规则。
    examples:
      - 品牌官网
      - 学术论文
      - 第三方评测报告
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - source_type
      - url
      - authority_level
      - access_date
      - publisher
    constraints:
      - source_type 必须引用 source_types.yaml 中定义的类型
      - authority_level 取值为 high / medium / low
      - access_date 记录最后访问时间
    version: 1.0.0

  # --- 13. 事实 ---
  - type: fact
    canonical_name: 事实
    canonical_name_en: Fact
    definition: >
      有证据支持的客观陈述。事实必须关联到至少一个来源，
      包含原始数值、单位、时间和适用范围。没有来源的内容不得标记为 fact。
    examples:
      - 产品支持私有化部署
      - 2025 年市场规模达到 500 亿元
      - 该功能于 2024 年 Q3 上线
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
      - source_refs
    optional_fields:
      - aliases
      - description
      - scope
      - subject_entity_id
      - predicate
      - object_value
      - unit
      - valid_from
      - valid_to
      - confidence
      - verification_status
    constraints:
      - 必须有至少一个 source_refs
      - 统计数字必须保存原始数字、单位、时间和适用范围
      - 如果没有 source_refs，类型必须改为 claim 或 observation
      - verification_status 取值为 verified / unverified / disputed
    version: 1.0.0

  # --- 14. 主张 ---
  - type: claim
    canonical_name: 主张
    canonical_name_en: Claim
    definition: >
      来源主体对自身或他人的陈述，具有主观性。品牌自述应标记为 claim，
      不能直接转成客观结论。主张需要标注陈述主体和立场。
    examples:
      - 行业领先（品牌自述）
      - 市场占有率第一（无第三方验证）
      - 最佳实践（主观评价）
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
      - source_refs
    optional_fields:
      - aliases
      - description
      - scope
      - claimant_id
      - subject_entity_id
      - claim_statement
      - stance
      - evidence_level
      - valid_from
      - valid_to
    constraints:
      - 必须有 source_refs 标注出处
      - claimant_id 标注谁在主张
      - stance 取值为 self_claim / third_party_claim / user_review
      - evidence_level 取值为 strong / moderate / weak / unverifiable
      - 品牌自述必须标记为 self_claim
    version: 1.0.0

  # --- 15. 观测 ---
  - type: observation
    canonical_name: 观测
    canonical_name_en: Observation
    definition: >
      特定时间和条件下得到的搜索结果或系统观测。单次联网搜索结果默认是观测，
      不得直接写入稳定规则或品牌事实。观测经过验证后可晋升为事实或主张。
    examples:
      - 某次 AI 回答中提及品牌
      - 某日搜索结果的排名变化
      - 某平台上的品牌提及次数
    required_fields:
      - id
      - type
      - canonical_name
      - status
      - version
      - observed_at
    optional_fields:
      - aliases
      - description
      - scope
      - source_refs
      - observation_type
      - platform
      - query_context
      - raw_data
      - confidence
      - promoted_to
    constraints:
      - 必须有 observed_at 时间戳
      - observation_type 取值为 search_result / ai_answer / mention / ranking / trend / other
      - 不得直接用作事实推论的基础，需经验证后晋升
      - promoted_to 标记晋升后的 fact 或 claim 的 id
    version: 1.0.0

# ============================================================
# 实体字段规范
# ============================================================

field_definitions:
  id:
    type: string
    description: 唯一标识符，格式为 ent_{type}_{short_name}
    pattern: "^ent_[a-z]+_[a-z0-9_]+$"
    example: ent_brand_salesforce

  canonical_name:
    type: string
    description: 规范名称，为此实体的主要显示名称
    example: Salesforce

  aliases:
    type: array[string]
    description: 别名列表，用于搜索和匹配
    example: [Salesforce.com, 赛富时]

  status:
    type: string
    description: 实体状态
    values: [active, inactive, deprecated]

  scope:
    type: string
    description: 实体适用范围
    values: [shared, industry_specific, brand_specific]

  version:
    type: string
    description: 语义化版本号
    pattern: "^\\d+\\.\\d+\\.\\d+$"

  source_refs:
    type: array[string]
    description: 来源引用 ID 列表
    example: [src_salesforce_official]

  confidence:
    type: float
    description: 置信度 0.0-1.0
    range: [0.0, 1.0]

