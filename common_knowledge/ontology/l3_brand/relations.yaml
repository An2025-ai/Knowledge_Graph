  relation_id: l3_brand.responds_to
  layer: l3
  owner_layer: l3
  ontology_group: customer_case

# ============================== 客户案例 ==============================
- relation: adopts
  description: 客户采用某个产品、解决方案或服务
  description_en: Customer adopts a product, solution, or service
  subject_types:
  - customer
  object_types:
  - product
  - solution
  - service
  cardinality: many-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: 某商业银行
    relation: adopts
    object: 金融行业联络中心方案
  relation_id: l3_brand.adopts
  layer: l3
  owner_layer: l3
  ontology_group: customer_case

- relation: documents
  description: 案例记录并佐证某个客户的采用情况
  description_en: Case documents a customer
  subject_types:
  - case
  object_types:
  - customer
  cardinality: many-to-one
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: 某制造业客户数字化转型案例
    relation: documents
    object: 某大型制造集团
  relation_id: l3_brand.documents
  layer: l3
  owner_layer: l3
  ontology_group: customer_case

- relation: delivers
  description: 案例产生并印证某项交付成果
  description_en: Case delivers a result
  subject_types:
  - case
  object_types:
  - delivery_result
  cardinality: one-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: 某银行渠道整合案例
    relation: delivers
    object: 人工客服成本下降 35%
  relation_id: l3_brand.delivers
  layer: l3
  owner_layer: l3
  ontology_group: customer_case

- relation: proves
  description: 案例实证品牌主张
  description_en: Case proves a brand claim
  subject_types:
  - case
  object_types:
  - brand_claim
  cardinality: many-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
