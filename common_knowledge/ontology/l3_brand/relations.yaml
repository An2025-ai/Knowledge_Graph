    relation: proves
    object: 让企业数据资产不再沉睡
  relation_id: l3_brand.proves
  layer: l3
  owner_layer: l3
  ontology_group: customer_case

# ============================== 竞争格局 ==============================
- relation: competes_with
  description: 并列品牌或产品之间存在双向竞争关系，不区分参照
  description_en: Peer brands or products compete (symmetric)
  subject_types:
  - brand
  - product
  object_types:
  - brand
  - product
  cardinality: many-to-many
  bidirectional: true
  inverse_relation: competes_with
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: Salesforce Sales Cloud
    relation: competes_with
    object: HubSpot Sales Hub
  relation_id: l3_brand.competes_with
  layer: l3
  owner_layer: l3
  ontology_group: competitive