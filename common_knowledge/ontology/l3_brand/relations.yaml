meta:
  version: 3.0.0
  updated_at: '2026-08-24'
  status: active
  layer: l3
  profile_id: l3_brand
  description: 由 L1 管理的 L3 品牌本体；只约束 L3 品牌知识实例。四维度精简后的关系集，全部只引用保留的 15 个实体类型，每个关系都有明确的 subject/object 类型约束。
  cross_layer_relations: false
relation_types:

# ============================== 品牌身份 ==============================
- relation: owns_brand
  description: 组织拥有并运营某个品牌
  description_en: Organization owns and operates a brand
  subject_types:
  - organization
  object_types:
  - brand
  cardinality: one-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: 华为技术有限公司
    relation: owns_brand
    object: 华为
  relation_id: l3_brand.owns_brand
  layer: l3
  owner_layer: l3
  ontology_group: brand_identity

- relation: has_business_line
  description: 品牌下设立某个业务线
  description_en: Brand has a business line
  subject_types:
  - brand
  object_types:
  - business_line
  cardinality: one-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: 华为
    relation: has_business_line
    object: 消费者业务
  relation_id: l3_brand.has_business_line
  layer: l3
  owner_layer: l3
  ontology_group: brand_identity

- relation: claims
  description: 品牌对外作出某个主张
  description_en: Brand makes a claim
  subject_types:
  - brand
  object_types:
  - brand_claim
  cardinality: one-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: Salesforce
    relation: claims
    object: 全球最值得信赖的企业云平台
  relation_id: l3_brand.claims
  layer: l3
  owner_layer: l3
  ontology_group: brand_identity

# ============================== 产品服务 ==============================
- relation: offers
  description: 品牌提供某个产品、解决方案或服务
  description_en: Brand offers a product, solution, or service
  subject_types:
  - brand
  object_types:
  - product
  - solution
  - service
  cardinality: one-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: Salesforce
    relation: offers
    object: Salesforce Sales Cloud
  relation_id: l3_brand.offers
  layer: l3
  owner_layer: l3
  ontology_group: product_solution

- relation: version_of
  description: 某产品版本属于某个产品
  description_en: Product version belongs to a product
  subject_types:
  - product_version
  object_types:
  - product
  cardinality: many-to-one
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: Salesforce Winter '26
    relation: version_of
    object: Salesforce Sales Cloud
  relation_id: l3_brand.version_of
  layer: l3
  owner_layer: l3
  ontology_group: product_solution

- relation: supersedes
  description: 新版本取代旧版本
  description_en: A version supersedes an older one
  subject_types:
  - product_version
  object_types:
  - product_version
  cardinality: many-to-one
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: Salesforce Winter '26
    relation: supersedes
    object: Salesforce Fall '25
  relation_id: l3_brand.supersedes
  layer: l3
  owner_layer: l3
  ontology_group: product_solution

- relation: composed_of
  description: 解决方案由若干产品或服务组合而成
  description_en: Solution is composed of products or services
  subject_types:
  - solution
  object_types:
  - product
  - service
  cardinality: many-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: 制造业数字化转型方案
    relation: composed_of
    object: 工业互联网平台
  relation_id: l3_brand.composed_of
  layer: l3
  owner_layer: l3
  ontology_group: product_solution

- relation: serves
  description: 品牌、产品或解决方案面向某类用户角色
  description_en: Brand, product, or solution serves an audience
  subject_types:
  - brand
  - product
  - solution
  object_types:
  - audience
  cardinality: many-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: false
  version: 1.0.0
  examples:
  - subject: Salesforce Sales Cloud
    relation: serves
    object: 销售负责人
  relation_id: l3_brand.serves
  layer: l3
  owner_layer: l3
  ontology_group: product_solution

