  owner_layer: l3
  ontology_group: technical_capability

- relation: responds_to
  description: 品牌、产品或能力回应某类用户角色的诉求或场景
  description_en: Brand, product, or capability responds to an audience need
  subject_types:
  - brand
  - product
  - capability
