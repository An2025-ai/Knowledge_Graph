meta:
  version: 3.0.0
  updated_at: '2026-08-24'
  status: active
  layer: l2
  profile_id: l2_industry
  description: 由 L1 管理的 L2 行业本体；只约束 L2 行业知识实例。四维度精简后的关系集，全部只引用保留的 15 个实体类型，无隐含"参照品牌"依赖。
  cross_layer_relations: false
relation_types:

# ============================== 市场结构 ==============================
- relation: belongs_to
  description: 产品归属某个品类
  description_en: Product belongs to a category
  subject_types:
  - product
  object_types:
  - category
  cardinality: many-to-one
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: Salesforce Sales Cloud
    relation: belongs_to
    object: CRM
  relation_id: l2_industry.belongs_to
  layer: l2
  owner_layer: l2
  ontology_group: market_structure

- relation: has_category
  description: 行业包含某个品类
  description_en: Industry has a category
  subject_types:
  - industry
  object_types:
  - category
  cardinality: one-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: 企业软件
    relation: has_category
    object: CRM
  relation_id: l2_industry.has_category
  layer: l2
  owner_layer: l2
  ontology_group: market_structure

- relation: operates_in
  description: 品牌在某个行业中运营
  description_en: Brand operates in an industry
  subject_types:
  - brand
  object_types:
  - industry
  cardinality: many-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: Salesforce
    relation: operates_in
    object: 企业软件
  relation_id: l2_industry.operates_in
  layer: l2
  owner_layer: l2
  ontology_group: market_structure

- relation: active_in
  description: 品牌或产品活跃于某个区域市场
  description_en: Brand or product is active in a regional market
  subject_types:
