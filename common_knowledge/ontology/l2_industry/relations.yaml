  relation_id: l2_industry.drives
  layer: l2
  owner_layer: l2
  ontology_group: opportunity_risk

# ============================== 竞品格局 ==============================
- relation: competes_with
  description: 并列产品品牌之间存在双向竞争关系，不区分配置参照
  description_en: Peer brands or products compete (symmetric, no reference brand)
  subject_types:
  - brand
  - product
  object_types:
  - brand
  - product
  cardinality: many-to-many
  bidirectional: true
  inverse_relation: competes_with
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: Salesforce
    relation: competes_with
    object: HubSpot
  relation_id: l2_industry.competes_with
  layer: l2
  owner_layer: l2
  ontology_group: competition

- relation: alternative_to
  description: 一个产品可作为另一个产品的替代方案（双向对称）
  description_en: Product is an alternative to another product (symmetric)
  subject_types:
  - product
  object_types:
  - product
  cardinality: many-to-many
  bidirectional: true
  inverse_relation: alternative_to
  confidence_required: true
  source_refs_required: false
  version: 1.0.0
  examples:
  - subject: Notion
    relation: alternative_to
    object: Confluence
  relation_id: l2_industry.alternative_to
  layer: l2
  owner_layer: l2
  ontology_group: competition

- relation: offers
  description: 品牌提供某个产品
  description_en: Brand offers a product
  subject_types:
  - brand
  object_types:
  - product
  cardinality: one-to-many
  bidirectional: false
  confidence_required: true
  source_refs_required: true
  version: 1.0.0
  examples:
  - subject: Salesforce
    relation: offers
