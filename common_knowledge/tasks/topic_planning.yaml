# GEO 第一层通用知识层 — 任务模板：主题规划
# 版本: 1.0.0
# 范围: 跨品牌、跨行业复用的方法与规范层

meta:
  version: 1.0.0
  created_at: 2026-08-07
  updated_at: 2026-08-07
  status: active
  scope: shared

task:
  id: task_topic_planning
  name: 主题规划
  name_en: Topic Planning
  version: 1.0.0
  purpose: >
    基于品牌能力、行业主题、用户问题和搜索观测，
    发现内容机会并生成主题优先级排序。
  description: >
    主题规划任务综合分析品牌知识、行业动态和用户需求，
    识别具有高价值的内容主题机会。输出包括主题机会列表、
    优先级排序、内容缺口分析和推荐内容类型。

  required_context:
    - brand_profile:
        description: 品牌基本信息
        source: 品牌导入任务输出
        fields: [brand_id, canonical_name, industry, products]
    - industry_topics:
        description: 行业核心主题和子主题
        source: 行业知识库或手动配置
        fields: [topic_id, canonical_name, parent_topic_id, search_volume, competition_level]
    - audience_and_use_cases:
        description: 目标用户角色和使用场景
        source: 品牌导入任务输出
        fields: [audience_id, canonical_name, pain_points, use_case_ids]
    - competitor_coverage:
        description: 竞品内容覆盖情况
        source: 竞品发现任务输出
        fields: [competitor_id, covered_topics, content_strengths, content_weaknesses]
    - content_inventory:
        description: 现有内容资产
        source: 内容审计任务输出
        fields: [content_id, canonical_name, content_type, has_topic, covers]
    - recent_observations:
        description: 近期搜索和行业观测
        source: 搜索观测库
        fields: [observation_id, observation_type, platform, query_context, observed_at]

  optional_context:
    - authoritative_sources:
        description: 行业权威来源
        source: 行业报告、学术论文
        fields: [source_id, source_type, authority_level, url]
    - historical_performance:
        description: 历史内容表现数据
        source: 分析工具
        fields: [content_id, traffic, engagement, conversion]
    - search_trends:
        description: 搜索趋势数据
        source: Google Trends, 百度指数等
        fields: [topic_id, trend_direction, trend_strength, timeframe]

  output_schema: topic_opportunity_list
  output_fields:
    - opportunities:
        type: array
        description: 主题机会列表
        item_fields:
          - topic_id: 主题 ID
          - topic_name: 主题名称
          - opportunity_type: 机会类型（new_topic / gap_fill / competitive / trending）
          - relevance_score: 品牌相关度（0.0-1.0）
          - demand_score: 用户需求度（0.0-1.0）
          - competition_score: 竞争激烈度（0.0-1.0）
          - opportunity_score: 综合机会评分（0.0-1.0）
          - priority: 优先级（critical / high / medium / low）
          - recommended_content_types: 推荐内容类型
          - target_audiences: 目标用户角色
          - related_prompts: 关联提问词
          - evidence: 支持证据
    - content_gaps:
        type: array
        description: 内容缺口
        item_fields:
          - topic_id: 主题 ID
          - gap_description: 缺口描述
          - competitor_coverage: 竞品是否覆盖
          - urgency: 紧迫度
    - topic_clusters:
        type: array
        description: 主题集群
        item_fields:
          - cluster_name: 集群名称
          - pillar_topic: 支柱主题
          - subtopics: 子主题列表
          - coverage_score: 当前覆盖度

  rules:
    - rule: topic_must_map_to_audience_problem
      description: 每个主题机会必须映射到至少一个用户角色的具体问题
      severity: critical

    - rule: brand_claims_require_evidence
      description: 基于品牌主张的机会点必须有独立证据支撑
      severity: high

    - rule: do_not_use_expired_observations_as_facts
      description: 不应将过期观测数据用作事实性依据
      severity: critical

    - rule: competitive_differentiation
      description: 识别竞品未覆盖或覆盖薄弱的机会点
      severity: high

    - rule: topic_hierarchy_consistency
      description: 主题关系应符合 entities.yaml 中定义的层级结构
      severity: medium

    - rule: evidence_chain_transparency
      description: 每个机会点应追溯其推导证据链
      severity: medium

    - rule: avoid_trend_only
      description: 不应仅凭短期趋势推荐主题，需结合品牌能力和用户需求
      severity: medium

  failure_mode: insufficient_evidence
  failure_handling:
    condition: 缺少足够的品牌能力、用户需求或竞品信息
    action: 基于可用信息生成部分机会列表，标记信息缺口，降低置信度
    recovery: 补充信息后重新执行分析

  quality_checks:
    - check: opportunity_traceability
      description: 每个机会点可追溯到具体的证据
      method: 检查 evidence 字段不为空且来源有效

    - check: audience_problem_mapping
      description: 每个机会点映射到具体的用户问题
      method: 验证 topic → problem → audience 关系链

    - check: priority_justification
      description: 优先级排序有明确的评分依据
      method: 检查 opportunity_score 的组成因子均有值

    - check: competitor_awareness
      description: 机会分析考虑了竞品覆盖情况
      method: 检查 competitor_coverage 被纳入评分

    - check: content_type_appropriateness
      description: 推荐的内容类型适合对应的意图和阶段
      method: 与 intent_types.yaml 中的 content_types 建议比对

  metric_refs: []
  # 预留：topic_opportunity_score, content_gap_count, coverage_index

