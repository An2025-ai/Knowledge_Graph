# GEO 第一层通用知识层 — 任务模板：搜索诊断
# 版本: 1.0.0
# 范围: 跨品牌、跨行业复用的方法与规范层

meta:
  version: 1.0.0
  created_at: 2026-08-07
  updated_at: 2026-08-07
  status: active
  scope: shared

task:
  id: task_search_diagnosis
  name: 搜索诊断
  name_en: Search Diagnosis
  version: 1.0.0
  purpose: >
    诊断品牌在搜索和生成式引擎中的可见度表现，
    识别品牌提及、引用来源、内容缺口和优化机会。
  description: >
    搜索诊断任务通过分析品牌在传统搜索和 AI 搜索中的表现，
    评估品牌可见度、识别引用模式、发现负面提及和内容缺口，
    并生成可操作的优化建议。

  required_context:
    - brand_profile:
        description: 品牌基本信息
        source: 品牌导入任务输出
        fields: [brand_id, canonical_name, aliases, products, industry]
    - target_prompts:
        description: 目标提问词列表
        source: 提问词生成任务输出
        fields: [prompt_id, canonical_name, intent_id, decision_stage]
    - search_observations:
        description: 搜索观测数据
        source: 搜索观测库
        fields: [observation_id, platform, prompt_id, result_snapshot, observed_at]
    - competitor_list:
        description: 竞品列表
        source: 竞品发现任务输出
        fields: [competitor_id, canonical_name, market_position]

  optional_context:
    - historical_observations:
        description: 历史搜索观测数据（用于趋势分析）
        source: 搜索观测库
    - content_inventory:
        description: 现有内容资产
        source: 内容审计任务输出
    - industry_benchmarks:
        description: 行业搜索表现基准
        source: 行业报告、工具数据
    - ai_platform_behavior:
        description: AI 搜索引擎行为特征
        source: 学术研究、产品文档

  output_schema: search_diagnosis_report
  output_fields:
    - visibility_summary:
        type: object
        description: 可见度摘要
        fields:
          - overall_score: 综合可见度评分
          - brand_mention_rate: 品牌提及率
          - citation_rate: 引用率
          - share_of_voice: 声量份额
          - trend_direction: 趋势方向（improving / stable / declining）
    - platform_breakdown:
        type: array
        description: 各平台表现
        item_fields:
          - platform: 平台名称
          - mention_count: 提及次数
          - citation_count: 引用次数
          - sentiment: 情感倾向
          - top_prompts: 表现最好的提问词
          - weak_prompts: 表现最差的提问词
    - competitor_comparison:
        type: array
        description: 竞品对比
        item_fields:
          - competitor_id: 竞品 ID
          - share_of_voice: 声量份额
          - strength_areas: 优势领域
          - weakness_areas: 劣势领域
    - content_gaps:
        type: array
        description: 搜索维度内容缺口
        item_fields:
          - prompt_id: 提问词 ID
          - gap_type: 缺口类型（no_mention / no_citation / negative_sentiment / competitor_dominant）
          - severity: 严重程度
          - recommended_action: 建议操作
    - optimization_recommendations:
        type: array
        description: 优化建议
        item_fields:
          - recommendation: 建议内容
          - priority: 优先级
          - expected_impact: 预期影响
          - effort_level: 实施难度
          - related_prompts: 关联提问词

  rules:
    - rule: observation_is_not_fact
      description: 搜索观测结果是快照，不是永久事实，诊断结论必须标注观测时间
      severity: critical

    - rule: cross_platform_consistency
      description: 需要在多个平台/时间点观测后才能得出一致性结论
      severity: high

    - rule: competitor_benchmark_required
      description: 品牌可见度评估必须有竞品对比基准
      severity: high

    - rule: distinguish_mention_from_citation
      description: 必须区分品牌提及（mention）和来源引用（citation）
      severity: high

    - rule: sentiment_accuracy
      description: 情感分析必须考虑上下文，避免误判
      severity: medium

    - rule: time_bounded_conclusions
      description: 所有诊断结论必须标注观测时间范围
      severity: medium

    - rule: platform_specific_behavior
      description: 不同 AI 搜索引擎行为不同，不可混为一谈
      severity: medium

  failure_mode: insufficient_observations
  failure_handling:
    condition: 缺少足够的搜索观测数据
    action: 标记为"数据不足"，建议增加观测频次和覆盖范围
    recovery: 积累至少 3 次不同时间的观测数据后重新诊断

  quality_checks:
    - check: observation_sufficiency
      description: 观测数据量是否足够得出可靠结论
      method: 检查观测次数 >= 3 且时间跨度 >= 7 天

    - check: platform_coverage
      description: 是否覆盖主要搜索平台
      method: 检查至少覆盖 2 个平台

    - check: prompt_coverage
      description: 诊断是否覆盖所有主要意图类型
      method: 检查 intent 覆盖度 >= 80%

    - check: competitor_comparison_validity
      description: 竞品对比使用相同提问词和相同时间窗口
      method: 检查 prompt_id 和 observed_at 范围一致

    - check: recommendation_actionability
      description: 优化建议具体可操作
      method: 检查每条建议包含具体的 related_prompts 和 expected_impact

  metric_refs: []
  # 预留：brand_visibility_score, share_of_voice, citation_rate, sentiment_score

changelog:
  - version: 1.0.0
    date: 2026-08-07
    changes:
      - 初始版本，定义搜索诊断任务模板
      - 包含可见度评估、平台分析、竞品对比和优化建议
    author: Brand Atlas Team